<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RP Munka Portál</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#121212;
  color:#fff;
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1f1f1f;
  padding:15px;
  border-radius:10px;
  margin:10px 0;
}

input,select,textarea,button{
  width:100%;
  padding:10px;
  margin:6px 0;
  border:none;
  border-radius:6px;
}

button{
  background:#7a0000;
  color:white;
  cursor:pointer;
}

.ad{
  background:#2a2a2a;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
}

.featured{
  border:2px solid gold;
  background:#2b2400;
}
</style>
</head>

<body>

<h1>RP Munka Portál</h1>

<!-- ADMIN -->
<div class="card">
  <h2>Admin belépés</h2>
  <input type="password" id="adminPass" placeholder="Admin jelszó">
  <button onclick="loginAdmin()">Belépés</button>
</div>

<!-- DASHBOARD -->
<div class="card">
  <h2>📊 Admin Dashboard</h2>
  <p id="stats"></p>
</div>

<!-- JELENTKEZŐK -->
<div class="card">
  <h2>🧑‍💼 Jelentkezők</h2>
  <div id="applications"></div>
</div>

<div class="card">
<h2>Új hirdetés</h2>

<select id="category">
<option value="mentos">Mentős</option>
<option value="rendor">Rendőr</option>
<option value="szerelo">Szerelő</option>
<option value="telepi">Telepi munka</option>
<option value="etterem">Étterem</option>
<option value="civil">Civil</option>
<option value="mafia">Maffia</option>
<option value="banda">Banda</option>
</select>

<input id="title" placeholder="Cím">
<textarea id="desc" placeholder="Leírás"></textarea>

<button onclick="addAd()">Közzététel</button>
</div>

<div class="card">
<h2>⭐ Kiemelt hirdetések</h2>
<div id="featuredAds"></div>
</div>

<div class="card">
<h2>Normál hirdetések</h2>
<div id="ads"></div>
</div>

<div class="card">
<h2>💬 Chat</h2>
<input id="chatAdId" placeholder="Hirdetés ID">
<input id="chatMsg" placeholder="Üzenet">
<button onclick="sendChat()">Küldés</button>
<div id="chatBox"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  orderBy,
  deleteDoc,
  doc,
  updateDoc,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy1xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:3797a2fc935c63a0464b89",
  measurementId: "G-V9Z9LYT0KL"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let isAdmin = false;
const ADMIN_PASSWORD = "1234567";

/* LOGIN */
window.loginAdmin = function(){
  const pass = document.getElementById("adminPass").value;

  if(pass === ADMIN_PASSWORD){
    isAdmin = true;
    alert("Admin ON");
    loadDashboard();
    loadApplications();
  } else {
    alert("Hibás jelszó");
  }
}

/* ADD AD */
window.addAd = async function(){
  const category = document.getElementById("category").value;
  const title = document.getElementById("title").value;
  const desc = document.getElementById("desc").value;

  const expiresAt = Date.now() + 7*24*60*60*1000;

  await addDoc(collection(db,"ads"),{
    category,title,desc,
    featured:false,
    status:"active",
    createdAt:Date.now(),
    expiresAt
  });
}

/* DELETE */
window.deleteAd = async function(id){
  if(!isAdmin) return;
  await deleteDoc(doc(db,"ads",id));
}

/* FEATURED */
window.toggleFeatured = async function(id,current){
  if(!isAdmin) return;
  await updateDoc(doc(db,"ads",id),{
    featured:!current
  });
}

/* STATUS */
window.setStatus = async function(id,status){
  if(!isAdmin) return;
  await updateDoc(doc(db,"ads",id),{status});
}

/* APPLY */
window.applyAd = async function(id){
  const name = prompt("Neved:");
  const msg = prompt("Üzenet:");
  if(!name||!msg) return;

  await addDoc(collection(db,"applications"),{
    adId:id,name,msg,createdAt:Date.now()
  });
  alert("Jelentkezés elküldve");
}

/* CHAT SEND */
window.sendChat = async function(){
  const adId = document.getElementById("chatAdId").value;
  const msg = document.getElementById("chatMsg").value;

  await addDoc(collection(db,"comments"),{
    adId,text:msg,createdAt:Date.now()
  });

  document.getElementById("chatMsg").value="";
}

/* DASHBOARD */
window.loadDashboard = async function(){
  const ads = await getDocs(collection(db,"ads"));
  const apps = await getDocs(collection(db,"applications"));
  const coms = await getDocs(collection(db,"comments"));

  document.getElementById("stats").innerHTML =
    `📌 Hirdetés: ${ads.size}<br>
     🧑‍💼 Jelentkezés: ${apps.size}<br>
     💬 Chat: ${coms.size}`;
}

/* APPLICATIONS */
window.loadApplications = function(){
  onSnapshot(collection(db,"applications"),(snap)=>{
    const box = document.getElementById("applications");
    box.innerHTML="";

    snap.forEach(d=>{
      const x = d.data();

      box.innerHTML += `
        <div class="ad">
          <b>${x.adId}</b><br>
          ${x.name}<br>
          ${x.msg}
        </div>
      `;
    });
  });
}

/* CHAT LOAD */
onSnapshot(collection(db,"comments"),(snap)=>{
  const box = document.getElementById("chatBox");
  box.innerHTML="";

  snap.forEach(d=>{
    const x = d.data();
    box.innerHTML += `
      <div class="ad">
        <b>${x.adId}</b><br>
        ${x.text}
      </div>
    `;
  });
});

/* ADS LIST */
const q = query(collection(db,"ads"),orderBy("createdAt","desc"));

onSnapshot(q,(snap)=>{
  const featured = document.getElementById("featuredAds");
  const ads = document.getElementById("ads");

  featured.innerHTML="";
  ads.innerHTML="";

  snap.forEach(async d=>{
    const x = d.data();

    if(x.expiresAt < Date.now()){
      await deleteDoc(doc(db,"ads",d.id));
      return;
    }

    const el = `
      <div class="ad ${x.featured?'featured':''}">
        <b>${x.title}</b><br>
        ${x.category} | ${x.status}
        <p>${x.desc}</p>

        <button onclick="applyAd('${d.id}')">Jelentkezem</button>
        <button onclick="sendChat()">Chat</button>

        ${isAdmin?`
          <button onclick="deleteAd('${d.id}')">Törlés</button>
          <button onclick="toggleFeatured('${d.id}',${x.featured})">⭐</button>
          <button onclick="setStatus('${d.id}','closed')">Lezár</button>
        `:""}
      </div>
    `;

    ads.innerHTML += el;
  });
});
</script>

</body>
</html>
