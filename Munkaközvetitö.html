<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>MMO Város 3.0</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
}

.container{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(10,45px);
    gap:4px;
}

.cell{
    width:45px;
    height:45px;
    background:#333;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border-radius:6px;
}

.panel button{
    margin:5px;
    padding:8px;
    border:none;
    background:#5865F2;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

.chat{
    width:250px;
    height:420px;
    background:#222;
    display:flex;
    flex-direction:column;
    border-radius:10px;
    overflow:hidden;
}

.messages{
    flex:1;
    overflow:auto;
    padding:10px;
    font-size:12px;
}

input{
    padding:8px;
    border:none;
    outline:none;
}
</style>
</head>

<body>

<h1>🏙️ MMO Város 3.0</h1>

<div id="info"></div>

<div class="container">

<div>
<div class="panel">
<button onclick="setBuild('🌳')">🌳</button>
<button onclick="setBuild('🏠')">🏠</button>
<button onclick="setBuild('🏢')">🏢</button>
<button onclick="setBuild('🏰')">🏰</button>
</div>

<div class="grid" id="grid"></div>
</div>

<div class="chat">
<div class="messages" id="messages"></div>
<input id="msg" placeholder="Chat...">
<button onclick="sendMsg()">Küldés</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
getFirestore,
doc,
setDoc,
getDoc,
onSnapshot,
collection,
addDoc,
serverTimestamp,
query,
where,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
getAuth,
signInAnonymously,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:3797a2fc935c63a0464b89",
  measurementId: "G-V9Z9LYT0KL"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let user;
let selected = "🏠";

// 💰 árak + XP
const data = {
"🌳": {price:1, xp:1, income:1},
"🏠": {price:10, xp:5, income:3},
"🏢": {price:30, xp:15, income:8},
"🏰": {price:80, xp:40, income:20}
};

// 🏆 rangok
function getRank(xp){
if(xp < 50) return "citizen";
if(xp < 150) return "builder";
if(xp < 400) return "architect";
return "mayor";
}

// 🔐 login
signInAnonymously(auth);

onAuthStateChanged(auth, async (u)=>{

user = u;

await ensureUser();
loadUser();
loadWorld();
loadChat();
startIncome();

});

// 👤 user init
async function ensureUser(){

const ref = doc(db,"users",user.uid);
const snap = await getDoc(ref);

if(!snap.exists()){
await setDoc(ref,{
name:"Player_"+user.uid.slice(0,5),
money:100,
xp:0
});
}

}

// 📊 user UI
function loadUser(){

const ref = doc(db,"users",user.uid);

onSnapshot(ref,(snap)=>{

const d = snap.data();

document.getElementById("info").innerHTML =
`👤 ${d.name} | 💰 ${d.money}$ | ⭐ XP: ${d.xp} | 🧑‍⚖️ ${getRank(d.xp)}`;

});

}

// 🧱 map
const grid = document.getElementById("grid");

for(let y=0;y<10;y++){
for(let x=0;x<10;x++){

const c = document.createElement("div");
c.className = "cell";
c.id = x+"_"+y;

c.onclick = async ()=>{

const tileRef = doc(db,"tiles",c.id);
const userRef = doc(db,"users",user.uid);

const uSnap = await getDoc(userRef);
const price = data[selected].price;

if(uSnap.data().money < price){
alert("Nincs pénz!");
return;
}

await setDoc(tileRef,{
type:selected,
owner:user.uid
},{merge:true});

await setDoc(userRef,{
...uSnap.data(),
money: uSnap.data().money - price,
xp: uSnap.data().xp + data[selected].xp
});

};

grid.appendChild(c);

}
}

// 🌍 world render
function loadWorld(){

onSnapshot(collection(db,"tiles"),(snap)=>{

snap.forEach(d=>{

const el = document.getElementById(d.id);
if(el) el.innerText = d.data().type;

});

});

}

// 💬 chat
window.sendMsg = async ()=>{

const text = document.getElementById("msg").value;
if(!text) return;

await addDoc(collection(db,"chat"),{
user:user.uid.slice(0,5),
text,
time:serverTimestamp()
});

document.getElementById("msg").value="";

};

function loadChat(){

onSnapshot(collection(db,"chat"),(snap)=>{

const box = document.getElementById("messages");
box.innerHTML="";

snap.forEach(m=>{

const d = m.data();

const div = document.createElement("div");
div.innerText = `${d.user}: ${d.text}`;

box.appendChild(div);

});

});

}

// 💰 income system
function startIncome(){

setInterval(async ()=>{

const q = query(
collection(db,"tiles"),
where("owner","==",user.uid)
);

const tiles = await getDocs(q);

let income = 0;

tiles.forEach(t=>{
income += data[t.data().type]?.income || 0;
});

const ref = doc(db,"users",user.uid);
const uSnap = await getDoc(ref);

await setDoc(ref,{
...uSnap.data(),
money: uSnap.data().money + income
});

}, 8000);

}

</script>

</body>
</html>
