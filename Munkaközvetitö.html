<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RP Munka Közvetítő</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#121212;
    color:white;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

.form-box{
    background:#1e1e1e;
    padding:20px;
    border-radius:12px;
    margin-bottom:30px;
}

input, select, textarea{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:15px;
    border:none;
    border-radius:8px;
    background:#2a2a2a;
    color:white;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#00b894;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#00a383;
}

.jobs{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:15px;
}

.job{
    background:#1e1e1e;
    padding:15px;
    border-radius:12px;
    border-left:5px solid #00b894;
}

.job h3{
    margin-bottom:10px;
}

.job p{
    margin:5px 0;
}

.salary{
    color:#00e676;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

<h1>💼 RP Munka Közvetítő</h1>

<div class="form-box">
<h2>Új munka létrehozása</h2>

<input type="text" id="creator" placeholder="Karakternév">

<input type="text" id="title" placeholder="Munka címe">

<select id="category">
<option>🚚 Szállítás</option>
<option>🔧 Szerelés</option>
<option>🏠 Ingatlan</option>
<option>🎉 Esemény</option>
<option>💼 Egyéb</option>
</select>

<input type="text" id="salary" placeholder="Fizetés">

<textarea id="description" rows="4" placeholder="Munka leírása"></textarea>

<button onclick="createJob()">Munka közzététele</button>
</div>

<h2>📋 Aktív munkák</h2>

<div class="jobs" id="jobs">

<div class="job">
<h3>🚚 Sofőr keresése</h3>
<p><strong>Létrehozta:</strong> Kovács János</p>
<p class="salary">15 000 $</p>
<p>3 rakomány elszállítása a kikötőből.</p>
</div>

</div>

</div>

<script>
function createJob(){

let creator = document.getElementById("creator").value;
let title = document.getElementById("title").value;
let category = document.getElementById("category").value;
let salary = document.getElementById("salary").value;
let description = document.getElementById("description").value;

if(!creator || !title || !salary || !description){
    alert("Tölts ki minden mezőt!");
    return;
}

let job = document.createElement("div");
job.className = "job";

job.innerHTML = `
<h3>${category} ${title}</h3>
<p><strong>Létrehozta:</strong> ${creator}</p>
<p class="salary">${salary}</p>
<p>${description}</p>
`;

document.getElementById("jobs").prepend(job);

document.getElementById("creator").value="";
document.getElementById("title").value="";
document.getElementById("salary").value="";
document.getElementById("description").value="";
}
</script>

</body>
</html>
