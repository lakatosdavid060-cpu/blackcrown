<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RP Munka Portál</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#121212;
  color:#fff;
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.card{
  background:#1f1f1f;
  padding:15px;
  border-radius:10px;
  margin:10px 0;
}

input,select,textarea,button{
  width:100%;
  padding:10px;
  margin:6px 0;
  border:none;
  border-radius:6px;
}

button{
  background:#7a0000;
  color:white;
  cursor:pointer;
}

.ad{
  background:#2a2a2a;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
}

.featured{
  border:2px solid gold;
  background:#2b2400;
}

.deleteBtn{
  background:#b30000;
}

.adminToggle{
  background:#444;
}
</style>
</head>

<body>

<h1>RP Munka Portál</h1>

<button class="adminToggle" onclick="toggleAdmin()">Admin mód: OFF</button>

<div class="card">
<h2>Új hirdetés</h2>

<select id="category">
<option value="mentos">Mentős</option>
<option value="rendor">Rendőr</option>
<option value="szerelo">Szerelő</option>
<option value="telepi">Telepi munka</option>
<option value="etterem">Étterem</option>
<option value="civil">Civil</option>
<option value="mafia">Maffia</option>
<option value="banda">Banda</option>
</select>

<input id="title" placeholder="Cím">
<textarea id="desc" placeholder="Leírás"></textarea>

<button onclick="addAd()">Közzététel</button>
</div>

<div class="card">
<h2>⭐ Kiemelt hirdetések</h2>
<div id="featuredAds"></div>
</div>

<div class="card">
<h2>Normál hirdetések</h2>
<div id="ads"></div>
</div>

<div class="card">
<h2>Dark oldal (Maffia / Banda)</h2>
<div id="darkAds"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  query,
  orderBy,
  deleteDoc,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_BUCKET",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let isAdmin = false;

/* ADMIN TOGGLE */
window.toggleAdmin = function(){
  isAdmin = !isAdmin;
  document.querySelector(".adminToggle").innerText =
    "Admin mód: " + (isAdmin ? "ON" : "OFF");
}

/* ADD AD */
window.addAd = async function(){
  const category = document.getElementById("category").value;
  const title = document.getElementById("title").value;
  const desc = document.getElementById("desc").value;

  if(!title || !desc) return alert("Tölts ki minden mezőt!");

  const daysToLive = 7;
  const expiresAt = Date.now() + daysToLive * 24 * 60 * 60 * 1000;

  await addDoc(collection(db,"ads"),{
    category,
    title,
    desc,
    featured:false,
    createdAt: Date.now(),
    expiresAt
  });

  document.getElementById("title").value="";
  document.getElementById("desc").value="";
}

/* DELETE */
window.deleteAd = async function(id){
  if(!confirm("Biztos törlöd?")) return;
  await deleteDoc(doc(db,"ads",id));
}

/* TOGGLE FEATURED */
window.toggleFeatured = async function(id,current){
  await updateDoc(doc(db,"ads",id),{
    featured: !current
  });
}

/* LIST */
const q = query(collection(db,"ads"), orderBy("createdAt","desc"));

onSnapshot(q,(snapshot)=>{
  const featuredAds = document.getElementById("featuredAds");
  const ads = document.getElementById("ads");
  const dark = document.getElementById("darkAds");

  featuredAds.innerHTML="";
  ads.innerHTML="";
  dark.innerHTML="";

  snapshot.forEach(async (docSnap)=>{
    const data = docSnap.data();
    const id = docSnap.id;

    /* AUTO DELETE EXPIRED */
    if(data.expiresAt && data.expiresAt < Date.now()){
      await deleteDoc(doc(db,"ads",id));
      return;
    }

    const el = `
      <div class="ad ${data.featured ? 'featured' : ''}">
        ${data.featured ? "⭐ <b>KIEMELT</b><br>" : ""}
        <b>${data.title}</b><br>
        <small>${data.category}</small>
        <p>${data.desc}</p>

        ${isAdmin ? `
          <button class="deleteBtn" onclick="deleteAd('${id}')">Törlés</button>
          <button onclick="toggleFeatured('${id}',${data.featured})">
            ${data.featured ? "Kiemelés OFF" : "Kiemelés ON"}
          </button>
        ` : ""}
      </div>
    `;

    if(data.featured){
      featuredAds.innerHTML += el;
    } else if(data.category === "mafia" || data.category === "banda"){
      dark.innerHTML += el;
    } else {
      ads.innerHTML += el;
    }
  });
});
</script>

</body>
</html>
