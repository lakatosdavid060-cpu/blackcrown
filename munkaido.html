<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Munkaidő PRO UI</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  set,
  update,
  onValue,
  remove,
  onDisconnect
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* RANGOK */
const jobs = {
  Boss: 500,
  UnderBoss: 400,
  Capo: 300,
  Soldier: 200
};

let startTime=null, timer=null, paused=false, pausedTime=0, pauseStart=null;
let restored=false;

/* FORMAT */
const format = s =>
  `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m ${s%60}s`;

const formatDate = (ts) => {
  const d = new Date(ts);
  return d.toLocaleString("hu-HU", {
    year: "numeric",
    month: "long",
    day: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
};

const getPay = () => jobs[document.getElementById("rang").value] || 300;

const getDiff = () => {
  let d = Math.floor((Date.now()-startTime)/1000)-pausedTime;
  if(paused && pauseStart){
    d -= Math.floor((Date.now()-pauseStart)/1000);
  }
  return Math.max(0,d);
};

/* DASHBOARD */
function updateDashboard(diff, money){
  document.getElementById("d_money").innerText = money+"$";
  document.getElementById("d_time").innerText = format(diff);
  document.getElementById("d_rank").innerText =
    document.getElementById("rang").value;
}

/* GLOBAL LOG */
onValue(ref(db,"log1"),(snapshot)=>{
  const box=document.getElementById("globalLog");
  box.innerHTML="";
  snapshot.forEach(child=>{
    const v=child.val();
    const div=document.createElement("div");
    div.className="log";
    div.innerHTML = `
      <div><b>👤 ${v.nev}</b></div>
      <div>💰 ${v.money}$ • ⏱ ${format(v.time)}</div>
      <div class="date">📅 ${formatDate(v.createdAt)}</div>
    `;
    box.prepend(div);
  });
});

/* USERS */
const users=[
  "David Jackson",
  "Dylen Benedict",
  "Olla Ronaldo",
  "Clinton Morris",
  "Jackson West"
];

/* USER LOGS */
function loadUserLogs(){
  users.forEach(name=>{
    const safeName = name.replaceAll(" ","_");
    const box=document.getElementById("log_"+safeName);

    onValue(ref(db,`userLogs/${safeName}`),(snapshot)=>{
      box.innerHTML="";
      snapshot.forEach(child=>{
        const v=child.val();
        const div=document.createElement("div");
        div.className="log user";
        div.innerHTML = `
          <div>💰 ${v.money}$ • ⏱ ${format(v.time)}</div>
          <div class="date">📅 ${formatDate(v.createdAt)}</div>
        `;
        box.prepend(div);
      });
    });
  });
}

/* ONLINE USERS */
let onlineData = {};

onValue(ref(db,"activeUsers"),(snapshot)=>{
  onlineData = {};
  snapshot.forEach(child=>{
    onlineData[child.key] = child.val();
  });
  renderOnline();
});

function renderOnline(){
  const box=document.getElementById("onlineList");
  box.innerHTML="";

  Object.values(onlineData).forEach(v=>{
    let diff = Math.floor((Date.now() - v.startedAt)/1000);

    if(v.paused && v.pauseStart){
      diff -= Math.floor((Date.now()-v.pauseStart)/1000);
    }

    diff -= v.pausedTime || 0;
    diff = Math.max(0,diff);

    const div=document.createElement("div");
    div.className="log";
    div.innerText=`🟢 ${v.nev} | 💼 ${v.rang} | ⏱ ${format(diff)}`;

    box.appendChild(div);
  });
}

setInterval(()=>{
  if(Object.keys(onlineData).length){
    renderOnline();
  }
},1000);

/* TIMER */
function startTimer(){
  clearInterval(timer);
  timer=setInterval(()=>{
    if(!startTime) return;

    const diff=getDiff();
    const money=Math.floor((diff/3600)*getPay());

    document.getElementById("live").innerText =
      `⏱ ${format(diff)} | 💰 ${money}$`;

    updateDashboard(diff,money);
  },1000);
}

/* START */
window.start=function(){
  const nev=document.getElementById("nev").value;
  const rang=document.getElementById("rang").value;

  startTime=Date.now();
  paused=false;
  pausedTime=0;
  pauseStart=null;

  startTimer();

  const safeNev = nev.replaceAll(" ","_");
  const userRef = ref(db,`activeUsers/${safeNev}`);

  set(userRef,{
    nev,
    rang,
    startedAt:startTime,
    paused:false,
    pausedTime:0,
    pauseStart:null
  });

  onDisconnect(userRef).remove();
};

/* PAUSE */
window.pause=function(){
  if(!paused){
    pauseStart=Date.now();
    paused=true;

    const nev=document.getElementById("nev").value;
    const safeNev = nev.replaceAll(" ","_");

    update(ref(db,`activeUsers/${safeNev}`),{
      paused:true,
      pauseStart
    });
  }
};

/* RESUME */
window.resume=function(){
  if(paused){
    pausedTime += Math.floor((Date.now()-pauseStart)/1000);
  }
  paused=false;

  const nev=document.getElementById("nev").value;
  const safeNev = nev.replaceAll(" ","_");

  update(ref(db,`activeUsers/${safeNev}`),{
    paused:false,
    pausedTime,
    pauseStart:null
  });
};

/* END */
window.end=async function(){
  const nev=document.getElementById("nev").value;

  if(paused && pauseStart){
    pausedTime += Math.floor((Date.now()-pauseStart)/1000);
  }

  clearInterval(timer);

  const diff=getDiff();
  const money=Math.floor((diff/3600)*getPay());

  document.getElementById("status").innerText =
    `${format(diff)} | ${money}$`;

  await set(push(ref(db,"log1")),{
    nev,
    money,
    time:diff,
    createdAt:Date.now()
  });

  const safeNev = nev.replaceAll(" ","_");

  await set(push(ref(db,`userLogs/${safeNev}`)),{
    time:diff,
    money,
    createdAt:Date.now()
  });

  await remove(ref(db,`activeUsers/${safeNev}`));
};

/* RESTORE */
function restoreSession(){
  if(restored) return;

  const nev=document.getElementById("nev").value;
  const safeNev = nev.replaceAll(" ","_");

  onValue(ref(db,`activeUsers/${safeNev}`),(snap)=>{
    if(!snap.exists()) return;

    const data = snap.val();

    startTime = data.startedAt;
    paused = data.paused;
    pausedTime = data.pausedTime || 0;
    pauseStart = data.pauseStart || null;

    startTimer();
    restored=true;
  });
}

/* INIT */
loadUserLogs();
restoreSession();

</script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.container{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:20px;
}

.panel{
  width:300px;
  background:#111827;
  padding:20px;
  border-radius:15px;
}

.dashboard{
  width:300px;
  background:#0b1220;
  padding:20px;
  border-radius:15px;
  text-align:center;
}

.card{
  background:#1f2937;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
}

select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
  background:#1f2937;
  color:white;
}

button{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:bold;
  background:linear-gradient(45deg,#3b82f6,#8b5cf6);
  color:white;
}

.log{
  font-size:13px;
  padding:10px;
  margin-bottom:6px;
  background:#1f2937;
  border-radius:10px;
  border-left:4px solid #3b82f6;
}

.date{
  font-size:11px;
  color:#9ca3af;
  margin-top:4px;
}

.user{
  border-left:4px solid #38bdf8;
}

.userBox{
  max-height:120px;
  overflow:auto;
  background:#0b1220;
  padding:8px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="panel">

<select id="nev">
<option>David Jackson</option>
<option>Dylen Benedict</option>
<option>Olla Ronaldo</option>
<option>Clinton Morris</option>
<option>Jackson West</option>
</select>

<select id="rang">
<option>Boss</option>
<option>UnderBoss</option>
<option>Capo</option>
<option>Soldier</option>
</select>

<button onclick="start()">Indítás</button>
<button onclick="pause()">Szünet</button>
<button onclick="resume()">Folytatás</button>
<button onclick="end()">Befejezés</button>

<div id="live"></div>
<div id="status"></div>

<h3>🌍 Global Log</h3>
<div id="globalLog"></div>

</div>

<div class="dashboard">
<h3>📊 Dashboard</h3>
<div class="card">💰 <span id="d_money">0$</span></div>
<div class="card">⏱ <span id="d_time">0</span></div>
<div class="card">💼 <span id="d_rank">-</span></div>

<h3>🟢 Online</h3>
<div id="onlineList" class="userBox"></div>
</div>

<div class="panel">
<h3>👤 User Logok</h3>

<div>David Jackson<div id="log_David_Jackson" class="userBox"></div></div>
<div>Dylen Benedict<div id="log_Dylen_Benedict" class="userBox"></div></div>
<div>Olla Ronaldo<div id="log_Olla_Ronaldo" class="userBox"></div></div>
<div>Clinton Morris<div id="log_Clinton_Morris" class="userBox"></div></div>
<div>Jackson West<div id="log_Jackson_West" class="userBox"></div></div>

</div>

</div>

</body>
</html>
