<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Munkaidő PRO Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase, ref, push, set, update, onValue, remove, get, onDisconnect
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* STATE */
let sessionId=null;
let startTime=null;
let paused=false;
let pauseStart=null;
let pausedTime=0;
let timer=null;
let chart;

/* RANGOK */
const jobs={
  Boss:500,
  UnderBoss:400,
  Capo:300,
  Soldier:200
};

const users=[
  "David Jackson",
  "Dylen Benedict",
  "Olla Ronaldo",
  "Clinton Morris",
  "Jackson West"
];

/* FORMAT */
const format=s=>`${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m ${s%60}s`;

function safe(){
  return document.getElementById("nev").value.replaceAll(" ","_");
}

/* START */
window.start=async()=>{
  const s=safe();

  const exists=await get(ref(db,`sessions/${s}`));
  if(exists.exists()){
    alert("Már fut munkaidő!");
    return;
  }

  sessionId=Date.now().toString();
  startTime=Date.now();
  paused=false;
  pausedTime=0;
  pauseStart=null;

  const data={
    sessionId,
    nev:document.getElementById("nev").value,
    rang:document.getElementById("rang").value,
    startTime,
    paused:false,
    pausedTime:0,
    pauseStart:null
  };

  set(ref(db,`sessions/${s}`),data);
  onDisconnect(ref(db,`sessions/${s}`)).remove();

  startTimer();
};

/* PAUSE */
window.pause=()=>{
  if(paused) return;
  pauseStart=Date.now();
  paused=true;

  update(ref(db,`sessions/${safe()}`),{paused:true,pauseStart});
};

/* RESUME */
window.resume=()=>{
  if(!paused) return;

  pausedTime+=Math.floor((Date.now()-pauseStart)/1000);
  paused=false;

  update(ref(db,`sessions/${safe()}`),{
    paused:false,
    pausedTime,
    pauseStart:null
  });
};

/* END */
window.end=async()=>{
  const s=safe();

  if(paused && pauseStart){
    pausedTime+=Math.floor((Date.now()-pauseStart)/1000);
  }

  clearInterval(timer);

  const diff=getDiff();
  const pay=jobs[document.getElementById("rang").value];
  const money=Math.floor((diff/3600)*pay);

  await set(push(ref(db,"log1")),{
    nev:document.getElementById("nev").value,
    money,
    time:diff,
    createdAt:Date.now()
  });

  await set(push(ref(db,`userLogs/${s}`)),{
    money,time:diff,createdAt:Date.now()
  });

  await remove(ref(db,`sessions/${s}`));
};

/* DIFF */
function getDiff(){
  let d=Math.floor((Date.now()-startTime)/1000)-pausedTime;

  if(paused && pauseStart){
    d-=Math.floor((Date.now()-pauseStart)/1000);
  }

  return Math.max(0,d);
}

/* TIMER */
function startTimer(){
  clearInterval(timer);

  timer=setInterval(()=>{
    if(!startTime) return;

    const diff=getDiff();
    const money=Math.floor((diff/3600)*jobs[document.getElementById("rang").value]);

    document.getElementById("live").innerText=
      `${format(diff)} • ${money}$`;
  },1000);
}

/* GLOBAL LOG + CHART */
onValue(ref(db,"log1"),snap=>{
  const box=document.getElementById("globalLog");
  box.innerHTML="";

  const stats={};

  snap.forEach(c=>{
    const v=c.val();
    stats[v.nev]=(stats[v.nev]||0)+v.money;

    const div=document.createElement("div");
    div.className="log";
    div.innerHTML=`
      <b>${v.nev}</b>
      <span>${v.money}$ • ${format(v.time)}</span>
    `;

    box.prepend(div);
  });

  renderChart(stats);
});

/* CHART */
function renderChart(data){
  const ctx=document.getElementById("chart");

  if(chart) chart.destroy();

  chart=new Chart(ctx,{
    type:"bar",
    data:{
      labels:Object.keys(data),
      datasets:[{
        label:"Kereset",
        data:Object.values(data)
      }]
    }
  });
}

/* USER LOG */
users.forEach(n=>{
  const s=n.replaceAll(" ","_");

  onValue(ref(db,`userLogs/${s}`),snap=>{
    const box=document.getElementById("log_"+s);
    box.innerHTML="";

    snap.forEach(c=>{
      const v=c.val();

      const div=document.createElement("div");
      div.className="log user";
      div.innerHTML=`
        ${v.money}$ • ${format(v.time)}
      `;

      box.prepend(div);
    });
  });
});

/* ONLINE */
onValue(ref(db,"sessions"),snap=>{
  const box=document.getElementById("online");
  box.innerHTML="";

  snap.forEach(c=>{
    const v=c.val();

    let diff=Math.floor((Date.now()-v.startTime)/1000);
    if(v.paused && v.pauseStart){
      diff-=Math.floor((Date.now()-v.pauseStart)/1000);
    }

    diff-=v.pausedTime||0;
    diff=Math.max(0,diff);

    const div=document.createElement("div");
    div.className="online";
    div.innerText=`🟢 ${v.nev} • ${format(diff)}`;

    box.appendChild(div);
  });
});

/* INIT */
</script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0b1220;
  color:white;
}

/* LAYOUT */
.container{
  display:grid;
  grid-template-columns:300px 1fr 300px;
  gap:15px;
  padding:15px;
}

/* PANELS */
.panel,.dash{
  background:#111827;
  border-radius:16px;
  padding:15px;
}

/* INPUT */
select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  border:none;
  background:#0b1220;
  color:white;
}

/* BUTTON */
button{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  border:none;
  background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  color:white;
  font-weight:bold;
}

/* LIVE */
#live{
  margin-top:10px;
  padding:10px;
  background:#0b1220;
  border-radius:10px;
}

/* LOG */
.log{
  background:#0b1220;
  padding:8px;
  margin:5px 0;
  border-radius:10px;
  font-size:13px;
  display:flex;
  justify-content:space-between;
}

/* USER LOG */
.user{border-left:3px solid #38bdf8;}

/* ONLINE */
.online{
  background:#0b1220;
  padding:8px;
  margin:5px 0;
  border-radius:10px;
}

/* RESPONSIVE */
@media(max-width:1000px){
  .container{grid-template-columns:1fr;}
}
</style>

</head>

<body>

<div class="container">

<div class="panel">

<select id="nev">
<option>David Jackson</option>
<option>Dylen Benedict</option>
<option>Olla Ronaldo</option>
<option>Clinton Morris</option>
<option>Jackson West</option>
</select>

<select id="rang">
<option>Boss</option>
<option>UnderBoss</option>
<option>Capo</option>
<option>Soldier</option>
</select>

<button onclick="start()">START</button>
<button onclick="pause()">PAUSE</button>
<button onclick="resume()">RESUME</button>
<button onclick="end()">END</button>

<div id="live"></div>

<h3>GLOBAL</h3>
<div id="globalLog"></div>

</div>

<div class="dash">

<h3>STATS</h3>
<canvas id="chart"></canvas>

<h3>ONLINE</h3>
<div id="online"></div>

</div>

<div class="panel">

<h3>USER LOGS</h3>

<div>David<div id="log_David_Jackson"></div></div>
<div>Dylen<div id="log_Dylen_Benedict"></div></div>
<div>Olla<div id="log_Olla_Ronaldo"></div></div>
<div>Clinton<div id="log_Clinton_Morris"></div></div>
<div>Jackson<div id="log_Jackson_West"></div></div>

</div>

</div>

</body>
</html>
