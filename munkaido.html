<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Munkaidő Követő PRO</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set, onChildAdded }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* RANGOK */
const jobs = {
  Boss: 500,
  UnderBoss: 400,
  Capo: 300,
  Soldier: 200
};

let startTime=null, timer=null, paused=false, pausedTime=0, pauseStart=null;

const format = s => `${Math.floor(s/3600)} óra ${Math.floor((s%3600)/60)} perc`;

const getPay = () => jobs[document.getElementById("rang").value] || 300;

const getDiff = () => {
  let d = Math.floor((Date.now()-startTime)/1000)-pausedTime;
  if(paused && pauseStart) d -= Math.floor((Date.now()-pauseStart)/1000);
  return d;
};

/* LIVE LOG */
const logRef = ref(db,"logs");

onChildAdded(logRef,(snap)=>{
  const v = snap.val();
  const box = document.getElementById("logBox");

  const div = document.createElement("div");
  div.className="log";
  div.innerText = `👤 ${v.nev} | 💰 ${v.money}$ | ⏱ ${v.time}s`;

  box.prepend(div);
});

/* TIMER */
function startTimer(){
  timer=setInterval(()=>{
    if(!startTime) return;

    const diff=getDiff();
    const money=Math.floor((diff/3600)*getPay());

    document.getElementById("live").innerText =
      `⏱ ${format(diff)} | 💰 ${money}$`;

    document.getElementById("d_money").innerText = money+"$";
    document.getElementById("d_time").innerText = format(diff);
    document.getElementById("d_rank").innerText =
      document.getElementById("rang").value;
  },1000);
}

/* ACTIONS */
window.inditas = function(){
  const nev=document.getElementById("nev").value;
  if(!nev) return alert("Adj meg nevet!");

  startTime=Date.now();
  paused=false;
  pausedTime=0;
  pauseStart=null;

  clearInterval(timer);
  startTimer();
};

window.szünet = function(){
  if(!paused){
    pauseStart=Date.now();
    paused=true;
  }
};

window.folytatas = function(){
  if(paused){
    pausedTime += Math.floor((Date.now()-pauseStart)/1000);
  }
  paused=false;
};

window.vege = async function(){
  const nev=document.getElementById("nev").value;

  if(paused && pauseStart){
    pausedTime += Math.floor((Date.now()-pauseStart)/1000);
  }

  clearInterval(timer);

  const diff=getDiff();
  const money=Math.floor((diff/3600)*getPay());

  document.getElementById("status").innerText =
    `${format(diff)} | ${money}$`;

  await set(push(ref(db,"logs")),{
    nev,
    money,
    time:diff,
    rank:document.getElementById("rang").value,
    createdAt:Date.now()
  });
};
</script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* CENTER LAYOUT */
.container{
  display:flex;
  gap:20px;
  align-items:flex-start;
}

/* PANEL */
.panel{
  background:#111827;
  padding:20px;
  border-radius:15px;
  width:300px;
}

/* DASHBOARD */
.dashboard{
  background:#0b1220;
  padding:20px;
  border-radius:15px;
  width:250px;
  text-align:center;
  box-shadow:0 0 20px rgba(59,130,246,0.2);
}

.card{
  margin:10px 0;
  padding:10px;
  background:#1f2937;
  border-radius:10px;
}

/* INPUT */
input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
  background:#1f2937;
  color:white;
}

/* BUTTONS */
button{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:bold;
  background:linear-gradient(45deg,#3b82f6,#8b5cf6);
  color:white;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}

/* LOG */
#logBox{
  max-height:200px;
  overflow:auto;
  background:#0b1220;
  padding:10px;
  border-radius:10px;
  font-size:12px;
}

.log{
  padding:5px;
  border-bottom:1px solid #1f2937;
}
</style>
</head>

<body>

<div class="container">

<!-- BAL PANEL -->
<div class="panel">

<h3>🧑 Munka vezérlő</h3>

<input id="nev" placeholder="Név">

<select id="rang">
<option>Boss</option>
<option>UnderBoss</option>
<option>Capo</option>
<option>Soldier</option>
</select>

<button onclick="inditas()">▶ Indítás</button>
<button onclick="szünet()">⏸ Szünet</button>
<button onclick="folytatas()">▶ Folytatás</button>
<button onclick="vege()">🔴 Befejezés</button>

<div id="live"></div>
<div id="status"></div>

<h3>📜 Log</h3>
<div id="logBox"></div>

</div>

<!-- DASHBOARD -->
<div class="dashboard">

<h3>📊 Dashboard</h3>

<div class="card">💰 Pénz: <span id="d_money">0$</span></div>
<div class="card">⏱ Idő: <span id="d_time">0</span></div>
<div class="card">💼 Rang: <span id="d_rank">-</span></div>

</div>

</div>

</body>
</html>
