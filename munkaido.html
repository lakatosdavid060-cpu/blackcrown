<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Munkaidő PRO UI</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  set,
  update,
  onValue,
  remove,
  onDisconnect,
  get
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ================= RANGOK ================= */
const jobs = {
  Boss: 500,
  UnderBoss: 400,
  Capo: 300,
  Soldier: 200
};

/* ================= STATE ================= */
let startTime=null, timer=null, paused=false, pausedTime=0, pauseStart=null;
let restored=false;

/* ================= LOCAL STORAGE FIX ================= */
function saveLocal(){
  localStorage.setItem("mw_session", JSON.stringify({
    startTime,
    paused,
    pausedTime,
    pauseStart
  }));
}

function loadLocal(){
  const d = localStorage.getItem("mw_session");
  return d ? JSON.parse(d) : null;
}

function clearLocal(){
  localStorage.removeItem("mw_session");
}

/* ================= FORMAT ================= */
const format = s =>
  `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m ${s%60}s`;

const formatDate = (ts) => {
  const d = new Date(ts);
  return d.toLocaleString("hu-HU");
};

const getPay = () =>
  jobs[document.getElementById("rang").value] || 300;

/* ================= TIME FIX ================= */
const getDiff = () => {
  if (!startTime) return 0;

  let d = Math.floor((Date.now()-startTime)/1000)-pausedTime;

  if(paused && pauseStart){
    d -= Math.floor((Date.now()-pauseStart)/1000);
  }

  return Math.max(0,d);
};

/* ================= DASHBOARD ================= */
function updateDashboard(diff, money){
  document.getElementById("d_money").innerText = money+"$";
  document.getElementById("d_time").innerText = format(diff);
  document.getElementById("d_rank").innerText =
    document.getElementById("rang").value;
}

/* ================= GLOBAL LOG ================= */
onValue(ref(db,"log1"),(snapshot)=>{
  const box=document.getElementById("globalLog");
  box.innerHTML="";

  snapshot.forEach(child=>{
    const v=child.val();

    const div=document.createElement("div");
    div.className="log";
    div.innerHTML=`
      <div><b>👤 ${v.nev}</b></div>
      <div>💰 ${v.money}$ • ⏱ ${format(v.time)}</div>
      <div class="date">📅 ${formatDate(v.createdAt)}</div>
    `;

    box.prepend(div);
  });
});

/* ================= USERS ================= */
const users=[
  "David Jackson",
  "Dylen Benedict",
  "Olla Ronaldo",
  "Clinton Morris",
  "Jackson West"
];

/* ================= USER LOG ================= */
function loadUserLogs(){
  users.forEach(name=>{
    const safeName = name.replaceAll(" ","_");

    onValue(ref(db,`userLogs/${safeName}`),(snapshot)=>{
      const box=document.getElementById("log_"+safeName);
      if(!box) return;

      box.innerHTML="";

      snapshot.forEach(child=>{
        const v=child.val();

        const div=document.createElement("div");
        div.className="log user";
        div.innerHTML=`
          <div>💰 ${v.money}$ • ⏱ ${format(v.time)}</div>
          <div class="date">📅 ${formatDate(v.createdAt)}</div>
        `;

        box.prepend(div);
      });
    });
  });
}

/* ================= ONLINE USERS LIVE ================= */
let onlineData={};

onValue(ref(db,"activeUsers"),(snapshot)=>{
  onlineData={};

  snapshot.forEach(child=>{
    onlineData[child.key]=child.val();
  });

  renderOnline();
});

function renderOnline(){
  const box=document.getElementById("onlineList");
  box.innerHTML="";

  Object.values(onlineData).forEach(v=>{

    let diff = Math.floor((Date.now()-v.startedAt)/1000);
    diff -= v.pausedTime||0;

    if(v.paused && v.pauseStart){
      diff -= Math.floor((Date.now()-v.pauseStart)/1000);
    }

    const div=document.createElement("div");
    div.className="log";
    div.innerText=`🟢 ${v.nev} | 💼 ${v.rang} | ⏱ ${format(diff)}`;

    box.appendChild(div);
  });
}

/* live refresh */
setInterval(()=>{
  renderOnline();
},1000);

/* ================= TIMER ================= */
function startTimer(){
  clearInterval(timer);

  timer=setInterval(()=>{
    if(!startTime) return;

    const diff=getDiff();
    const money=Math.floor((diff/3600)*getPay());

    document.getElementById("live").innerText =
      `⏱ ${format(diff)} | 💰 ${money}$`;

    updateDashboard(diff,money);
    saveLocal();
  },1000);
}

/* ================= START ================= */
window.start=async function(){

  const nev=document.getElementById("nev").value;
  const rang=document.getElementById("rang").value;
  const safeNev=nev.replaceAll(" ","_");

  const check=await get(ref(db,`activeUsers/${safeNev}`));

  if(check.exists()){
    restoreSession();
    return;
  }

  startTime=Date.now();
  paused=false;
  pausedTime=0;
  pauseStart=null;

  set(ref(db,`activeUsers/${safeNev}`),{
    nev,
    rang,
    startedAt:startTime,
    paused:false,
    pausedTime:0,
    pauseStart:null
  });

  onDisconnect(ref(db,`activeUsers/${safeNev}`)).remove();

  startTimer();
  saveLocal();
};

/* ================= PAUSE ================= */
window.pause=function(){
  if(paused) return;

  pauseStart=Date.now();
  paused=true;

  const nev=document.getElementById("nev").value;
  const safeNev=nev.replaceAll(" ","_");

  update(ref(db,`activeUsers/${safeNev}`),{
    paused:true,
    pauseStart
  });

  saveLocal();
};

/* ================= RESUME ================= */
window.resume=function(){
  if(!paused) return;

  pausedTime += Math.floor((Date.now()-pauseStart)/1000);
  paused=false;

  const nev=document.getElementById("nev").value;
  const safeNev=nev.replaceAll(" ","_");

  update(ref(db,`activeUsers/${safeNev}`),{
    paused:false,
    pausedTime,
    pauseStart:null
  });

  saveLocal();
};

/* ================= END ================= */
window.end=async function(){

  const nev=document.getElementById("nev").value;
  const safeNev=nev.replaceAll(" ","_");

  if(paused && pauseStart){
    pausedTime += Math.floor((Date.now()-pauseStart)/1000);
  }

  clearInterval(timer);

  const diff=getDiff();
  const money=Math.floor((diff/3600)*getPay());

  await push(ref(db,"log1"),{
    nev,
    money,
    time:diff,
    createdAt:Date.now()
  });

  await push(ref(db,`userLogs/${safeNev}`),{
    money,
    time:diff,
    createdAt:Date.now()
  });

  await remove(ref(db,`activeUsers/${safeNev}`));

  clearLocal();

  startTime=null;
  paused=false;
  pausedTime=0;
};

/* ================= RESTORE FIX ================= */
function restoreSession(){
  if(restored) return;

  const nev=document.getElementById("nev").value;
  const safeNev=nev.replaceAll(" ","_");

  const local=loadLocal();

  if(local && !startTime){
    startTime=local.startTime;
    paused=local.paused;
    pausedTime=local.pausedTime;
    pauseStart=local.pauseStart;
  }

  onValue(ref(db,`activeUsers/${safeNev}`),(snap)=>{
    if(!snap.exists()) return;

    const d=snap.val();

    startTime=d.startedAt;
    paused=d.paused;
    pausedTime=d.pausedTime||0;
    pauseStart=d.pauseStart||null;

    startTimer();
    restored=true;
  });
}

/* INIT */
loadUserLogs();
restoreSession();

</script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.container{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:20px;
}

.panel{
  width:300px;
  background:#111827;
  padding:20px;
  border-radius:15px;
}

.dashboard{
  width:300px;
  background:#0b1220;
  padding:20px;
  border-radius:15px;
  text-align:center;
}

select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
  background:#1f2937;
  color:white;
}

button{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:bold;
  background:linear-gradient(45deg,#3b82f6,#8b5cf6);
  color:white;
}

.log{
  font-size:13px;
  padding:10px;
  margin-bottom:6px;
  background:#1f2937;
  border-radius:10px;
}

.date{
  font-size:11px;
  color:#9ca3af;
}

.user{
  border-left:4px solid #38bdf8;
}

.userBox{
  max-height:120px;
  overflow:auto;
  background:#0b1220;
  padding:8px;
  border-radius:10px;
}
</style>

</head>

<body>

<div class="container">

<div class="panel">

<select id="nev">
<option>David Jackson</option>
<option>Dylen Benedict</option>
<option>Olla Ronaldo</option>
<option>Clinton Morris</option>
<option>Jackson West</option>
</select>

<select id="rang">
<option>Boss</option>
<option>UnderBoss</option>
<option>Capo</option>
<option>Soldier</option>
</select>

<button onclick="start()">Indítás</button>
<button onclick="pause()">Szünet</button>
<button onclick="resume()">Folytatás</button>
<button onclick="end()">Befejezés</button>

<div id="live"></div>
<div id="status"></div>

<h3>Global Log</h3>
<div id="globalLog"></div>

</div>

<div class="dashboard">

<h3>Dashboard</h3>

<div>💰 <span id="d_money">0$</span></div>
<div>⏱ <span id="d_time">0</span></div>
<div>💼 <span id="d_rank">-</span></div>

<h3>Online</h3>
<div id="onlineList" class="userBox"></div>

</div>

<div class="panel">

<h3>User Logok</h3>

<div>David Jackson<div id="log_David_Jackson" class="userBox"></div></div>
<div>Dylen Benedict<div id="log_Dylen_Benedict" class="userBox"></div></div>
<div>Olla Ronaldo<div id="log_Olla_Ronaldo" class="userBox"></div></div>
<div>Clinton Morris<div id="log_Clinton_Morris" class="userBox"></div></div>
<div>Jackson West<div id="log_Jackson_West" class="userBox"></div></div>

</div>

</div>

</body>
</html>
