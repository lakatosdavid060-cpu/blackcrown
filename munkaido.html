<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Munkaidő PRO - User Log System</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set, onChildAdded, get }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* RANGOK */
const jobs = {
  Boss: 500,
  UnderBoss: 400,
  Capo: 300,
  Soldier: 200
};

let startTime=null, timer=null, paused=false, pausedTime=0, pauseStart=null;

/* FORMAT */
const format = s => `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;

const getPay = () => jobs[document.getElementById("rang").value] || 300;

const getDiff = () => {
  let d = Math.floor((Date.now()-startTime)/1000)-pausedTime;
  if(paused && pauseStart) d -= Math.floor((Date.now()-pauseStart)/1000);
  return d;
};

/* GLOBAL LOG */
function addGlobalLog(v){
  const box=document.getElementById("globalLog");

  const div=document.createElement("div");
  div.className="log";
  div.innerText=`👤 ${v.nev} | 💰 ${v.money}$ | ⏱ ${v.time}s`;

  box.prepend(div);
}

/* USER LOG LOADER */
function loadUserLogs(){
  const users = [
    "David Jackson",
    "Dylen Benedict",
    "Olla Ronaldo",
    "Clinton Morris"
  ];

  users.forEach(name=>{
    const qRef = ref(db,`userLogs/${name}`);

    onChildAdded(qRef,(snap)=>{
      const v = snap.val();
      const box = document.getElementById("log_"+name);

      const div=document.createElement("div");
      div.className="log user";
      div.innerText=`⏱ ${v.time}s | 💰 ${v.money}$`;

      box.prepend(div);
    });
  });
}

/* TIMER */
function startTimer(){
  timer=setInterval(()=>{
    if(!startTime) return;

    const diff=getDiff();
    const money=Math.floor((diff/3600)*getPay());

    document.getElementById("live").innerText =
      `⏱ ${format(diff)} | 💰 ${money}$`;
  },1000);
}

/* ACTIONS */
window.start=function(){
  startTime=Date.now();
  paused=false;
  pausedTime=0;
  pauseStart=null;

  clearInterval(timer);
  startTimer();

  loadUserLogs();
};

window.pause=function(){
  if(!paused){
    pauseStart=Date.now();
    paused=true;
  }
};

window.resume=function(){
  if(paused){
    pausedTime += Math.floor((Date.now()-pauseStart)/1000);
  }
  paused=false;
};

window.end=async function(){
  const nev=document.getElementById("nev").value;

  if(paused && pauseStart){
    pausedTime += Math.floor((Date.now()-pauseStart)/1000);
  }

  clearInterval(timer);

  const diff=getDiff();
  const money=Math.floor((diff/3600)*getPay());

  document.getElementById("status").innerText =
    `${format(diff)} | ${money}$`;

  /* GLOBAL LOG */
  await set(push(ref(db,"logs")),{
    nev,
    money,
    time:diff,
    createdAt:Date.now()
  });

  /* USER LOG (KÜLÖN) */
  await set(push(ref(db,`userLogs/${nev}`)),{
    time:diff,
    money,
    createdAt:Date.now()
  });
};
</script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.container{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:20px;
}

.panel{
  width:300px;
  background:#111827;
  padding:20px;
  border-radius:15px;
}

input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
  background:#1f2937;
  color:white;
}

button{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:bold;
  background:linear-gradient(45deg,#3b82f6,#8b5cf6);
  color:white;
}

button:hover{transform:scale(1.05);}

/* LOG */
.log{
  font-size:12px;
  padding:5px;
  border-bottom:1px solid #1f2937;
}

.user{
  color:#38bdf8;
}

/* USER BOX */
.userBox{
  max-height:120px;
  overflow:auto;
  background:#0b1220;
  padding:8px;
  border-radius:10px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="panel">

<select id="nev">
  <option>David Jackson</option>
  <option>Dylen Benedict</option>
  <option>Olla Ronaldo</option>
  <option>Clinton Morris</option>
</select>

<select id="rang">
  <option>Boss</option>
  <option>UnderBoss</option>
  <option>Capo</option>
  <option>Soldier</option>
</select>

<button onclick="start()">Indítás</button>
<button onclick="pause()">Szünet</button>
<button onclick="resume()">Folytatás</button>
<button onclick="end()">Befejezés</button>

<div id="live"></div>
<div id="status"></div>

</div>

<!-- USER LOGS -->
<div class="panel">

<h3>📊 User Logok</h3>

<div>
<h4>David Jackson</h4>
<div class="userBox" id="log_David Jackson"></div>

<h4>Dylen Benedict</h4>
<div class="userBox" id="log_Dylen Benedict"></div>

<h4>Olla Ronaldo</h4>
<div class="userBox" id="log_Olla Ronaldo"></div>

<h4>Clinton Morris</h4>
<div class="userBox" id="log_Clinton Morris"></div>
</div>

</div>

</div>

</body>
</html>
