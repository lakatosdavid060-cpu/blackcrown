<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Munkaidő Követő PRO</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:70086de26402ceb3464b89"
};


const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* WEBHOOK */
const WEBHOOK = "https://discord.com/api/webhooks/1498948555254136863/cylpJM9pG0dB5XALUcRqspygDucdu6vyfLuFDCgM57XUK0bW194VvyI1u2KPqn4ZrIp0";

/* RANGOK */
const jobs = {
  Boss: 500,
  UnderBoss: 400,
  Capo: 300,
  Soldier: 200
};

/* STATE */
let startTime = null;
let timer = null;
let paused = false;
let pausedTime = 0;
let pauseStart = null;

/* FORMAT */
function format(sec){
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  return `${h} óra ${m} perc`;
}

/* TIMER */
function getPay(){
  return jobs[document.getElementById("rang").value] || 300;
}

function getDiff(){
  let diff = Math.floor((Date.now()-startTime)/1000) - pausedTime;

  if(paused && pauseStart){
    diff -= Math.floor((Date.now() - pauseStart)/1000);
  }

  return diff;
}

function updateDashboard(diff, money){
  document.getElementById("cardMoney").innerText = money + "$";
  document.getElementById("cardTime").innerText = format(diff);
  document.getElementById("cardRank").innerText =
    document.getElementById("rang").value;

  document.getElementById("cardStatus").innerText =
    paused ? "Szünet" : "Aktív";
}

function startTimer(){
  timer = setInterval(()=>{
    if(!startTime) return;

    const diff = getDiff();
    const money = Math.floor((diff/3600)*getPay());

    document.getElementById("elo").innerText =
      `⏱ ${format(diff)} | 💰 ${money}$`;

    updateDashboard(diff, money);
  },1000);
}

/* ACTIONS */
window.munkaInditas = function(){
  const nev = document.getElementById("nev").value;
  if(!nev) return alert("Adj meg nevet!");

  startTime = Date.now();
  paused = false;
  pausedTime = 0;
  pauseStart = null;

  clearInterval(timer);
  startTimer();

  document.getElementById("cardStatus").innerText = "Aktív";
};

window.szünet = function(){
  if(!paused){
    pauseStart = Date.now();
    paused = true;
    document.getElementById("cardStatus").innerText = "Szünet";
  }
};

window.folytatas = function(){
  if(paused && pauseStart){
    pausedTime += Math.floor((Date.now() - pauseStart)/1000);
  }
  paused = false;
  pauseStart = null;
  document.getElementById("cardStatus").innerText = "Aktív";
};

window.munkaVege = async function(){
  const nev = document.getElementById("nev").value;

  if(paused && pauseStart){
    pausedTime += Math.floor((Date.now() - pauseStart)/1000);
  }

  clearInterval(timer);

  const diff = getDiff();
  const money = Math.floor((diff/3600)*getPay());

  const day = new Date().toISOString().split("T")[0];
  const r = ref(db, `logs/${day}/${nev}`);

  const snap = await get(r);
  let data = snap.exists()?snap.val():{time:0,money:0};

  data.time += diff;
  data.money += money;

  await set(r,data);

  document.getElementById("status").innerText =
    `${format(diff)} | ${money}$`;

  document.getElementById("cardStatus").innerText = "Offline";
};

/* RANGLISTA */
window.ranglista = async function(){
  const snap = await get(ref(db,"logs"));
  if(!snap.exists()) return;

  const data = snap.val();
  let total = {};

  for(let d in data){
    for(let p in data[d]){
      total[p] = (total[p]||0) + data[d][p].money;
    }
  }

  const sorted = Object.entries(total).sort((a,b)=>b[1]-a[1]);

  let out = "🏆 Ranglista\n\n";
  sorted.forEach((p,i)=>{
    out += `${i+1}. ${p[0]} - ${p[1]}$\n`;
  });

  document.getElementById("statisztika").innerText = out;
};
</script>

<style>
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#0f172a,#020617);
  color:white;

  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.grid{
  display:grid;
  grid-template-columns:300px 500px;
  gap:25px;
}

/* panel */
.panel{
  background: rgba(17,24,39,0.9);
  padding:20px;
  border-radius:15px;
}

/* input */
input,select{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:none;
  background:#1f2937;
  color:white;
}

/* buttons */
button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border-radius:10px;
  border:none;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:nth-child(3){background:#22c55e;}
button:nth-child(4){background:#eab308;}
button:nth-child(5){background:#3b82f6;}
button:nth-child(6){background:#ef4444;}
button:nth-child(7){background:#8b5cf6;}

button:hover{
  transform:scale(1.05);
}

/* dashboard */
.cards{
  display:grid;
  grid-template-columns: repeat(2,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{
  padding:20px;
  border-radius:15px;
  background:#111827;
  transition:0.3s;
}

.card h3{
  margin:0;
  font-size:14px;
  color:#9ca3af;
}

.card p{
  font-size:26px;
  margin-top:10px;
  font-weight:bold;
}

.card.money{box-shadow:0 0 20px rgba(34,197,94,0.5);}
.card.time{box-shadow:0 0 20px rgba(59,130,246,0.5);}
.card.rank{box-shadow:0 0 20px rgba(168,85,247,0.5);}
.card.status{box-shadow:0 0 20px rgba(234,179,8,0.5);}

.card:hover{transform:scale(1.05);}

#elo{
  margin-top:10px;
  font-weight:bold;
  color:#38bdf8;
}
</style>
</head>

<body>

<div class="grid">

<div class="panel">
<input id="nev" placeholder="Név">

<select id="rang">
<option value="Boss">Főnök</option>
<option value="UnderBoss">Alfőnök</option>
<option value="Capo">Capo</option>
<option value="Soldier">Közkatona</option>
</select>

<button onclick="munkaInditas()">Indítás</button>
<button onclick="szünet()">Szünet</button>
<button onclick="folytatas()">Folytatás</button>
<button onclick="munkaVege()">Befejezés</button>
<button onclick="ranglista()">Ranglista</button>

<div id="elo"></div>
<h3 id="status"></h3>
</div>

<div>

<div class="cards">
  <div class="card money">
    <h3>💰 Pénz</h3>
    <p id="cardMoney">0$</p>
  </div>

  <div class="card time">
    <h3>⏱ Munkaidő</h3>
    <p id="cardTime">0 óra</p>
  </div>

  <div class="card rank">
    <h3>💼 Rang</h3>
    <p id="cardRank">-</p>
  </div>

  <div class="card status">
    <h3>🟢 Státusz</h3>
    <p id="cardStatus">Offline</p>
  </div>
</div>

<pre id="statisztika"></pre>

</div>

</div>

</body>
</html>
