<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Munkaidő Követő PRO+</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set, onChildAdded, query, orderByChild, equalTo }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* RANGOK */
const jobs = {
  Boss: 500,
  UnderBoss: 400,
  Capo: 300,
  Soldier: 200
};

/* STATE */
let startTime=null, timer=null, paused=false, pausedTime=0, pauseStart=null;

/* FORMAT */
const format = s => `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;

const getPay = () => jobs[document.getElementById("rang").value] || 300;

const getDiff = () => {
  let d = Math.floor((Date.now()-startTime)/1000)-pausedTime;
  if(paused && pauseStart) d -= Math.floor((Date.now()-pauseStart)/1000);
  return d;
};

/* LIVE GLOBAL LOG */
onChildAdded(ref(db,"logs"),(snap)=>{
  const v=snap.val();
  const box=document.getElementById("globalLog");

  const div=document.createElement("div");
  div.className="log";
  div.innerText=`👤 ${v.nev} | 💰 ${v.money}$ | ⏱ ${v.time}s`;

  box.prepend(div);
});

/* PERSONAL LOG (USER FILTER) */
function loadUserLog(name){
  const q = query(ref(db,"logs"), orderByChild("nev"), equalTo(name));

  onChildAdded(q,(snap)=>{
    const v=snap.val();
    const box=document.getElementById("userLog");

    const div=document.createElement("div");
    div.className="log user";

    div.innerText=`📌 ${v.time}s | 💰 ${v.money}$`;

    box.prepend(div);
  });
}

/* TIMER */
function startTimer(){
  timer=setInterval(()=>{
    if(!startTime) return;

    const diff=getDiff();
    const money=Math.floor((diff/3600)*getPay());

    document.getElementById("live").innerText =
      `⏱ ${format(diff)} | 💰 ${money}$`;

    document.getElementById("d_money").innerText=money+"$";
    document.getElementById("d_time").innerText=format(diff);
  },1000);
}

/* ACTIONS */
window.start=function(){
  const nev=document.getElementById("nev").value;

  startTime=Date.now();
  paused=false;
  pausedTime=0;
  pauseStart=null;

  document.getElementById("userLog").innerHTML="";

  loadUserLog(nev);

  clearInterval(timer);
  startTimer();
};

window.pause=function(){
  if(!paused){
    pauseStart=Date.now();
    paused=true;
  }
};

window.resume=function(){
  if(paused){
    pausedTime += Math.floor((Date.now()-pauseStart)/1000);
  }
  paused=false;
};

window.end=async function(){
  const nev=document.getElementById("nev").value;

  if(paused && pauseStart){
    pausedTime += Math.floor((Date.now()-pauseStart)/1000);
  }

  clearInterval(timer);

  const diff=getDiff();
  const money=Math.floor((diff/3600)*getPay());

  document.getElementById("status").innerText =
    `${format(diff)} | ${money}$`;

  /* GLOBAL LOG */
  await set(push(ref(db,"logs")),{
    nev,
    money,
    time:diff,
    rank:document.getElementById("rang").value,
    createdAt:Date.now()
  });
};
</script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container{
  display:flex;
  gap:20px;
}

/* PANEL */
.panel{
  background:#111827;
  padding:20px;
  border-radius:15px;
  width:300px;
}

/* DASHBOARD */
.dashboard{
  background:#0b1220;
  padding:20px;
  border-radius:15px;
  width:300px;
  text-align:center;
}

.card{
  background:#1f2937;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
}

/* INPUT */
select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
  background:#1f2937;
  color:white;
}

/* BUTTONS */
button{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:bold;
  background:linear-gradient(45deg,#3b82f6,#8b5cf6);
  color:white;
}

button:hover{transform:scale(1.05);}

/* LOG */
#globalLog,#userLog{
  max-height:150px;
  overflow:auto;
  background:#0b1220;
  padding:10px;
  border-radius:10px;
  font-size:12px;
  margin-top:10px;
}

.log{
  border-bottom:1px solid #1f2937;
  padding:5px;
}

.user{
  color:#38bdf8;
}
</style>
</head>

<body>

<div class="container">

<!-- LEFT -->
<div class="panel">

<select id="nev">
  <option>David Jackson</option>
  <option>Dylen Benedict</option>
  <option>Olla Ronaldo</option>
  <option>Clinton Morris</option>
</select>

<select id="rang">
  <option>Boss</option>
  <option>UnderBoss</option>
  <option>Capo</option>
  <option>Soldier</option>
</select>

<button onclick="start()">Indítás</button>
<button onclick="pause()">Szünet</button>
<button onclick="resume()">Folytatás</button>
<button onclick="end()">Befejezés</button>

<div id="live"></div>
<div id="status"></div>

<h3>🌍 Global Log</h3>
<div id="globalLog"></div>

<h3>👤 Saját Log</h3>
<div id="userLog"></div>

</div>

<!-- DASHBOARD -->
<div class="dashboard">

<h3>📊 Dashboard</h3>

<div class="card">💰 Pénz: <span id="d_money">0$</span></div>
<div class="card">⏱ Idő: <span id="d_time">0</span></div>

</div>

</div>

</body>
</html>
