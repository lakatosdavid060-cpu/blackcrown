<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Munkaidő PRO + Dashboard</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set, onChildAdded }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* RANGOK */
const jobs = {
  Boss: 500,
  UnderBoss: 400,
  Capo: 300,
  Soldier: 200
};

let startTime=null, timer=null, paused=false, pausedTime=0, pauseStart=null;

/* FORMAT */
const format = s => `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;

const getPay = () => jobs[document.getElementById("rang").value] || 300;

const getDiff = () => {
  let d = Math.floor((Date.now()-startTime)/1000)-pausedTime;
  if(paused && pauseStart) d -= Math.floor((Date.now()-pauseStart)/1000);
  return d;
};

/* DASHBOARD UPDATE */
function updateDashboard(diff, money){
  document.getElementById("d_money").innerText = money+"$";
  document.getElementById("d_time").innerText = format(diff);
  document.getElementById("d_rank").innerText =
    document.getElementById("rang").value;
}

/* GLOBAL LOG */
onChildAdded(ref(db,"logs"),(snap)=>{
  const v=snap.val();
  const box=document.getElementById("globalLog");

  const div=document.createElement("div");
  div.className="log";
  div.innerText=`👤 ${v.nev} | 💰 ${v.money}$ | ⏱ ${v.time}s`;

  box.prepend(div);
});

/* USER LOG */
const users=[
  "David Jackson",
  "Dylen Benedict",
  "Olla Ronaldo",
  "Clinton Morris"
  "Jackson West"
];

function loadUserLogs(){
  users.forEach(name=>{
    onChildAdded(ref(db,`userLogs/${name}`),(snap)=>{
      const v=snap.val();
      const box=document.getElementById("log_"+name);

      const div=document.createElement("div");
      div.className="log user";
      div.innerText=`⏱ ${v.time}s | 💰 ${v.money}$`;

      box.prepend(div);
    });
  });
}

/* TIMER */
function startTimer(){
  timer=setInterval(()=>{
    if(!startTime) return;

    const diff=getDiff();
    const money=Math.floor((diff/3600)*getPay());

    document.getElementById("live").innerText =
      `⏱ ${format(diff)} | 💰 ${money}$`;

    updateDashboard(diff,money);
  },1000);
}

/* ACTIONS */
window.start=function(){
  startTime=Date.now();
  paused=false;
  pausedTime=0;
  pauseStart=null;

  loadUserLogs();
  clearInterval(timer);
  startTimer();
};

window.pause=function(){
  if(!paused){
    pauseStart=Date.now();
    paused=true;
  }
};

window.resume=function(){
  if(paused){
    pausedTime += Math.floor((Date.now()-pauseStart)/1000);
  }
  paused=false;
};

window.end=async function(){
  const nev=document.getElementById("nev").value;

  if(paused && pauseStart){
    pausedTime += Math.floor((Date.now()-pauseStart)/1000);
  }

  clearInterval(timer);

  const diff=getDiff();
  const money=Math.floor((diff/3600)*getPay());

  document.getElementById("status").innerText =
    `${format(diff)} | ${money}$`;

  /* GLOBAL */
  await set(push(ref(db,"logs")),{
    nev,
    money,
    time:diff,
    createdAt:Date.now()
  });

  /* USER */
  await set(push(ref(db,`userLogs/${nev}`)),{
    time:diff,
    money,
    createdAt:Date.now()
  });
};
</script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
}

.container{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:20px;
}

/* PANELS */
.panel{
  width:300px;
  background:#111827;
  padding:20px;
  border-radius:15px;
}

/* DASHBOARD */
.dashboard{
  width:300px;
  background:#0b1220;
  padding:20px;
  border-radius:15px;
  text-align:center;
}

.card{
  background:#1f2937;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
}

/* INPUT */
select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
  background:#1f2937;
  color:white;
}

/* BUTTON */
button{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:bold;
  background:linear-gradient(45deg,#3b82f6,#8b5cf6);
  color:white;
}

/* LOG */
.log{
  font-size:12px;
  padding:5px;
  border-bottom:1px solid #1f2937;
}

.user{
  color:#38bdf8;
}

.userBox{
  max-height:120px;
  overflow:auto;
  background:#0b1220;
  padding:8px;
  border-radius:10px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="container">

<!-- LEFT -->
<div class="panel">

<select id="nev">
  <option>David Jackson</option>
  <option>Dylen Benedict</option>
  <option>Olla Ronaldo</option>
  <option>Clinton Morris</option>
  <option>Jackson West</option>
</select>

<select id="rang">
  <option>Boss</option>
  <option>UnderBoss</option>
  <option>Capo</option>
  <option>Soldier</option>
</select>

<button onclick="start()">Indítás</button>
<button onclick="pause()">Szünet</button>
<button onclick="resume()">Folytatás</button>
<button onclick="end()">Befejezés</button>

<div id="live"></div>
<div id="status"></div>

<h3>🌍 Global Log</h3>
<div id="globalLog"></div>

</div>

<!-- DASHBOARD -->
<div class="dashboard">

<h3>📊 Dashboard</h3>

<div class="card">💰 Pénz: <span id="d_money">0$</span></div>
<div class="card">⏱ Idő: <span id="d_time">0</span></div>
<div class="card">💼 Rang: <span id="d_rank">-</span></div>

</div>

<!-- USER LOGS -->
<div class="panel">

<h3>👤 User Logok</h3>

<div>David Jackson<div class="userBox" id="log_David Jackson"></div></div>
<div>Dylen Benedict<div class="userBox" id="log_Dylen Benedict"></div></div>
<div>Olla Ronaldo<div class="userBox" id="log_Olla Ronaldo"></div></div>
<div>Clinton Morris<div class="userBox" id="log_Clinton Morris"></div></div>
<div>Jackson West<div class="userBox" id="log_Jackson West"></div></div>

</div>

</div>

</body>
</html>
