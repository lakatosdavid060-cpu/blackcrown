<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Munkaidő PRO V2 FINAL</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase, ref, push, set, update, onValue, remove, get, onDisconnect
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* STATE */
let sessionId=null;
let startTime=null;
let paused=false;
let pauseStart=null;
let pausedTime=0;
let timer=null;
let payDate=null;
let chart;

/* RANGOK */
const jobs={
  Boss:500,
  UnderBoss:400,
  Capo:300,
  Soldier:200
};

/* FORMAT */
const format=s=>`${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m ${s%60}s`;

function nevSafe(){
  return document.getElementById("nev").value.replaceAll(" ","_");
}

/* PAY DATE */
function getCountdown(){
  if(!payDate) return "nincs beállítva";
  const diff=payDate-Date.now();
  if(diff<=0) return "lejárt";

  const d=Math.floor(diff/86400000);
  const h=Math.floor((diff/3600000)%24);
  return `${d} nap ${h} óra`;
}

window.savePayDate=()=>{
  const v=document.getElementById("payDate").value;
  if(!v) return;

  set(ref(db,"settings/payDate"),{
    value:new Date(v).getTime()
  });
};

window.addWeek=()=>{
  if(!payDate) return;
  payDate+=604800000;
  set(ref(db,"settings/payDate"),{value:payDate});
};

onValue(ref(db,"settings/payDate"),snap=>{
  if(!snap.exists()) return;
  payDate=snap.val().value;

  document.getElementById("payDate").value=
    new Date(payDate).toISOString().slice(0,16);
});

/* MESSAGE BAR */
let msgIndex=0;
function rotateMessages(){
  const msgs=[
    "⚠️ Heti elszámolás aktív",
    `💰 Következő fizetés: ${getCountdown()}`,
    "📊 Minden adat mentve",
    "🟢 Online státusz él"
  ];

  document.getElementById("noticeText").innerText=
    msgs[msgIndex%msgs.length];

  msgIndex++;
}
setInterval(rotateMessages,5000);

/* SESSION CHECK */
async function checkSession(){
  const safe=nevSafe();

  const snap=await get(ref(db,`sessions/${safe}`));

  if(snap.exists()){
    const s=snap.val();

    sessionId=s.sessionId;
    startTime=s.startTime;
    paused=s.paused;
    pausedTime=s.pausedTime||0;
    pauseStart=s.pauseStart||null;

    startTimer();
  }
}

/* START */
window.start=async()=>{
  const safe=nevSafe();

  const exists=await get(ref(db,`sessions/${safe}`));
  if(exists.exists()){
    alert("Már fut munkaidő!");
    return;
  }

  sessionId=Date.now().toString();
  startTime=Date.now();
  paused=false;
  pausedTime=0;
  pauseStart=null;

  const data={
    sessionId,
    nev:document.getElementById("nev").value,
    rang:document.getElementById("rang").value,
    startTime,
    paused,
    pausedTime,
    pauseStart
  };

  set(ref(db,`sessions/${safe}`),data);
  onDisconnect(ref(db,`sessions/${safe}`)).remove();

  startTimer();
};

/* PAUSE */
window.pause=()=>{
  if(paused) return;

  pauseStart=Date.now();
  paused=true;

  update(ref(db,`sessions/${nevSafe()}`),{
    paused,
    pauseStart
  });
};

/* RESUME */
window.resume=()=>{
  if(!paused) return;

  pausedTime+=Math.floor((Date.now()-pauseStart)/1000);
  paused=false;

  update(ref(db,`sessions/${nevSafe()}`),{
    paused,
    pausedTime,
    pauseStart:null
  });
};

/* END */
window.end=async()=>{
  const safe=nevSafe();

  if(paused && pauseStart){
    pausedTime+=Math.floor((Date.now()-pauseStart)/1000);
  }

  clearInterval(timer);

  const diff=getDiff();
  const pay=jobs[document.getElementById("rang").value];
  const money=Math.floor((diff/3600)*pay);

  /* GLOBAL LOG -> log1 */
  await set(push(ref(db,"log1")),{
    nev:document.getElementById("nev").value,
    money,
    time:diff,
    createdAt:Date.now()
  });

  /* USER LOG */
  await set(push(ref(db,`userLogs/${safe}`)),{
    money,
    time:diff,
    createdAt:Date.now()
  });

  await remove(ref(db,`sessions/${safe}`));
};

/* DIFF */
function getDiff(){
  let d=Math.floor((Date.now()-startTime)/1000)-pausedTime;

  if(paused && pauseStart){
    d-=Math.floor((Date.now()-pauseStart)/1000);
  }

  return Math.max(0,d);
}

/* TIMER */
function startTimer(){
  clearInterval(timer);

  timer=setInterval(()=>{
    if(!startTime) return;

    const diff=getDiff();
    const money=Math.floor((diff/3600)*jobs[document.getElementById("rang").value]);

    document.getElementById("live").innerText=
      `⏱ ${format(diff)} | 💰 ${money}$`;
  },1000);
}

/* GLOBAL LOG + CHART */
onValue(ref(db,"log1"),snap=>{
  const box=document.getElementById("globalLog");
  box.innerHTML="";

  const stats={};

  snap.forEach(c=>{
    const v=c.val();
    stats[v.nev]=(stats[v.nev]||0)+v.money;

    const div=document.createElement("div");
    div.className="log";
    div.innerHTML=`
      <b>${v.nev}</b><br>
      💰 ${v.money}$ • ⏱ ${format(v.time)}<br>
      <small>${new Date(v.createdAt).toLocaleString()}</small>
    `;

    box.prepend(div);
  });

  renderChart(stats);
});

/* CHART */
let chart;
function renderChart(data){
  const ctx=document.getElementById("chart");

  if(chart) chart.destroy();

  chart=new Chart(ctx,{
    type:"bar",
    data:{
      labels:Object.keys(data),
      datasets:[{
        label:"Össz kereset",
        data:Object.values(data)
      }]
    }
  });
}

/* USER LOG */
const users=[
  "David Jackson",
  "Dylen Benedict",
  "Olla Ronaldo",
  "Clinton Morris",
  "Jackson West"
];

users.forEach(name=>{
  const safe=name.replaceAll(" ","_");

  onValue(ref(db,`userLogs/${safe}`),snap=>{
    const box=document.getElementById("log_"+safe);
    box.innerHTML="";

    snap.forEach(c=>{
      const v=c.val();

      const div=document.createElement("div");
      div.className="log user";
      div.innerHTML=`
        💰 ${v.money}$ • ⏱ ${format(v.time)}<br>
        <small>${new Date(v.createdAt).toLocaleString()}</small>
      `;

      box.prepend(div);
    });
  });
});

/* ONLINE */
onValue(ref(db,"sessions"),snap=>{
  const box=document.getElementById("online");
  box.innerHTML="";

  snap.forEach(c=>{
    const v=c.val();

    let diff=Math.floor((Date.now()-v.startTime)/1000);
    if(v.paused && v.pauseStart){
      diff-=Math.floor((Date.now()-v.pauseStart)/1000);
    }

    diff-=v.pausedTime||0;
    diff=Math.max(0,diff);

    const div=document.createElement("div");
    div.className="log";
    div.innerText=`🟢 ${v.nev} | ${v.rang} | ⏱ ${format(diff)}`;

    box.appendChild(div);
  });
});

/* INIT */
rotateMessages();
checkSession();

</script>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;}
.notice{background:#3b82f6;padding:10px;text-align:center;}
.container{display:flex;gap:20px;padding:20px;}
.panel,.dashboard{background:#111827;padding:20px;border-radius:15px;width:300px;}
button,select,input{width:100%;margin:5px 0;padding:10px;border:none;border-radius:8px;}
.log{background:#1f2937;padding:10px;margin:5px 0;border-radius:10px;}
.user{border-left:3px solid #38bdf8;}
</style>

</head>

<body>

<div class="notice">
  <span id="noticeText"></span>
</div>

<div class="container">

<div class="panel">

<select id="nev">
<option>David Jackson</option>
<option>Dylen Benedict</option>
<option>Olla Ronaldo</option>
<option>Clinton Morris</option>
<option>Jackson West</option>
</select>

<select id="rang">
<option>Boss</option>
<option>UnderBoss</option>
<option>Capo</option>
<option>Soldier</option>
</select>

<button onclick="start()">START</button>
<button onclick="pause()">PAUSE</button>
<button onclick="resume()">RESUME</button>
<button onclick="end()">END</button>

<div id="live"></div>

<h3>GLOBAL LOG</h3>
<div id="globalLog"></div>

</div>

<div class="dashboard">

<h3>📊 STATS</h3>
<canvas id="chart"></canvas>

<h3>🟢 ONLINE</h3>
<div id="online"></div>

<h3>⚙️ PAY</h3>
<input type="datetime-local" id="payDate">
<button onclick="savePayDate()">SAVE</button>
<button onclick="addWeek()">+1 WEEK</button>

</div>

<div class="panel">

<h3>USER LOGS</h3>

<div>David<div id="log_David_Jackson"></div></div>
<div>Dylen<div id="log_Dylen_Benedict"></div></div>
<div>Olla<div id="log_Olla_Ronaldo"></div></div>
<div>Clinton<div id="log_Clinton_Morris"></div></div>
<div>Jackson<div id="log_Jackson_West"></div></div>

</div>

</div>

</body>
</html>
