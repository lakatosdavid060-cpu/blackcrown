<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Munkaidő Követő PRO</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, set, onChildAdded }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* DISCORD WEBHOOK */
const WEBHOOK = "https://discord.com/api/webhooks/1499539374319341741/xQbPJ7rM8Vi4nGicNzTPpvPEIjqSQXq7JvNdCxQiO_cFezR3BQXzAHp7-HZ-9rHVz1aN";

/* RANGOK */
const jobs = {
  Boss: 500,
  UnderBoss: 400,
  Capo: 300,
  Soldier: 200
};

/* STATE */
let startTime=null, timer=null, paused=false, pausedTime=0, pauseStart=null;

/* FORMAT */
const format = s => `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;

const getPay = () =>
  jobs[document.getElementById("rang").value] || 300;

const getDiff = () => {
  let d = Math.floor((Date.now()-startTime)/1000)-pausedTime;
  if(paused && pauseStart) d -= Math.floor((Date.now()-pauseStart)/1000);
  return d;
};

/* TIMER */
function startTimer(){
  timer = setInterval(()=>{
    if(!startTime) return;

    const diff = getDiff();
    const money = Math.floor((diff/3600)*getPay());

    document.getElementById("live").innerText =
      `⏱ ${format(diff)} | 💰 ${money}$`;
  },1000);
}

/* LOG LIVE (MINDENKINEK) */
const logRef = ref(db,"logs");

onChildAdded(logRef,(snap)=>{
  const v = snap.val();

  const box = document.getElementById("logBox");
  const div = document.createElement("div");

  div.className="log";
  div.innerText = `👤 ${v.nev} | 💰 ${v.money}$ | ⏱ ${v.time}s`;

  box.prepend(div);
});

/* ACTIONS */
window.start = function(){
  const nev=document.getElementById("nev").value;
  if(!nev) return alert("Név kell!");

  startTime=Date.now();
  paused=false;
  pausedTime=0;
  pauseStart=null;

  clearInterval(timer);
  startTimer();
};

window.pause = function(){
  if(!paused){
    pauseStart=Date.now();
    paused=true;
  }
};

window.resume = function(){
  if(paused){
    pausedTime += Math.floor((Date.now()-pauseStart)/1000);
  }
  paused=false;
};

window.end = async function(){
  const nev=document.getElementById("nev").value;

  if(paused && pauseStart){
    pausedTime += Math.floor((Date.now()-pauseStart)/1000);
  }

  clearInterval(timer);

  const diff=getDiff();
  const money=Math.floor((diff/3600)*getPay());

  document.getElementById("status").innerText =
    `${format(diff)} | ${money}$`;

  /* FIREBASE LOG (MINDENKINEK) */
  await set(push(ref(db,"logs")),{
    nev,
    money,
    time:diff,
    rank:document.getElementById("rang").value,
    createdAt:Date.now()
  });

  /* DISCORD (BEST EFFORT) */
  try{
    await fetch(WEBHOOK,{
      method:"POST",
      body:JSON.stringify({
        content:`📊 Munka vége\n👤 ${nev}\n⏱ ${format(diff)}\n💰 ${money}$`
      })
    });
  }catch(e){
    console.log("Discord fail (nem kritikus)");
  }
};
</script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.grid{display:grid;grid-template-columns:300px 500px;gap:20px;}

.panel{
  background:#111827;
  padding:20px;
  border-radius:15px;
}

input,select{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
  background:#1f2937;
  color:white;
}

button{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:bold;
  background:linear-gradient(45deg,#3b82f6,#8b5cf6);
  color:white;
}

button:hover{transform:scale(1.05);}

#logBox{
  max-height:200px;
  overflow:auto;
  background:#0b1220;
  padding:10px;
  border-radius:10px;
  font-size:12px;
}

.log{
  border-bottom:1px solid #1f2937;
  padding:5px;
}
</style>
</head>

<body>

<div class="grid">

<div class="panel">
<input id="nev" placeholder="Név">

<select id="rang">
<option>Boss</option>
<option>UnderBoss</option>
<option>Capo</option>
<option>Soldier</option>
</select>

<button onclick="start()">START</button>
<button onclick="pause()">PAUSE</button>
<button onclick="resume()">RESUME</button>
<button onclick="end()">END</button>

<div id="live"></div>
<div id="status"></div>

<h3>LOG</h3>
<div id="logBox"></div>
</div>

</div>

</body>
</html>
