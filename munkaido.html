<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Munkaidő PRO Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase, ref, push, set, update, onValue, remove, get, onDisconnect
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* STATE */
let startTime=null;
let paused=false;
let pauseStart=null;
let pausedTime=0;
let timer=null;
let payDate=null;
let chart;

/* RANGOK */
const jobs={
  Boss:500,
  UnderBoss:400,
  Capo:300,
  Soldier:200
};

/* FORMAT */
const format=s=>`${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m ${s%60}s`;

function safe(){
  return document.getElementById("nev").value.replaceAll(" ","_");
}

/* PAY DATE */
function getCountdown(){
  if(!payDate) return null;

  const diff=payDate-Date.now();
  if(diff<=0) return {text:"MA VAN A FIZETÉS!",state:"danger"};

  const d=Math.floor(diff/86400000);
  const h=Math.floor((diff/3600000)%24);

  if(d===0){
    return {text:`⚠️ Fizetés ma ${h} órán belül`,state:"warning"};
  }

  if(d<=2){
    return {text:`🔥 Fizetés közel: ${d} nap ${h} óra`,state:"warning"};
  }

  return {text:`📅 Következő fizetés: ${d} nap ${h} óra`,state:"ok"};
}

window.savePayDate=()=>{
  const v=document.getElementById("payDate").value;
  if(!v) return;

  set(ref(db,"settings/payDate"),{
    value:new Date(v).getTime()
  });
};

window.addWeek=()=>{
  if(!payDate) return;
  payDate+=604800000;
  set(ref(db,"settings/payDate"),{value:payDate});
};

onValue(ref(db,"settings/payDate"),snap=>{
  if(!snap.exists()) return;
  payDate=snap.val().value;

  document.getElementById("payDate").value=
    new Date(payDate).toISOString().slice(0,16);
});

/* SYSTEM MESSAGES */
let msgIndex=0;

function systemMessages(){
  const pay=getCountdown();

  const msgs=[
    "⚠️ Heti elszámolás aktív",
    pay ? pay.text : "📅 Fizetés nincs beállítva",
    "📊 Minden adat mentve Firebase-be",
    "🟢 Online státusz aktív rendszer"
  ];

  const el=document.getElementById("noticeText");
  el.innerText=msgs[msgIndex%msgs.length];

  const payBox=document.getElementById("payStatus");

  if(pay){
    payBox.innerText=pay.text;

    payBox.className=
      pay.state==="danger" ? "danger" :
      pay.state==="warning" ? "warning" : "ok";
  }

  msgIndex++;
}

setInterval(systemMessages,4000);

/* TIMER */
window.start=()=>{
  startTime=Date.now();
  paused=false;
  pausedTime=0;
  pauseStart=null;

  startTimer();
};

window.pause=()=>{
  if(paused) return;
  pauseStart=Date.now();
  paused=true;
};

window.resume=()=>{
  if(!paused) return;

  pausedTime+=Math.floor((Date.now()-pauseStart)/1000);
  paused=false;
};

window.end=async()=>{
  const s=safe();

  if(paused && pauseStart){
    pausedTime+=Math.floor((Date.now()-pauseStart)/1000);
  }

  clearInterval(timer);

  const diff=getDiff();
  const money=Math.floor((diff/3600)*jobs[document.getElementById("rang").value]);

  await set(push(ref(db,"log1")),{
    nev:document.getElementById("nev").value,
    money,
    time:diff,
    createdAt:Date.now()
  });

  await set(push(ref(db,`userLogs/${s}`)),{
    money,time:diff,createdAt:Date.now()
  });

  await remove(ref(db,`sessions/${s}`));
};

/* DIFF */
function getDiff(){
  let d=Math.floor((Date.now()-startTime)/1000)-pausedTime;

  if(paused && pauseStart){
    d-=Math.floor((Date.now()-pauseStart)/1000);
  }

  return Math.max(0,d);
}

/* TIMER */
function startTimer(){
  clearInterval(timer);

  timer=setInterval(()=>{
    if(!startTime) return;

    const diff=getDiff();
    const money=Math.floor((diff/3600)*jobs[document.getElementById("rang").value]);

    document.getElementById("live").innerText=
      `${format(diff)} • ${money}$`;
  },1000);
}

/* GLOBAL LOG */
onValue(ref(db,"log1"),snap=>{
  const box=document.getElementById("globalLog");
  box.innerHTML="";

  const stats={};

  snap.forEach(c=>{
    const v=c.val();
    stats[v.nev]=(stats[v.nev]||0)+v.money;

    const div=document.createElement("div");
    div.className="log";
    div.innerHTML=`${v.nev} • ${v.money}$ • ${format(v.time)}`;

    box.prepend(div);
  });

  renderChart(stats);
});

/* CHART */
let chart;
function renderChart(data){
  const ctx=document.getElementById("chart");

  if(chart) chart.destroy();

  chart=new Chart(ctx,{
    type:"bar",
    data:{
      labels:Object.keys(data),
      datasets:[{
        label:"Kereset",
        data:Object.values(data)
      }]
    }
  });
}

/* CSS + INIT */
setInterval(systemMessages,4000);
</script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0b1220;
  color:white;
}

.notice{
  padding:12px;
  text-align:center;
  background:#111827;
  border-bottom:1px solid #1f2937;
}

/* PAY STATUS BAR */
#payStatus{
  padding:10px;
  margin:10px;
  border-radius:10px;
  text-align:center;
}

.ok{background:#065f46;}
.warning{background:#92400e;}
.danger{background:#7f1d1d;}

.container{
  display:grid;
  grid-template-columns:300px 1fr 300px;
  gap:15px;
  padding:15px;
}

.panel,.dash{
  background:#111827;
  border-radius:15px;
  padding:15px;
}

.log{
  background:#0b1220;
  padding:8px;
  margin:5px 0;
  border-radius:10px;
}

button,select,input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:10px;
  border:none;
  background:#0b1220;
  color:white;
}
</style>

</head>

<body>

<div class="notice" id="noticeText"></div>

<div id="payStatus">Fizetés betöltés...</div>

<div class="container">

<div class="panel">

<select id="nev">
<option>David Jackson</option>
<option>Dylen Benedict</option>
<option>Olla Ronaldo</option>
<option>Clinton Morris</option>
<option>Jackson West</option>
</select>

<select id="rang">
<option>Boss</option>
<option>UnderBoss</option>
<option>Capo</option>
<option>Soldier</option>
</select>

<button onclick="start()">START</button>
<button onclick="pause()">PAUSE</button>
<button onclick="resume()">RESUME</button>
<button onclick="end()">END</button>

<div id="live"></div>

<h3>GLOBAL LOG</h3>
<div id="globalLog"></div>

</div>

<div class="dash">

<h3>STATS</h3>
<canvas id="chart"></canvas>

</div>

</div>

</body>
</html>
