<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TikTok Full Fix</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:black;
  font-family:Arial;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
}

/* VIDEO */

.video{
  width:100%;
  height:100vh;
  position:relative;
  scroll-snap-align:start;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:black;
}

/* UPLOAD */

.upload{
  position:fixed;
  top:10px;
  left:10px;
  z-index:9999;
  background:rgba(0,0,0,0.7);
  padding:15px;
  border-radius:15px;
  color:white;
}

.upload input{
  width:220px;
  padding:10px;
  margin:5px 0;
  border:none;
  border-radius:10px;
}

.upload button{
  width:100%;
  padding:10px;
  background:#ff0050;
  border:none;
  border-radius:10px;
  color:white;
}

/* SOUND */

.sound{
  position:fixed;
  top:10px;
  right:10px;
  z-index:9999;
  background:rgba(255,255,255,0.2);
  padding:10px 15px;
  border-radius:10px;
  color:white;
  cursor:pointer;
}

/* OVERLAY */

.overlay{
  position:absolute;
  bottom:120px;
  left:20px;
  color:white;
}

.title{
  font-size:24px;
  font-weight:bold;
}

/* ACTIONS */

.actions{
  position:absolute;
  right:15px;
  bottom:150px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.btn{
  width:60px;
  height:60px;
  border-radius:50%;
  background:rgba(255,255,255,0.2);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:24px;
  cursor:pointer;
  user-select:none;
}

/* COMMENTS */

.comments{
  position:absolute;
  bottom:20px;
  left:20px;
  right:20px;
  background:rgba(0,0,0,0.5);
  padding:10px;
  border-radius:10px;
  color:white;
  max-height:150px;
  overflow:auto;
}

.comment-input{
  display:flex;
  margin-top:5px;
}

.comment-input input{
  flex:1;
  padding:8px;
  border:none;
  border-radius:8px;
}

.comment-input button{
  margin-left:5px;
  padding:8px;
  border:none;
  background:#ff0050;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

.comment-item{
  font-size:13px;
  margin-bottom:5px;
}

</style>
</head>

<body>

<!-- UPLOAD -->

<div class="upload">

<input id="title" placeholder="Videó cím">

<input type="file" id="file" accept="video/*">

<button onclick="uploadVideo()">Feltöltés</button>

<div id="status"></div>

</div>

<!-- SOUND -->

<div class="sound" onclick="toggleSound()">
🔊 Hang
</div>

<!-- FEED -->

<div id="feed"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  onValue,
  update
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:70086de26402ceb3464b89"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* CLOUDINARY */

const CLOUD_NAME = "dueligmyb";
const UPLOAD_PRESET = "ml_default";

/* SOUND STATE */

let soundEnabled = false;

/* UPLOAD */

window.uploadVideo = async function(){

  const file = document.getElementById("file").files[0];
  const title = document.getElementById("title").value;

  if(!file || !title){
    alert("Adj címet és videót!");
    return;
  }

  document.getElementById("status").innerText = "Feltöltés...";

  const form = new FormData();
  form.append("file", file);
  form.append("upload_preset", UPLOAD_PRESET);

  const res = await fetch(
    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`,
    { method:"POST", body:form }
  );

  const data = await res.json();

  await push(ref(db,"videos"),{
    title:title,
    url:data.secure_url,
    likes:0
  });

  document.getElementById("status").innerText = "Kész!";
};

/* LIKE */

window.likeVideo = async function(id, likes){

  await update(ref(db,"videos/"+id),{
    likes:(likes||0)+1
  });

};

/* FEED */

const feed = document.getElementById("feed");

onValue(ref(db,"videos"), snap=>{

  const data = snap.val();

  feed.innerHTML = "";

  if(!data) return;

  Object.entries(data).reverse().forEach(([id,v])=>{

    const div = document.createElement("div");
    div.className = "video";

    div.innerHTML = `

      <video
        src="${v.url}"
        autoplay
        muted
        loop
        playsinline
      ></video>

      <div class="overlay">
        <div class="title">${v.title}</div>
      </div>

      <div class="actions">

        <div class="btn" onclick="likeVideo('${id}',${v.likes||0})">
          ❤️
          <div style="font-size:12px">${v.likes||0}</div>
        </div>

        <div class="btn">💬</div>

      </div>

      <div class="comments">
        💬 Komment rendszer (demo)
      </div>

    `;

    feed.appendChild(div);

  });

  setupAutoPlay();

});

/* AUTOPLAY + SOUND FIX */

function setupAutoPlay(){

  const videos = document.querySelectorAll("video");

  const obs = new IntersectionObserver(entries=>{

    entries.forEach(e=>{

      if(e.isIntersecting){

        videos.forEach(v=>v.muted = true);

        e.target.play();

        if(soundEnabled){
          e.target.muted = false;
        }

      }else{
        e.target.pause();
        e.target.muted = true;
      }

    });

  },{threshold:0.8});

  videos.forEach(v=>obs.observe(v));

}

/* SOUND TOGGLE */

window.toggleSound = function(){

  soundEnabled = !soundEnabled;

  const videos = document.querySelectorAll("video");

  videos.forEach(v=>{

    v.muted = !soundEnabled;

  });

};

</script>

</body>
</html>
