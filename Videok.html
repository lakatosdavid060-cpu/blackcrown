<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Live TikTok Stream</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  background:black;

  font-family:Arial,sans-serif;

  overflow:hidden;

  color:white;
}

/* LIVE VIDEO */

.live-container{

  position:relative;

  width:100vw;

  height:100vh;

  background:black;
}

video{

  width:100%;

  height:100%;

  object-fit:cover;

  background:black;
}

/* OVERLAY */

.overlay{

  position:absolute;

  inset:0;

  background:
  linear-gradient(
    to top,
    rgba(0,0,0,0.7),
    rgba(0,0,0,0.1),
    transparent
  );

  pointer-events:none;
}

/* TOP BAR */

.top-bar{

  position:absolute;

  top:20px;

  left:20px;

  display:flex;

  align-items:center;

  gap:10px;

  z-index:10;
}

.live-badge{

  background:red;

  padding:8px 14px;

  border-radius:30px;

  font-weight:bold;

  animation:pulse 1s infinite;
}

@keyframes pulse{

  0%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.1);
  }

  100%{
    transform:scale(1);
  }

}

/* VIEWERS */

.viewers{

  background:rgba(255,255,255,0.15);

  padding:8px 14px;

  border-radius:30px;

  backdrop-filter:blur(5px);
}

/* STREAM INFO */

.stream-info{

  position:absolute;

  bottom:120px;

  left:20px;

  z-index:10;
}

.stream-title{

  font-size:30px;

  font-weight:bold;

  margin-bottom:10px;
}

.stream-desc{

  font-size:18px;

  color:#ddd;
}

/* ACTION BUTTONS */

.actions{

  position:absolute;

  right:15px;

  bottom:120px;

  display:flex;

  flex-direction:column;

  gap:20px;

  z-index:10;
}

.action{

  width:65px;

  height:65px;

  border-radius:50%;

  background:rgba(255,255,255,0.2);

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:30px;

  backdrop-filter:blur(8px);

  cursor:pointer;

  transition:0.2s;
}

.action:hover{

  transform:scale(1.1);
}

/* CHAT */

.chat{

  position:absolute;

  left:20px;

  bottom:20px;

  width:350px;

  max-height:300px;

  overflow:auto;

  z-index:10;
}

.message{

  background:rgba(0,0,0,0.5);

  padding:10px;

  border-radius:12px;

  margin-top:8px;

  backdrop-filter:blur(5px);
}

/* INPUT */

.chat-input{

  position:absolute;

  bottom:20px;

  right:20px;

  display:flex;

  gap:10px;

  z-index:10;
}

.chat-input input{

  width:250px;

  padding:14px;

  border:none;

  border-radius:30px;

  outline:none;
}

.chat-input button{

  border:none;

  border-radius:30px;

  padding:14px 22px;

  background:#ff0050;

  color:white;

  cursor:pointer;

  font-weight:bold;
}

.chat-input button:hover{

  background:#ff2366;
}

/* LOADING */

.loading{

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:26px;

  background:black;

  z-index:100;
}

</style>

</head>

<body>

<div class="live-container">

<div class="loading" id="loading">
LIVE BETÖLTÉS...
</div>

<video
id="video"
autoplay
muted
playsinline
controls
></video>

<div class="overlay"></div>

<!-- TOP -->

<div class="top-bar">

<div class="live-badge">
LIVE
</div>

<div class="viewers" id="viewerCount">
👁 1.2K
</div>

</div>

<!-- INFO -->

<div class="stream-info">

<div class="stream-title">
🔥 TikTok Live Stream
</div>

<div class="stream-desc">
Cloudinary ultra gyors HLS stream
</div>

</div>

<!-- ACTIONS -->

<div class="actions">

<div class="action">❤️</div>

<div class="action">💬</div>

<div class="action">🔗</div>

<div class="action">➕</div>

</div>

<!-- CHAT -->

<div class="chat" id="chat">

<div class="message">
👤 Dani: Brutál jó stream 🔥
</div>

<div class="message">
👤 Alex: Nagyon gyors 😮
</div>

</div>

<!-- INPUT -->

<div class="chat-input">

<input
type="text"
id="messageInput"
placeholder="Üzenet..."
>

<button onclick="sendMessage()">
Küldés
</button>

</div>

</div>

<script>

////////////////////////////////////////////////////////
// CLOUDINARY HLS
////////////////////////////////////////////////////////

const video =
  document.getElementById("video");

const videoSrc =
"https://res.cloudinary.com/dueligmyb/video/live/live_stream_19443302297e4abf92092caaf6bf86f9_hls.m3u8";

if(Hls.isSupported()){

  const hls =
    new Hls({

      maxBufferLength:30,

      maxMaxBufferLength:60,

      enableWorker:true,

      lowLatencyMode:true

    });

  hls.loadSource(videoSrc);

  hls.attachMedia(video);

  hls.on(
    Hls.Events.MANIFEST_PARSED,

    ()=>{

      video.play();

      document.getElementById(
        "loading"
      ).style.display = "none";

    }
  );

}else if(video.canPlayType(
'application/vnd.apple.mpegurl'
)){

  video.src = videoSrc;

  video.addEventListener(
    'loadedmetadata',

    ()=>{

      video.play();

      document.getElementById(
        "loading"
      ).style.display = "none";

    }
  );

}

////////////////////////////////////////////////////////
// CHAT
////////////////////////////////////////////////////////

function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value;

  if(!text) return;

  const chat =
    document.getElementById(
      "chat"
    );

  const div =
    document.createElement("div");

  div.className =
    "message";

  div.innerHTML =
    "👤 Te: " + text;

  chat.appendChild(div);

  input.value = "";

  chat.scrollTop =
    chat.scrollHeight;

}

////////////////////////////////////////////////////////
// FAKE LIVE VIEWERS
////////////////////////////////////////////////////////

setInterval(()=>{

  const count =
    Math.floor(
      1000 + Math.random()*5000
    );

  document.getElementById(
    "viewerCount"
  ).innerHTML =
    "👁 " + count;

},3000);

////////////////////////////////////////////////////////
// DOUBLE TAP LIKE
////////////////////////////////////////////////////////

let lastTap = 0;

document.addEventListener(
  "touchend",

  function(event){

    const currentTime =
      new Date().getTime();

    const tapLength =
      currentTime - lastTap;

    if(tapLength < 300 && tapLength > 0){

      showHeart(
        event.changedTouches[0].clientX,
        event.changedTouches[0].clientY
      );

    }

    lastTap = currentTime;

  }
);

function showHeart(x,y){

  const heart =
    document.createElement("div");

  heart.innerHTML = "❤️";

  heart.style.position = "fixed";

  heart.style.left = x + "px";

  heart.style.top = y + "px";

  heart.style.fontSize = "60px";

  heart.style.zIndex = "9999";

  heart.style.pointerEvents = "none";

  heart.style.transition = "1s";

  document.body.appendChild(heart);

  setTimeout(()=>{

    heart.style.transform =
      "translateY(-150px) scale(1.5)";

    heart.style.opacity = "0";

  },50);

  setTimeout(()=>{

    heart.remove();

  },1000);

}

</script>

</body>
</html>
