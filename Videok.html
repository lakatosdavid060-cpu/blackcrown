<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TikTok Clone</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:black;
  overflow-y:scroll;
  scroll-snap-type:y mandatory;
  height:100vh;
  font-family:Arial;
}

.video-container{

  width:100%;

  height:100vh;

  position:relative;

  scroll-snap-align:start;

  overflow:hidden;
}

video{

  width:100%;

  height:100%;

  object-fit:cover;
}

.overlay{

  position:absolute;

  bottom:100px;

  left:20px;

  color:white;

  z-index:5;
}

.title{

  font-size:28px;

  font-weight:bold;
}

.actions{

  position:absolute;

  right:15px;

  bottom:120px;

  display:flex;

  flex-direction:column;

  gap:20px;

  z-index:5;
}

.action{

  width:65px;

  height:65px;

  border-radius:50%;

  background:rgba(255,255,255,0.2);

  display:flex;

  align-items:center;

  justify-content:center;

  color:white;

  font-size:28px;

  backdrop-filter:blur(5px);
}

/* UPLOAD */

.upload{

  position:fixed;

  top:10px;

  left:10px;

  z-index:9999;

  background:rgba(0,0,0,0.7);

  padding:15px;

  border-radius:15px;
}

.upload input{

  width:220px;

  padding:12px;

  margin:5px 0;

  border:none;

  border-radius:10px;
}

.upload button{

  width:100%;

  padding:12px;

  border:none;

  border-radius:10px;

  background:#ff0050;

  color:white;

  cursor:pointer;
}

#progress{

  color:white;

  margin-top:10px;
}

</style>

</head>

<body>

<!-- UPLOAD -->

<div class="upload">

<input
type="text"
id="title"
placeholder="Videó címe"
>

<input
type="file"
id="file"
accept="video/*"
>

<button onclick="uploadVideo()">
Feltöltés
</button>

<div id="progress"></div>

</div>

<!-- FEED -->

<div id="feed"></div>

<script type="module">

////////////////////////////////////////////////////////
// FIREBASE
////////////////////////////////////////////////////////

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",

  authDomain: "ordog-fizetes.firebaseapp.com",

  databaseURL:
  "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",

  projectId: "ordog-fizetes",

  storageBucket:
  "ordog-fizetes.firebasestorage.app",

  messagingSenderId:
  "672089263660",

  appId:
  "1:672089263660:web:70086de26402ceb3464b89"

};

const app =
  initializeApp(firebaseConfig);

const db =
  getDatabase(app);

////////////////////////////////////////////////////////
// CLOUDINARY
////////////////////////////////////////////////////////

const CLOUD_NAME = "dueligmyb";

const UPLOAD_PRESET = "IDE_A_PRESET";

////////////////////////////////////////////////////////
// UPLOAD
////////////////////////////////////////////////////////

window.uploadVideo =
async function(){

  const file =
    document.getElementById(
      "file"
    ).files[0];

  const title =
    document.getElementById(
      "title"
    ).value;

  if(!file || !title){

    alert("Adj videót és címet");

    return;
  }

  const formData =
    new FormData();

  formData.append(
    "file",
    file
  );

  formData.append(
    "upload_preset",
    UPLOAD_PRESET
  );

  const xhr =
    new XMLHttpRequest();

  xhr.open(
    "POST",
    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`
  );

  xhr.upload.addEventListener(
    "progress",

    (e)=>{

      const percent =
        Math.floor(
          (e.loaded/e.total)*100
        );

      document.getElementById(
        "progress"
      ).innerText =
        "Feltöltés: " +
        percent + "%";

    }
  );

  xhr.onload =
  async ()=>{

    const data =
      JSON.parse(
        xhr.responseText
      );

    await push(

      ref(db,"videos"),

      {

        title:title,

        url:data.secure_url,

        created:Date.now()

      }

    );

    document.getElementById(
      "progress"
    ).innerText =
      "Kész!";

  };

  xhr.send(formData);

}

////////////////////////////////////////////////////////
// REALTIME FEED
////////////////////////////////////////////////////////

const feed =
  document.getElementById(
    "feed"
  );

onValue(

  ref(db,"videos"),

  (snapshot)=>{

    const data =
      snapshot.val();

    feed.innerHTML = "";

    if(!data) return;

    const videos =
      Object.values(data)
      .reverse();

    videos.forEach(video=>{

      const div =
        document.createElement("div");

      div.className =
        "video-container";

      div.innerHTML = `

      <video
      src="${video.url}"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      ></video>

      <div class="overlay">

        <div class="title">
          ${video.title}
        </div>

      </div>

      <div class="actions">

        <div class="action">
        ❤️
        </div>

        <div class="action">
        💬
        </div>

        <div class="action">
        🔗
        </div>

      </div>

      `;

      feed.appendChild(div);

    });

    autoplay();

  }

);

////////////////////////////////////////////////////////
// AUTOPLAY
////////////////////////////////////////////////////////

function autoplay(){

  const videos =
    document.querySelectorAll(
      "video"
    );

  const observer =
    new IntersectionObserver(

      (entries)=>{

        entries.forEach(entry=>{

          if(entry.isIntersecting){

            entry.target.play();

          }else{

            entry.target.pause();

          }

        });

      },

      {
        threshold:0.7
      }

    );

  videos.forEach(video=>{

    observer.observe(video);

  });

}

</script>

</body>
</html>
