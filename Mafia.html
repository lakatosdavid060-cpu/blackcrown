<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🛡 BLACK CROWN ORGANIZATION 🛡</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>

/* =========================
   ALAP
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cinzel', serif;
}

body{
    background:black;
    color:white;
    overflow-x:hidden;
}

/* =========================
   HÁTTÉR (SÖTÉT VÁROS)
========================= */
.bg{
    position:fixed;
    inset:0;
    background:url("https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=1800&q=80");
    background-size:cover;
    background-position:center;
    filter:brightness(0.22);
    z-index:-3;
}

/* füst */
.smoke{
    position:fixed;
    inset:0;
    background:radial-gradient(circle,rgba(255,215,0,0.06),transparent 60%);
    animation:smoke 25s linear infinite;
    z-index:-2;
}

@keyframes smoke{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
}

/* =========================
   KÖZPONTI HEADER
========================= */
.hero{
    text-align:center;
    padding:80px 20px;
}

.crown{
    font-size:90px;
    animation:float 3s infinite ease-in-out;
    text-shadow:0 0 25px gold;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

h1{
    color:gold;
    font-size:3rem;
    text-shadow:0 0 20px gold;
}

.subtitle{
    margin-top:15px;
    color:#ddd;
}

/* =========================
   GOMBOK
========================= */
.btn{
    display:inline-block;
    margin-top:20px;
    padding:15px 35px;
    background:linear-gradient(45deg,#ffd700,#b8860b);
    color:black;
    font-weight:bold;
    border-radius:12px;
    text-decoration:none;
    transition:.3s;
    cursor:pointer;
}

.btn:hover{
    transform:scale(1.1);
}

/* =========================
   RANGOK
========================= */
.section{
    padding:80px 20px;
    text-align:center;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    margin-top:30px;
}

.card{
    background:rgba(0,0,0,0.6);
    border:1px solid rgba(255,215,0,0.3);
    padding:20px;
    border-radius:15px;
    transition:.3s;
}

.card:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px gold;
}

.card h3{
    color:gold;
}

/* =========================
   FORM
========================= */
form{
    max-width:500px;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

input, textarea{
    padding:12px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.1);
    color:white;
}

/* =========================
   ADMIN PANEL
========================= */
#adminPanel{
    display:none;
    padding:30px;
    background:#0b0b0b;
}

.loginBox{
    padding:100px;
    text-align:center;
}

.cardAdmin{
    background:#111;
    padding:15px;
    margin:10px 0;
    border-left:4px solid gold;
}

.del{
    background:red;
    color:white;
    border:none;
    padding:5px 10px;
    cursor:pointer;
}

.export{
    background:gold;
    color:black;
    padding:10px;
    cursor:pointer;
    display:inline-block;
    margin-bottom:10px;
}

</style>
</head>

<body>

<div class="bg"></div>
<div class="smoke"></div>

<!-- ================= HERO ================= -->
<div class="hero">

    <div class="crown">👑</div>

    <h1>BLACK CROWN ORGANIZATION</h1>

    <div class="subtitle">
        A korona nem jár mindenkinek — ki kell érdemelni.
    </div>

    <a class="btn" href="https://discord.gg/9SjXeJg7vu" target="_blank">
        CSATLAKOZÁS DISCORDHOZ
    </a>

</div>

<!-- ================= RANGOK ================= -->
<div class="section">
<h2 style="color:gold;">🏆 Rangrendszer</h2>

<div class="grid">

<div class="card"><h3>👑 Boss</h3></div>
<div class="card"><h3>🕴 Underboss</h3></div>
<div class="card"><h3>📜 Consigliere</h3></div>
<div class="card"><h3>⚔ Caporegime</h3></div>
<div class="card"><h3>🔫 Soldier</h3></div>

</div>
</div>

<!-- ================= JELENTKEZÉS ================= -->
<div class="section">
<h2 style="color:gold;">⚔ Tagfelvétel</h2>

<form onsubmit="sendForm(event)">
<input id="name" placeholder="Név" required>
<input id="age" placeholder="Kor" required>
<textarea id="reason" placeholder="Miért csatlakoznál?" required></textarea>

<button class="btn" type="submit">JELENTKEZÉS</button>
</form>
</div>

<!-- ================= ADMIN LOGIN ================= -->
<div class="section loginBox" id="loginBox">

<h2 style="color:gold;">🔐 Admin Login</h2>

<input type="password" id="pass" placeholder="Jelszó">
<br><br>
<button class="btn" onclick="login()">Belépés</button>

</div>

<!-- ================= ADMIN PANEL ================= -->
<div id="adminPanel">

<h2 style="color:gold;">📜 Jelentkezések</h2>

<div class="export" onclick="exportData()">📥 Export JSON</div>

<div id="list"></div>

</div>

<script>

/* =========================
   JELENTKEZÉS MENTÉS
========================= */
function sendForm(e){
    e.preventDefault();

    let name=document.getElementById("name").value;
    let age=document.getElementById("age").value;
    let reason=document.getElementById("reason").value;

    let data=JSON.parse(localStorage.getItem("apps")||"[]");

    data.push({name,age,reason});

    localStorage.setItem("apps",JSON.stringify(data));

    alert("Jelentkezés elküldve!");

    window.open("https://discord.gg/9SjXeJg7vu","_blank");
}

/* =========================
   ADMIN LOGIN
========================= */
const ADMIN_PASS="1234";

function login(){

    let p=document.getElementById("pass").value;

    if(p===ADMIN_PASS){

        document.getElementById("loginBox").style.display="none";
        document.getElementById("adminPanel").style.display="block";

        load();

    }else{
        alert("Hibás jelszó!");
    }
}

/* =========================
   BETÖLTÉS
========================= */
function load(){

    let data=JSON.parse(localStorage.getItem("apps")||"[]");

    let list=document.getElementById("list");

    list.innerHTML="";

    data.forEach((a,i)=>{

        let div=document.createElement("div");
        div.className="cardAdmin";

        div.innerHTML=`
        <b>Név:</b> ${a.name}<br>
        <b>Kor:</b> ${a.age}<br>
        <b>Indok:</b> ${a.reason}<br><br>
        <button class="del" onclick="del(${i})">Törlés</button>
        `;

        list.appendChild(div);

    });

}

/* =========================
   TÖRLÉS
========================= */
function del(i){

    let data=JSON.parse(localStorage.getItem("apps")||"[]");

    data.splice(i,1);

    localStorage.setItem("apps",JSON.stringify(data));

    load();
}

/* =========================
   EXPORT
========================= */
function exportData(){

    let data=localStorage.getItem("apps");

    let blob=new Blob([data],{type:"application/json"});

    let a=document.createElement("a");

    a.href=URL.createObjectURL(blob);

    a.download="blackcrown_applications.json";

    a.click();
}

</script>

</body>
</html>
