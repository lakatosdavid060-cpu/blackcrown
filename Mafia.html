<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🛡BLACK CROWN ORGANIZATION🛡</title>

<meta http-equiv="refresh" content="8;url=DISCORD_INVITE_LINK">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Cinzel',serif;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    color:white;
}

/* Háttér */
.bg{
    position:absolute;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle at center,#2d1b00 0%,#000 70%);
    z-index:-3;
}

/* Füst effekt */
.smoke{
    position:absolute;
    width:200%;
    height:200%;
    background:
    radial-gradient(circle,rgba(255,215,0,0.08) 0%,transparent 60%);
    animation:smokeMove 25s linear infinite;
    z-index:-2;
}

@keyframes smokeMove{
    from{
        transform:translate(-20%,-20%) rotate(0deg);
    }
    to{
        transform:translate(20%,20%) rotate(360deg);
    }
}

.container{
    text-align:center;
    padding:50px;
    border:2px solid rgba(255,215,0,0.4);
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(10px);
    border-radius:25px;
    box-shadow:
    0 0 20px gold,
    0 0 60px rgba(255,215,0,.4);
}

.crown{
    font-size:90px;
    animation:float 3s ease-in-out infinite;
    text-shadow:
    0 0 15px gold,
    0 0 40px gold;
}

@keyframes float{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-15px);
    }
}

h1{
    margin-top:10px;
    font-size:3rem;
    color:gold;
    text-shadow:
    0 0 10px gold,
    0 0 30px gold;
}

.subtitle{
    margin-top:15px;
    color:#d8d8d8;
    letter-spacing:2px;
}

.discord{
    font-size:80px;
    margin:30px 0;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.1);
    }
    100%{
        transform:scale(1);
    }
}

.countdown{
    margin-top:15px;
    font-size:1.2rem;
    color:gold;
}

.btn{
    display:inline-block;
    margin-top:25px;
    padding:15px 40px;
    background:linear-gradient(45deg,#ffd700,#b8860b);
    color:black;
    text-decoration:none;
    font-weight:bold;
    border-radius:12px;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.08);
    box-shadow:0 0 20px gold;
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="smoke"></div>

<audio autoplay loop>
    <source src="MUSIC_URL" type="audio/mpeg">
</audio>

<div class="container">

    <div class="crown">👑</div>

    <h1>🛡 BLACK CROWN ORGANIZATION 🛡</h1>

    <div class="subtitle">
        Loyalty • Respect • Power
    </div>

    <div class="discord">💬</div>

    <p>
        A szervezet kapui nyitva állnak.<br>
        Csatlakozz a családhoz.
    </p>

    <div class="countdown">
        Átirányítás Discordra...
        <span id="timer">8</span>
    </div>

    <a class="btn" href="DISCORD_INVITE_LINK">
        BELÉPÉS A DISCORDRA
    </a>

</div>

<script>
let time = 8;
const timer = document.getElementById("timer");

setInterval(() => {
    time--;
    if(time >= 0){
        timer.innerText = time;
    }
}, 1000);

setTimeout(() => {
    window.location.href = "DISCORD_INVITE_LINK";
}, 8000);
</script>

</body>
</html>
