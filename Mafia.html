<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🛡 BLACK CROWN ORGANIZATION 🛡</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cinzel', serif;
}

body{
    background:black;
    color:white;
    overflow-x:hidden;
}

/* ===== HÁTTÉR ===== */
.bg{
    position:fixed;
    inset:0;
    background:url("https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=1800&q=80");
    background-size:cover;
    background-position:center;
    filter:brightness(0.2);
    z-index:-3;
}

/* ===== HERO ===== */
.hero{
    text-align:center;
    padding:80px 20px;
}

.crown{
    font-size:90px;
    animation:float 3s infinite ease-in-out;
    text-shadow:0 0 25px gold;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

h1{
    color:gold;
    font-size:3rem;
    text-shadow:0 0 20px gold;
}

.subtitle{
    margin-top:15px;
    color:#ddd;
}

/* ===== GOMB ===== */
.btn{
    display:inline-block;
    margin-top:20px;
    padding:15px 35px;
    background:linear-gradient(45deg,#ffd700,#b8860b);
    color:black;
    font-weight:bold;
    border-radius:12px;
    text-decoration:none;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.1);
}

/* ===== RANGOK ===== */
.section{
    padding:60px 20px;
    text-align:center;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    margin-top:30px;
}

.card{
    background:rgba(0,0,0,0.6);
    border:1px solid rgba(255,215,0,0.3);
    padding:20px;
    border-radius:15px;
}

.card h3{
    color:gold;
}

/* ===== FORM ===== */
form{
    max-width:500px;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:10px;
}

input, textarea{
    padding:12px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,0.1);
    color:white;
}

/* ===== ADMIN ===== */
#admin{
    display:none;
    padding:20px;
    background:#0b0b0b;
}

.cardAdmin{
    background:#111;
    padding:15px;
    margin:10px 0;
    border-left:4px solid gold;
}

.ok{background:green;color:white;padding:5px 10px;border:none;cursor:pointer;}
.del{background:red;color:white;padding:5px 10px;border:none;cursor:pointer;}

</style>
</head>

<body>

<div class="bg"></div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue, update, remove }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* ===== FIREBASE ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy1xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:3797a2fc935c63a0464b89"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ===== DISCORD WEBHOOK ===== */
const WEBHOOK_URL = "https://discord.com/api/webhooks/1510453541574279299/naiH2nbj8eVxWGAKQhzAOXvx45pir4Zq9Lbh8h3tdz83x8KLJOILaMNTDjUg_WvmHS4n";

/* =========================
   JELENTKEZÉS
========================= */
window.sendForm = function(e){
    e.preventDefault();

    const name = document.getElementById("name").value;
    const age = document.getElementById("age").value;
    const reason = document.getElementById("reason").value;

    push(ref(db,"applications"),{
        name,
        age,
        reason,
        status:"pending"
    });

    fetch(WEBHOOK_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            content:`📥 ÚJ JELENTKEZÉS\n👤 ${name}\n🎂 ${age}\n📜 ${reason}`
        })
    });

    alert("Jelentkezés elküldve!");
    window.open("https://discord.com/api/webhooks/1510453541574279299/naiH2nbj8eVxWGAKQhzAOXvx45pir4Zq9Lbh8h3tdz83x8KLJOILaMNTDjUg_WvmHS4n");
}

/* =========================
   DISCORD UNLOCK
========================= */
function checkAccess(){

    onValue(ref(db,"applications"),snap=>{

        let ok = false;

        snap.forEach(c=>{
            if(c.val().status === "accepted") ok = true;
        });

        const btn = document.getElementById("discordBtn");
        if(btn) btn.style.display = ok ? "inline-block" : "none";
    });
}

/* =========================
   ADMIN LOGIN
========================= */
window.login = function(){

    if(document.getElementById("pass").value === "1234"){
        document.getElementById("admin").style.display="block";
    } else alert("Hibás jelszó!");
}

/* =========================
   LOAD ADMIN
========================= */
const list = document.getElementById("list");

function load(){

onValue(ref(db,"applications"),snap=>{

    list.innerHTML="";

    snap.forEach(child=>{

        const d = child.val();
        const id = child.key;

        const div = document.createElement("div");
        div.className="cardAdmin";

        div.innerHTML=`
            <b>${d.name}</b><br>
            ${d.age}<br>
            ${d.reason}<br>
            <b>${d.status}</b><br><br>

            <button class="ok" onclick="accept('${id}')">Elfogadás</button>
            <button class="del" onclick="reject('${id}')">Elutasítás</button>
            <button class="del" onclick="del('${id}')">Törlés</button>
        `;

        list.appendChild(div);
    });

});

}

/* =========================
   ADMIN ACTIONS + WEBHOOK
========================= */
window.accept = function(id){

    update(ref(db,"applications/"+id),{status:"accepted"});

    fetch(WEBHOOK_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            content:`✅ ELFOGADVA\n🆔 ${id}`
        })
    });
}

window.reject = function(id){

    update(ref(db,"applications/"+id),{status:"rejected"});

    fetch(WEBHOOK_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            content:`❌ ELUTASÍTVA\n🆔 ${id}`
        })
    });
}

window.del = function(id){
    remove(ref(db,"applications/"+id));
}

/* INIT */
load();
checkAccess();

</script>

<!-- ===== UI ===== -->

<div class="hero">

<div class="crown">👑</div>

<h1>BLACK CROWN ORGANIZATION</h1>

<div class="subtitle">
A korona nem jár mindenkinek — ki kell érdemelni.
</div>

<a id="discordBtn" class="btn" href="https://discord.gg/9SjXeJg7vu" target="_blank" style="display:none;">
CSATLAKOZÁS DISCORDHOZ
</a>

</div>

<!-- RANGOK -->
<div class="section">
<h2 style="color:gold;">🏆 Rangok</h2>

<div class="grid">
<div class="card"><h3>Boss</h3></div>
<div class="card"><h3>Underboss</h3></div>
<div class="card"><h3>Consigliere</h3></div>
<div class="card"><h3>Capo</h3></div>
<div class="card"><h3>Soldier</h3></div>
</div>

</div>

<!-- JELENTKEZÉS -->
<div class="section">

<h2 style="color:gold;">⚔ Jelentkezés</h2>

<form onsubmit="sendForm(event)">
<input id="name" placeholder="Név" required>
<input id="age" placeholder="Kor" required>
<textarea id="reason" placeholder="Miért csatlakoznál?" required></textarea>

<button class="btn" type="submit">KÜLDÉS</button>
</form>

</div>

<!-- ADMIN -->
<div class="section">

<h2 style="color:gold;">🔐 Admin</h2>

<input type="password" id="pass" placeholder="Jelszó">
<br><br>
<button class="btn" onclick="login()">Belépés</button>

<div id="admin">
<h3 style="color:gold;margin-top:20px;">📜 Jelentkezések</h3>
<div id="list"></div>
</div>

</div>

</body>
</html>
