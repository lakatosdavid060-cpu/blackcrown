<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🛡 BLACK CROWN ORGANIZATION 🛡</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cinzel', serif;
}

body{
    background:black;
    color:white;
}

/* ===== BACKGROUND ===== */
.bg{
    position:fixed;
    inset:0;
    background:url("https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=1800&q=80");
    background-size:cover;
    background-position:center;
    filter:brightness(0.2);
    z-index:-3;
}

/* ===== HERO ===== */
.hero{
    text-align:center;
    padding:80px 20px;
}

.crown{
    font-size:90px;
    animation:float 3s infinite ease-in-out;
    text-shadow:0 0 25px gold;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

h1{
    color:gold;
    font-size:3rem;
    text-shadow:0 0 20px gold;
}

.subtitle{
    color:#ccc;
}

/* ===== BUTTON ===== */
.btn{
    display:inline-block;
    margin-top:20px;
    padding:15px 35px;
    background:linear-gradient(45deg,#ffd700,#b8860b);
    color:black;
    font-weight:bold;
    border-radius:12px;
    cursor:pointer;
    text-decoration:none;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.1);
}

/* ===== SECTIONS ===== */
.section{
    padding:60px 20px;
    text-align:center;
}

input,textarea{
    padding:12px;
    border-radius:10px;
    border:none;
    margin:5px;
    width:250px;
}

/* ===== ADMIN ===== */
#admin{
    display:none;
    padding:20px;
}

.cardAdmin{
    background:#111;
    padding:10px;
    margin:10px;
    border-left:4px solid gold;
}

.ok{background:green;color:white;border:none;padding:5px;cursor:pointer;}
.del{background:red;color:white;border:none;padding:5px;cursor:pointer;}

/* ===== STATUS COLORS ===== */
.pending{color:orange;}
.accepted{color:lime;}
.rejected{color:red;}

</style>
</head>

<body>

<div class="bg"></div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onValue, update, remove }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy1xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:3797a2fc935c63a0464b89"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const WEBHOOK = "https://discord.com/api/webhooks/1510453541574279299/naiH2nbj8eVxWGAKQhzAOXvx45pir4Zq9Lbh8h3tdz83x8KLJOILaMNTDjUg_WvmHS4n";

/* ===================== JELENTKEZÉS ===================== */
window.sendForm = function(e){
    e.preventDefault();

    const name = nameInput.value;
    const age = ageInput.value;
    const reason = reasonInput.value;

    push(ref(db,"applications"),{
        name,
        age,
        reason,
        status:"pending"
    });

    fetch(WEBHOOK,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            content:`📥 ÚJ JELENTKEZÉS\n👤 ${name}\n🎂 ${age}\n📜 ${reason}`
        })
    });

    alert("Elküldve!");
}

/* ===================== STATUS CHECK ===================== */
window.checkStatus = function(){

    const name = document.getElementById("checkName").value.toLowerCase();

    onValue(ref(db,"applications"),snap=>{

        let found = null;

        snap.forEach(c=>{
            if(c.val().name.toLowerCase() === name){
                found = c.val().status;
            }
        });

        const out = document.getElementById("statusResult");

        if(!found){
            out.innerHTML = "❌ Nincs jelentkezés";
        }
        else if(found === "pending"){
            out.innerHTML = "<span class='pending'>⏳ FÜGGŐBEN</span>";
        }
        else if(found === "accepted"){
            out.innerHTML = "<span class='accepted'>✅ ELFOGADVA</span>";
        }
        else{
            out.innerHTML = "<span class='rejected'>❌ ELUTASÍTVA</span>";
        }
    });
}

/* ===================== ADMIN ===================== */
window.login = function(){
    if(pass.value==="1234"){
        admin.style.display="block";
    }
}

function load(){

onValue(ref(db,"applications"),snap=>{

    list.innerHTML="";

    snap.forEach(c=>{

        const d=c.val();
        const id=c.key;

        let div=document.createElement("div");
        div.className="cardAdmin";

        div.innerHTML=`
        <b>${d.name}</b> (${d.age})<br>
        ${d.reason}<br>
        <b>${d.status}</b><br><br>

        <button class="ok" onclick="accept('${id}')">Elfogadás</button>
        <button class="del" onclick="reject('${id}')">Elutasítás</button>
        <button class="del" onclick="del('${id}')">Törlés</button>
        `;

        list.appendChild(div);
    });

});

}

window.accept=function(id){
    update(ref(db,"applications/"+id),{status:"accepted"});
}

window.reject=function(id){
    update(ref(db,"applications/"+id),{status:"rejected"});
}

window.del=function(id){
    remove(ref(db,"applications/"+id));
}

load();

</script>

<!-- ===== UI ===== -->

<div class="hero">

<div class="crown">👑</div>
<h1>BLACK CROWN ORGANIZATION</h1>
<div class="subtitle">A korona nem jár mindenkinek</div>

<a class="btn" href="https://discord.gg/9SjXeJg7vu" target="_blank">
DISCORD
</a>

</div>

<!-- JELENTKEZÉS -->
<div class="section">

<h2>📜 Jelentkezés</h2>

<form onsubmit="sendForm(event)">
<input id="nameInput" placeholder="Név">
<input id="ageInput" placeholder="Kor">
<textarea id="reasonInput" placeholder="Indok"></textarea>
<br>
<button class="btn">Küldés</button>
</form>

</div>

<!-- STATUS -->
<div class="section">

<h2>📊 Státusz ellenőrzés</h2>

<input id="checkName" placeholder="Név">
<br><br>
<button class="btn" onclick="checkStatus()">Ellenőrzés</button>

<p id="statusResult"></p>

</div>

<!-- ADMIN -->
<div class="section">

<h2>🔐 Admin</h2>

<input id="pass" type="password" placeholder="Jelszó">
<br><br>
<button class="btn" onclick="login()">Belépés</button>

<div id="admin">
<h3>Jelentkezések</h3>
<div id="list"></div>
</div>

</div>

</body>
</html>
