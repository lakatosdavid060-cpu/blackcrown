<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>IG CLEAN V3 FIX</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0b14;
  color: white;
}

header {
  padding: 12px;
  text-align: center;
  background: #111;
  border-bottom: 1px solid #333;
}

#authBox {
  max-width: 400px;
  margin: 50px auto;
  padding: 15px;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  border: none;
}

button {
  background: #ff2d55;
  color: white;
  cursor: pointer;
}

#app {
  display: none;
  max-width: 600px;
  margin: auto;
}

.postBox {
  margin: 10px;
  padding: 10px;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
}

.post {
  margin: 10px;
  background: #1a1a2a;
  border-radius: 10px;
  overflow: hidden;
}

.post img {
  width: 100%;
}

.postContent {
  padding: 10px;
}
</style>
</head>

<body>

<header>🔥 IG CLEAN V3 FIX</header>

<!-- AUTH -->
<div id="authBox">
  <input id="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Password">

  <button id="regBtn">Register</button>
  <button id="loginBtn">Login</button>

  <p id="status"></p>
</div>

<!-- APP -->
<div id="app">

  <div class="postBox">
    <input id="img" placeholder="Image URL">
    <input id="text" placeholder="Caption">
    <button id="postBtn">Post</button>
  </div>

  <div id="feed"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getDatabase,
  ref,
  push,
  set,
  onValue
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0x",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:3797a2fc935c63a0464b89"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let user = null;

//
// 🔐 REGISTER
//
document.getElementById("regBtn").onclick = async () => {
  try {
    await createUserWithEmailAndPassword(
      auth,
      document.getElementById("email").value,
      document.getElementById("pass").value
    );
  } catch (e) {
    document.getElementById("status").innerText = e.message;
  }
};

//
// 🔑 LOGIN
//
document.getElementById("loginBtn").onclick = async () => {
  try {
    await signInWithEmailAndPassword(
      auth,
      document.getElementById("email").value,
      document.getElementById("pass").value
    );
  } catch (e) {
    document.getElementById("status").innerText = e.message;
  }
};

//
// 👤 AUTH STATE
//
onAuthStateChanged(auth, (u) => {
  user = u;

  if (user) {
    document.getElementById("authBox").style.display = "none";
    document.getElementById("app").style.display = "block";

    loadFeed();
  } else {
    document.getElementById("authBox").style.display = "block";
    document.getElementById("app").style.display = "none";
  }
});

//
// 📤 POST
//
document.getElementById("postBtn").onclick = () => {
  const img = document.getElementById("img").value;
  const text = document.getElementById("text").value;

  const postRef = push(ref(db, "posts"));

  set(postRef, {
    img,
    text,
    user: user.email,
    time: Date.now()
  });
};

//
// 🌍 FEED
//
function loadFeed() {
  onValue(ref(db, "posts"), (snap) => {
    const data = snap.val();
    const feed = document.getElementById("feed");

    feed.innerHTML = "";

    for (let id in data || {}) {
      const p = data[id];

      const div = document.createElement("div");
      div.className = "post";

      div.innerHTML = `
        <img src="${p.img}">
        <div class="postContent">
          <b>${p.user}</b><br>
          ${p.text}
        </div>
      `;

      feed.appendChild(div);
    }
  });
}

</script>

</body>
</html>
