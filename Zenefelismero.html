<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>⏳ Időkapszula 3D FIX</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
  background: radial-gradient(circle at top, #0f0f1a, #050510);
  color: white;
}

h1 {
  position: absolute;
  top: 10px;
  width: 100%;
  text-align: center;
  z-index: 10;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
}
</style>
</head>

<body>

<h1>⏳ Időkapszula 3D (FIX VERZIÓ)</h1>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";

// ---------------- SCENE ----------------
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.z = 55;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ---------------- LIGHT ----------------
const light = new THREE.PointLight(0xffffff, 2);
light.position.set(10, 10, 10);
scene.add(light);

// ---------------- BLACK HOLE ----------------
const blackHole = new THREE.Mesh(
  new THREE.SphereGeometry(4, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
scene.add(blackHole);

// glow ring
const ring = new THREE.Mesh(
  new THREE.RingGeometry(6, 9, 64),
  new THREE.MeshBasicMaterial({
    color: 0x6c5ce7,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.5
  })
);
ring.rotation.x = Math.PI / 2;
scene.add(ring);

// ---------------- CUBES ----------------
let cubes = [];

function createCube(text) {
  const cube = new THREE.Mesh(
    new THREE.BoxGeometry(3, 3, 3),
    new THREE.MeshStandardMaterial({
      color: 0x6c5ce7,
      emissive: 0x1a0f3a
    })
  );

  cube.position.x = (Math.random() - 0.5) * 60;
  cube.position.y = (Math.random() - 0.5) * 40;
  cube.position.z = (Math.random() - 0.5) * 60;

  cube.userData.text = text;

  scene.add(cube);
  cubes.push(cube);
}

// ---------------- DEBUG (EZ FONTOS!) ----------------
createCube("🚀 RENDSZER FUT");
createCube("🧠 3D OK");
createCube("🕳 BLACK HOLE AKTÍV");

// ---------------- ANIMATION ----------------
function animate() {
  requestAnimationFrame(animate);

  const center = new THREE.Vector3(0, 0, 0);

  cubes.forEach((c) => {

    c.rotation.x += 0.01;
    c.rotation.y += 0.01;

    const dir = center.clone().sub(c.position);
    const dist = dir.length();

    dir.normalize();

    const force = 0.02 / Math.max(dist * 0.6, 0.2);

    c.position.add(dir.multiplyScalar(force));

    // ha beleér a fekete lyukba → eltűnik
    if (dist < 4) {
      scene.remove(c);
      cubes = cubes.filter(x => x !== c);
    }
  });

  ring.rotation.z += 0.008;

  renderer.render(scene, camera);
}

animate();

// ---------------- RESIZE FIX ----------------
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
