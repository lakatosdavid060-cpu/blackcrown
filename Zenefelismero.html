<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>⏳ Időkapszula 3D + Fekete Lyuk</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle at top, #0f0f1a, #050510);
  color: white;
  text-align: center;
  overflow: hidden;
}

h1 {
  margin-top: 20px;
  text-shadow: 0 0 10px rgba(108,92,231,0.6);
  position: relative;
  z-index: 10;
}

.glass {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(15px);
  border-radius: 16px;
  padding: 15px;
  margin: 10px auto;
  width: 90%;
  max-width: 520px;
  box-shadow: 0 0 25px rgba(0,0,0,0.6);
  border: 1px solid rgba(255,255,255,0.1);
  position: relative;
  z-index: 10;
}

input {
  padding: 10px;
  margin: 5px;
  border-radius: 10px;
  border: none;
  width: 80%;
}

button {
  padding: 10px 15px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  background: linear-gradient(135deg, #6c5ce7, #a29bfe);
  color: white;
  font-weight: bold;
  transition: 0.2s;
}

button:hover {
  transform: scale(1.05);
}

.msg {
  padding: 12px;
  margin: 10px auto;
  width: 85%;
  background: rgba(255,255,255,0.08);
  border-radius: 12px;
  animation: pop 0.4s ease;
  text-align: left;
}

.small {
  font-size: 12px;
  opacity: 0.7;
}

@keyframes pop {
  from { transform: scale(0.6); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* 3D canvas */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}
</style>
</head>

<body>

<h1>⏳ Időkapszula 3D + Fekete Lyuk</h1>

<div class="glass">
  <input id="msg" placeholder="Üzenet..." /><br>
  <input id="date" type="datetime-local" /><br>
  <input id="pass" placeholder="Jelszó (opcionális)" /><br>
  <button onclick="send()">🚀 Elmentés</button>
</div>

<h2 style="position:relative;z-index:10;">🌍 Világ fal + 3D univerzum</h2>
<div id="list" style="position:relative;z-index:10;"></div>

<!-- THREE + FIREBASE -->
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase, ref, push, set, onValue
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// ---------------- FIREBASE ----------------
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:3797a2fc935c63a0464b89"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ---------------- 3D SCENE ----------------
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  innerWidth / innerHeight,
  0.1,
  1000
);

camera.position.z = 45;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// fény
const light = new THREE.PointLight(0xffffff, 2);
light.position.set(20, 20, 20);
scene.add(light);

// ---------------- CSILLAGOK ----------------
function stars() {
  const geo = new THREE.BufferGeometry();
  const arr = [];

  for (let i = 0; i < 1200; i++) {
    arr.push((Math.random() - 0.5) * 250);
    arr.push((Math.random() - 0.5) * 250);
    arr.push((Math.random() - 0.5) * 250);
  }

  geo.setAttribute("position", new THREE.Float32BufferAttribute(arr, 3));

  const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.6 });

  const points = new THREE.Points(geo, mat);
  scene.add(points);
}
stars();

// ---------------- FEKETE LYUK 🕳 ----------------
const holeGeo = new THREE.SphereGeometry(4, 32, 32);
const holeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
const blackHole = new THREE.Mesh(holeGeo, holeMat);
scene.add(blackHole);

// gyűrű glow
const ringGeo = new THREE.RingGeometry(6, 9, 64);
const ringMat = new THREE.MeshBasicMaterial({
  color: 0x6c5ce7,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.5
});
const ring = new THREE.Mesh(ringGeo, ringMat);
ring.rotation.x = Math.PI / 2;
scene.add(ring);

// ---------------- KOCKÁK ----------------
let cubes = [];

function createCube(text) {
  const geo = new THREE.BoxGeometry(3, 3, 3);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x6c5ce7,
    emissive: 0x120a2a
  });

  const cube = new THREE.Mesh(geo, mat);

  cube.position.x = (Math.random() - 0.5) * 70;
  cube.position.y = (Math.random() - 0.5) * 40;
  cube.position.z = (Math.random() - 0.5) * 70;

  cube.userData.text = text;

  scene.add(cube);
  cubes.push(cube);
}

// ---------------- FIREBASE SEND ----------------
window.send = function () {
  const msg = document.getElementById("msg").value;
  const date = document.getElementById("date").value;
  const pass = document.getElementById("pass").value;

  const newRef = push(ref(db, "capsules"));

  set(newRef, {
    text: msg,
    unlockTime: new Date(date).getTime(),
    password: pass || null
  });

  alert("🚀 Elmentve az időbe!");
};

// ---------------- LOAD ----------------
const list = document.getElementById("list");

function load() {
  const dbRef = ref(db, "capsules");

  onValue(dbRef, (snap) => {
    const data = snap.val();

    list.innerHTML = "";

    cubes.forEach(c => scene.remove(c));
    cubes = [];

    if (!data) return;

    const now = Date.now();

    for (let id in data) {
      const item = data[id];

      if (item.unlockTime <= now) {

        const div = document.createElement("div");
        div.className = "msg";
        div.innerHTML = "📩 " + item.text;
        list.appendChild(div);

        createCube(item.text);
      }
    }
  });
}

load();

// ---------------- CLICK ----------------
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("click", (e) => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObjects(cubes);

  if (hits.length > 0) {
    alert("📩 Üzenet:\n\n" + hits[0].object.userData.text);
  }
});

// ---------------- ANIMATION (BLACK HOLE PHYSICS) ----------------
function animate() {
  requestAnimationFrame(animate);

  const center = new THREE.Vector3(0, 0, 0);

  cubes.forEach((c, i) => {

    c.rotation.x += 0.01;
    c.rotation.y += 0.01;

    const dir = center.clone().sub(c.position);
    const dist = dir.length();

    dir.normalize();

    const force = 0.03 / Math.max(dist * 0.4, 0.2);

    c.position.add(dir.multiplyScalar(force));

    c.position.x += Math.sin(Date.now() * 0.001 + i) * 0.01;
    c.position.z += Math.cos(Date.now() * 0.001 + i) * 0.01;

    if (dist < 4.5) {
      scene.remove(c);
      cubes = cubes.filter(x => x !== c);
    }
  });

  ring.rotation.z += 0.01;

  renderer.render(scene, camera);
}

animate();

// resize
window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
