<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>IG MINI FIX</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0b14;
  color: white;
}

header {
  padding: 12px;
  background: #111;
  text-align: center;
  border-bottom: 1px solid #333;
}

.box {
  max-width: 500px;
  margin: 10px auto;
  padding: 12px;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  border: none;
}

button {
  background: #ff2d55;
  color: white;
  cursor: pointer;
}

.post {
  max-width: 500px;
  margin: 10px auto;
  background: #1a1a2a;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #333;
}

.post img {
  width: 100%;
}

.postContent {
  padding: 10px;
}
</style>
</head>

<body>

<header>🔥 IG MINI (WORKING)</header>

<div class="box">
  <h3>Login / Register</h3>
  <input id="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Password">

  <button id="regBtn">Register</button>
  <button id="loginBtn">Login</button>
  <button id="logoutBtn">Logout</button>

  <div id="status"></div>
</div>

<div class="box" id="postBox" style="display:none;">
  <input id="img" placeholder="Image URL">
  <input id="text" placeholder="Caption">
  <button id="postBtn">Post</button>
</div>

<div id="feed"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getDatabase,
  ref,
  push,
  set,
  onValue
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:3797a2fc935c63a0464b89"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let user = null;

//
// 🔐 AUTH
//
document.getElementById("regBtn").onclick = async () => {
  try {
    await createUserWithEmailAndPassword(
      auth,
      email.value,
      pass.value
    );
  } catch (e) {
    alert(e.message);
  }
};

document.getElementById("loginBtn").onclick = async () => {
  try {
    await signInWithEmailAndPassword(
      auth,
      email.value,
      pass.value
    );
  } catch (e) {
    alert(e.message);
  }
};

document.getElementById("logoutBtn").onclick = async () => {
  await signOut(auth);
};

//
// 👤 STATE
//
onAuthStateChanged(auth, (u) => {
  user = u;

  if (user) {
    status.innerText = "Bejelentkezve: " + user.email;
    postBox.style.display = "block";
    loadFeed();
  } else {
    status.innerText = "Nincs bejelentkezve";
    postBox.style.display = "none";
  }
});

//
// 📤 POST
//
document.getElementById("postBtn").onclick = () => {
  const postRef = push(ref(db, "posts"));

  set(postRef, {
    img: img.value,
    text: text.value,
    user: user.email,
    time: Date.now()
  });
};

//
// 🌍 FEED
//
function loadFeed() {
  onValue(ref(db, "posts"), (snap) => {
    const data = snap.val();
    feed.innerHTML = "";

    for (let id in data || {}) {
      const p = data[id];

      const div = document.createElement("div");
      div.className = "post";

      div.innerHTML = `
        <img src="${p.img}">
        <div class="postContent">
          <b>${p.user}</b><br>
          ${p.text}
        </div>
      `;

      feed.appendChild(div);
    }
  });
}

</script>

</body>
</html>
