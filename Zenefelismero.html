<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>🌌 Cyberpunk OS 4.0</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
  background: black;
  color: white;
}

#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 260px;
  z-index: 10;
  padding: 10px;
  background: rgba(0,0,0,0.6);
  border: 1px solid rgba(0,255,255,0.3);
  backdrop-filter: blur(10px);
  border-radius: 10px;
}

input, button {
  width: 100%;
  margin: 5px 0;
  padding: 8px;
  border-radius: 6px;
  border: none;
}

button {
  background: linear-gradient(90deg, #6c5ce7, #00f5ff);
  color: white;
  cursor: pointer;
}

#inventory {
  position: absolute;
  right: 10px;
  top: 10px;
  width: 200px;
  padding: 10px;
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(255,0,255,0.3);
  border-radius: 10px;
  z-index: 10;
}

canvas { display:block; }
</style>
</head>

<body>

<div id="ui">
  <input id="msg" placeholder="Üzenet..." />
  <input id="date" type="datetime-local" />
  <button onclick="send()">Küldés 🚀</button>
  <button onclick="teleport()">Teleport ✨</button>
</div>

<div id="inventory">
  <b>🎒 Inventory</b>
  <div id="invList"></div>
</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";

// ---------------- AUDIO ----------------
const audio = new (window.AudioContext || window.webkitAudioContext)();

function beep(freq=440){
  const osc = audio.createOscillator();
  const gain = audio.createGain();

  osc.frequency.value = freq;
  osc.type = "sine";

  gain.gain.value = 0.05;

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();
  osc.stop(audio.currentTime + 0.1);
}

// ---------------- SCENE ----------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000008);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 10, 40);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// light
scene.add(new THREE.AmbientLight(0xffffff,1));

// ---------------- BLACK HOLE ----------------
const core = new THREE.Mesh(
  new THREE.SphereGeometry(5,32,32),
  new THREE.MeshBasicMaterial({ color:0x000000 })
);
scene.add(core);

// ---------------- PORTAL ----------------
const portal = new THREE.Mesh(
  new THREE.TorusGeometry(6,1.2,16,100),
  new THREE.MeshStandardMaterial({ color:0x00f5ff })
);
portal.position.set(20,0,-20);
scene.add(portal);

// ---------------- OBJECTS ----------------
let nodes = [];
let inventory = [];

function createNode(text){
  const m = new THREE.Mesh(
    new THREE.IcosahedronGeometry(2.5,0),
    new THREE.MeshStandardMaterial({ color:0x6c5ce7 })
  );

  m.position.set(
    (Math.random()-0.5)*60,
    (Math.random()-0.5)*30,
    (Math.random()-0.5)*60
  );

  m.userData.text = text;

  scene.add(m);
  nodes.push(m);
}

function addToInventory(text){
  inventory.push(text);
  document.getElementById("invList").innerHTML =
    inventory.map(i => "📦 " + i).join("<br>");
}

// ---------------- TELEPORT ----------------
window.teleport = function(){
  camera.position.set(
    (Math.random()-0.5)*50,
    10,
    (Math.random()-0.5)*50
  );
  beep(880);
};

// ---------------- SEND ----------------
window.send = function(){
  const msg = document.getElementById("msg").value;
  createNode(msg);
  beep(440);
};

// ---------------- CLICK PICKUP ----------------
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener("click",(e)=>{
  mouse.x = (e.clientX/innerWidth)*2-1;
  mouse.y = -(e.clientY/innerHeight)*2+1;

  ray.setFromCamera(mouse,camera);

  const hit = ray.intersectObjects(nodes);

  if(hit.length){
    const obj = hit[0].object;
    addToInventory(obj.userData.text);
    scene.remove(obj);
    nodes = nodes.filter(n=>n!==obj);
    beep(660);
  }
});

// ---------------- BLACK HOLE PHYSICS ----------------
const center = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);

  nodes.forEach(n=>{
    const dir = center.clone().sub(n.position);
    const dist = dir.length();

    dir.normalize();

    n.position.add(dir.multiplyScalar(0.02));

    if(dist<4){
      scene.remove(n);
      nodes = nodes.filter(x=>x!==n);
    }
  });

  portal.rotation.y += 0.01;

  renderer.render(scene,camera);
}

animate();

// resize
window.addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
