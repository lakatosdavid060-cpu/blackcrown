<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>🔥 IG CLONE V2 EMAIL</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0b14;
  color: white;
}

header {
  padding: 15px;
  text-align: center;
  background: #111;
  border-bottom: 1px solid #333;
}

.box {
  max-width: 500px;
  margin: 10px auto;
  padding: 12px;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  border: none;
}

button {
  cursor: pointer;
  background: #ff2d55;
  color: white;
}

.post {
  max-width: 500px;
  margin: 15px auto;
  background: #1a1a2a;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #333;
}

.post img {
  width: 100%;
}

.postContent {
  padding: 10px;
}

.likeBtn {
  background: #222;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>🔥 IG CLONE V2 (EMAIL AUTH)</header>

<!-- AUTH -->
<div class="box" id="authBox">
  <h3>🔐 Regisztráció / Login</h3>

  <input id="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Jelszó" />

  <button onclick="register()">🆕 Regisztráció</button>
  <button onclick="login()">🔑 Belépés</button>
</div>

<!-- APP -->
<div class="box" id="appBox" style="display:none;">
  <h3>✔ Bejelentkezve</h3>
  <button onclick="logout()">🚪 Kilépés</button>
</div>

<!-- POST -->
<div class="box" id="postBox" style="display:none;">
  <input id="img" placeholder="Kép URL (https://...)" />
  <input id="text" placeholder="Szöveg..." />
  <button onclick="upload()">📤 Poszt</button>
</div>

<!-- FEED -->
<div id="feed"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getDatabase,
  ref,
  push,
  set,
  onValue,
  update
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  databaseURL: "YOUR_DB_URL",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_STORAGE",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let user = null;

//
// 🔐 REG
//
window.register = async function () {
  const email = emailInput();
  const pass = passInput();

  try {
    await createUserWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    alert("Reg hiba: " + e.message);
  }
};

//
// 🔑 LOGIN
//
window.login = async function () {
  const email = emailInput();
  const pass = passInput();

  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch (e) {
    alert("Login hiba: " + e.message);
  }
};

//
// 🚪 LOGOUT
//
window.logout = function () {
  signOut(auth);
};

//
// 👤 AUTH STATE
//
onAuthStateChanged(auth, (u) => {
  user = u;

  if (u) {
    document.getElementById("authBox").style.display = "none";
    document.getElementById("appBox").style.display = "block";
    document.getElementById("postBox").style.display = "block";
  } else {
    document.getElementById("authBox").style.display = "block";
    document.getElementById("appBox").style.display = "none";
    document.getElementById("postBox").style.display = "none";
  }
});

//
// 📤 POST
//
window.upload = function () {
  const img = document.getElementById("img").value;
  const text = document.getElementById("text").value;

  if (!img || !text) return;

  const newRef = push(ref(db, "posts"));

  set(newRef, {
    img,
    text,
    user: user.email,
    likes: 0,
    time: Date.now()
  });
};

//
// ❤️ LIKE
//
window.like = function (id, likes) {
  update(ref(db, "posts/" + id), {
    likes: likes + 1
  });
};

//
// 🌍 FEED
//
onValue(ref(db, "posts"), (snap) => {
  const data = snap.val();
  const feed = document.getElementById("feed");

  feed.innerHTML = "";

  const posts = Object.entries(data || {}).reverse();

  for (let [id, p] of posts) {
    const div = document.createElement("div");
    div.className = "post";

    div.innerHTML = `
      <img src="${p.img}" />
      <div class="postContent">
        <b>👤 ${p.user}</b><br>
        ${p.text}
        <button class="likeBtn" onclick="like('${id}', ${p.likes})">
          ❤️ Like (${p.likes})
        </button>
      </div>
    `;

    feed.appendChild(div);
  }
});

//
// helpers
//
function emailInput() {
  return document.getElementById("email").value;
}

function passInput() {
  return document.getElementById("password").value;
}

</script>

</body>
</html>
