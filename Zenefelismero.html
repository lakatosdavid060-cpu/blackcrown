<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Firebase Live Lokátor</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100vw;
      height: 100vh;
    }

    .topbar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 9999;
      background: white;
      padding: 10px;
      border-radius: 10px;
      display: flex;
      gap: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    input {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="topbar">
  <input id="username" placeholder="Neved">
  <button onclick="startTracking()">Start</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


// FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:70086de26402ceb3464b89"
};


// FIREBASE INIT
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


// MAP
const map = L.map('map').setView([47.4979, 19.0402], 13);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution: '&copy; OpenStreetMap contributors'
  }
).addTo(map);


// MARKERS
const markers = {};

function createOrUpdateMarker(id, lat, lng, username) {

  if (markers[id]) {
    markers[id].setLatLng([lat, lng]);
    return;
  }

  markers[id] = L.marker([lat, lng])
    .addTo(map)
    .bindPopup(username);

}


// START TRACKING
window.startTracking = function () {

  const username =
    document.getElementById("username").value || "anonymous";

  const userId = crypto.randomUUID();

  navigator.geolocation.watchPosition(

    async (position) => {

      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      // SAVE TO FIREBASE
      await set(ref(db, "locations/" + userId), {
        username,
        lat,
        lng,
        updatedAt: Date.now()
      });

      // CENTER MAP
      map.setView([lat, lng], 15);

    },

    (error) => {
      alert("GPS hiba: " + error.message);
    },

    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 5000
    }

  );

};


// REALTIME LISTENER
onValue(ref(db, "locations"), (snapshot) => {

  const data = snapshot.val();

  if (!data) return;

  Object.keys(data).forEach((id) => {

    const user = data[id];

    createOrUpdateMarker(
      id,
      user.lat,
      user.lng,
      user.username
    );

  });

});

</script>

</body>
</html>
