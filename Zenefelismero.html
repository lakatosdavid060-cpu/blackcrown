<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>🔥 IG CLONE V2</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0b14;
  color: white;
}

header {
  padding: 15px;
  text-align: center;
  background: #111;
  border-bottom: 1px solid #333;
}

#auth, #uploadBox, #profile {
  max-width: 500px;
  margin: 10px auto;
  padding: 12px;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  border: none;
}

button {
  cursor: pointer;
  background: #ff2d55;
  color: white;
}

.post {
  max-width: 500px;
  margin: 15px auto;
  background: #1a1a2a;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #333;
}

.post img {
  width: 100%;
}

.postContent {
  padding: 10px;
}

.small {
  font-size: 12px;
  opacity: 0.7;
}

.likeBtn, .followBtn {
  background: #222;
  margin-top: 8px;
}

.comment {
  font-size: 13px;
  margin-top: 5px;
  opacity: 0.9;
}
</style>
</head>

<body>

<header>🔥 IG CLONE V2</header>

<div id="auth">
  <button onclick="login()">🔐 Google Login</button>
</div>

<div id="profile" style="display:none;">
  <div id="userInfo"></div>
  <button onclick="toggleFollowMode()">👥 Follow mód</button>
</div>

<div id="uploadBox" style="display:none;">
  <input type="file" id="file" />
  <input id="text" placeholder="Caption..." />
  <button onclick="upload()">📤 Post</button>
</div>

<div id="feed"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getDatabase,
  ref,
  push,
  set,
  onValue,
  update,
  get
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

import {
  getStorage,
  ref as sRef,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVvZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:3797a2fc935c63a0464b89"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const storage = getStorage(app);

let user = null;
let followMode = false;

//
// 🔐 LOGIN
//
window.login = async function () {
  const provider = new GoogleAuthProvider();
  await signInWithPopup(auth, provider);
};

//
// 👤 AUTH
//
onAuthStateChanged(auth, (u) => {
  if (!u) return;

  user = u;

  document.getElementById("auth").style.display = "none";
  document.getElementById("uploadBox").style.display = "block";
  document.getElementById("profile").style.display = "block";

  document.getElementById("userInfo").innerHTML =
    "👤 " + u.displayName;

  loadFeed();
});

//
// 📤 POST
//
window.upload = async function () {
  const file = document.getElementById("file").files[0];
  const text = document.getElementById("text").value;

  if (!file || !text) return;

  const storageRef = sRef(storage, "posts/" + Date.now());
  await uploadBytes(storageRef, file);

  const url = await getDownloadURL(storageRef);

  const newRef = push(ref(db, "posts"));

  set(newRef, {
    img: url,
    text,
    user: user.uid,
    name: user.displayName,
    likes: 0,
    time: Date.now()
  });

  document.getElementById("text").value = "";
};

//
// ❤️ LIKE
//
window.like = function (id, likes) {
  update(ref(db, "posts/" + id), {
    likes: likes + 1
  });
};

//
// 👥 FOLLOW SYSTEM (simple)
//
window.toggleFollowMode = function () {
  followMode = !followMode;
  loadFeed();
};

window.follow = function (uid) {
  set(ref(db, "follows/" + user.uid + "/" + uid), true);
};

async function isFollowing(uid) {
  const snap = await get(ref(db, "follows/" + user.uid + "/" + uid));
  return snap.exists();
}

//
// 🌍 FEED
//
function loadFeed() {
  onValue(ref(db, "posts"), async (snap) => {
    const data = snap.val();
    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    if (!data) return;

    const posts = Object.entries(data).reverse();

    for (let [id, p] of posts) {

      if (followMode && p.user !== user.uid) continue;

      const following = await isFollowing(p.user);

      const div = document.createElement("div");
      div.className = "post";

      div.innerHTML = `
        <img src="${p.img}" />
        <div class="postContent">
          <b>👤 ${p.name}</b><br>
          ${p.text}<br>

          <button class="likeBtn" onclick="like('${id}', ${p.likes})">
            ❤️ Like (${p.likes})
          </button>

          <button class="followBtn" onclick="follow('${p.user}')">
            ${following ? "✅ Following" : "➕ Follow"}
          </button>

          <div class="small">UID: ${p.user}</div>
        </div>
      `;

      feed.appendChild(div);
    }
  });
}
</script>

</body>
</html>
