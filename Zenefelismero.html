<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>🔥 IG CLONE V3</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0a12;
  color: white;
}

header {
  padding: 15px;
  text-align: center;
  background: #111;
  border-bottom: 1px solid #333;
}

.box {
  max-width: 520px;
  margin: 10px auto;
  padding: 12px;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  border: none;
}

button {
  cursor: pointer;
  background: #ff2d55;
  color: white;
}

.post {
  max-width: 520px;
  margin: 15px auto;
  background: #1a1a2a;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #333;
}

.post img {
  width: 100%;
}

.postContent {
  padding: 10px;
}

.small {
  font-size: 12px;
  opacity: 0.7;
}

.commentBox {
  margin-top: 8px;
  font-size: 13px;
  opacity: 0.9;
}
</style>
</head>

<body>

<header>🔥 IG CLONE V3</header>

<!-- AUTH -->
<div class="box" id="authBox">
  <h3>🔐 Login / Register</h3>
  <input id="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Jelszó">
  <button onclick="register()">🆕 Regisztráció</button>
  <button onclick="login()">🔑 Belépés</button>
</div>

<!-- PROFILE -->
<div class="box" id="profileBox" style="display:none;">
  <h3>👤 Profil</h3>
  <input id="username" placeholder="Username">
  <input id="bio" placeholder="Bio">
  <button onclick="saveProfile()">💾 Mentés</button>
</div>

<!-- POST -->
<div class="box" id="postBox" style="display:none;">
  <input id="img" placeholder="Kép URL">
  <input id="text" placeholder="Caption">
  <button onclick="upload()">📤 Poszt</button>
</div>

<!-- FEED -->
<div id="feed"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getDatabase,
  ref,
  push,
  set,
  onValue,
  update,
  get
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:3797a2fc935c63a0464b89",
  measurementId: "G-V9Z9LYT0KL"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let user = null;
let profile = {};

//
// 🔐 AUTH
//
window.register = async function () {
  const email = emailVal();
  const pass = passVal();
  await createUserWithEmailAndPassword(auth, email, pass);
};

window.login = async function () {
  const email = emailVal();
  const pass = passVal();
  await signInWithEmailAndPassword(auth, email, pass);
};

//
// 👤 AUTH STATE
//
onAuthStateChanged(auth, async (u) => {
  user = u;

  if (!u) return;

  document.getElementById("authBox").style.display = "none";
  document.getElementById("profileBox").style.display = "block";
  document.getElementById("postBox").style.display = "block";

  loadProfile();
  loadFeed();
});

//
// 👤 PROFILE SAVE
//
window.saveProfile = function () {
  const username = document.getElementById("username").value;
  const bio = document.getElementById("bio").value;

  set(ref(db, "profiles/" + user.uid), {
    username,
    bio
  });

  alert("Profil mentve!");
};

//
// 📥 LOAD PROFILE
//
async function loadProfile() {
  const snap = await get(ref(db, "profiles/" + user.uid));
  profile = snap.val() || {};
}

//
// 📤 POST
//
window.upload = function () {
  const img = document.getElementById("img").value;
  const text = document.getElementById("text").value;

  const newRef = push(ref(db, "posts"));

  set(newRef, {
    img,
    text,
    uid: user.uid,
    likes: 0,
    time: Date.now()
  });
};

//
// ❤️ LIKE
//
window.like = function (id, likes) {
  update(ref(db, "posts/" + id), {
    likes: likes + 1
  });
};

//
// 💬 COMMENT
//
window.comment = function (id) {
  const text = prompt("Komment:");
  if (!text) return;

  const cRef = push(ref(db, "comments/" + id));

  set(cRef, {
    text,
    uid: user.uid,
    time: Date.now()
  });
};

//
// 🌍 FEED
//
function loadFeed() {
  onValue(ref(db, "posts"), (snap) => {
    const data = snap.val();
    const feed = document.getElementById("feed");

    feed.innerHTML = "";

    const posts = Object.entries(data || {}).reverse();

    for (let [id, p] of posts) {
      const div = document.createElement("div");

      div.className = "post";

      div.innerHTML = `
        <img src="${p.img}">
        <div class="postContent">
          <b>👤 ${p.uid}</b><br>
          ${p.text}<br>

          <button onclick="like('${id}', ${p.likes})">
            ❤️ Like (${p.likes})
          </button>

          <button onclick="comment('${id}')">
            💬 Comment
          </button>

          <div class="commentBox" id="c_${id}"></div>
        </div>
      `;

      feed.appendChild(div);

      loadComments(id);
    }
  });
}

//
// 💬 COMMENTS LOAD
//
function loadComments(postId) {
  onValue(ref(db, "comments/" + postId), (snap) => {
    const box = document.getElementById("c_" + postId);
    if (!box) return;

    box.innerHTML = "";

    const data = snap.val();
    for (let id in data || {}) {
      const c = data[id];
      const div = document.createElement("div");
      div.innerText = "💬 " + c.text;
      box.appendChild(div);
    }
  });
}

//
// helpers
//
function emailVal() {
  return document.getElementById("email").value;
}
function passVal() {
  return document.getElementById("pass").value;
}

</script>

</body>
</html>
