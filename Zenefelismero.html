<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Shazam</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    color:white;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
}

.container{
    width:95%;
    max-width:420px;
    background:#111;
    padding:25px;
    border-radius:30px;
    box-shadow:0 0 40px #00ff9d55;
    position:relative;
}

.title{
    text-align:center;
    font-size:32px;
    color:#1db954;
    margin-bottom:20px;
}

.cover{
    width:220px;
    height:220px;
    border-radius:25px;
    margin:auto;
    background:url('https://i.scdn.co/image/ab67616d0000b273e0b60c608586d88252b8fbc4') center/cover;
    animation:spin 8s linear infinite;
    box-shadow:0 0 30px #1db95466;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

.song{
    text-align:center;
    margin-top:20px;
}

.song h2{
    font-size:26px;
}

.song p{
    color:#aaa;
}

canvas{
    width:100%;
    height:120px;
    margin-top:25px;
    border-radius:15px;
    background:#000;
}

button{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:none;
    border-radius:15px;
    background:#1db954;
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

select{
    width:100%;
    margin-top:15px;
    padding:12px;
    border-radius:12px;
    background:#222;
    color:white;
    border:none;
}

.links a{
    display:block;
    text-align:center;
    margin-top:12px;
    color:#1db954;
    text-decoration:none;
}

.wave{
    position:absolute;
    width:500px;
    height:500px;
    background:radial-gradient(#1db95433, transparent);
    border-radius:50%;
    animation:pulse 2s infinite;
    z-index:-1;
}

@keyframes pulse{
    0%{
        transform:scale(0.8);
        opacity:0.5;
    }
    100%{
        transform:scale(1.4);
        opacity:0;
    }
}

</style>
</head>

<body>

<div class="wave"></div>

<div class="container">

    <div class="title">
        🎵 Neon Shazam
    </div>

    <div class="cover" id="cover"></div>

    <div class="song">
        <h2 id="title">No song</h2>
        <p id="artist">Unknown artist</p>
    </div>

    <canvas id="visualizer"></canvas>

    <button onclick="startRecognition()">
        🎤 Start Recognition
    </button>

    <button onclick="openYouTube()">
        ▶️ Open YouTube
    </button>

    <select onchange="changeLanguage(this.value)">
        <option value="hu">🇭🇺 Magyar</option>
        <option value="en">🇬🇧 English</option>
    </select>

</div>

<script>

let currentSong = "Faded";
let currentArtist = "Alan Walker";

function openYouTube(){

    const query = currentArtist + " " + currentSong;

    window.open(
        `https://www.youtube.com/results?search_query=${query}`,
        "_blank"
    );

}

async function startRecognition(){

    try{

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio:true
            });

        alert("🎤 Listening...");

        // AUDIO VISUALIZER

        const audioContext = new AudioContext();

        const analyser =
            audioContext.createAnalyser();

        const microphone =
            audioContext.createMediaStreamSource(stream);

        microphone.connect(analyser);

        analyser.fftSize = 256;

        const canvas =
            document.getElementById("visualizer");

        const ctx = canvas.getContext("2d");

        const bufferLength =
            analyser.frequencyBinCount;

        const dataArray =
            new Uint8Array(bufferLength);

        function animate(){

            requestAnimationFrame(animate);

            analyser.getByteFrequencyData(dataArray);

            ctx.clearRect(0,0,canvas.width,canvas.height);

            let barWidth =
                (canvas.width / bufferLength) * 2.5;

            let x = 0;

            for(let i=0;i<bufferLength;i++){

                let barHeight = dataArray[i];

                ctx.fillStyle =
                    `rgb(${barHeight+100},255,180)`;

                ctx.fillRect(
                    x,
                    canvas.height-barHeight/2,
                    barWidth,
                    barHeight
                );

                x += barWidth + 1;
            }

        }

        animate();

        // DEMO SHAZAM RESULT

        setTimeout(()=>{

            currentSong = "Faded";
            currentArtist = "Alan Walker";

            document.getElementById("title")
                .innerText = currentSong;

            document.getElementById("artist")
                .innerText = currentArtist;

            document.getElementById("cover")
                .style.backgroundImage =
                "url('https://i.scdn.co/image/ab67616d0000b273e0b60c608586d88252b8fbc4')";

        },3000);

    }catch(err){

        alert("Microphone error!");

    }

}

function changeLanguage(lang){

    if(lang === "hu"){

        document.querySelector("button")
            .innerText = "🎤 Felismerés indítása";

    }else{

        document.querySelector("button")
            .innerText = "🎤 Start Recognition";

    }

}

</script>

</body>
</html>
