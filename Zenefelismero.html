<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>🔥 IG CLONE V5</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #070711;
  color: white;
}

header {
  padding: 15px;
  text-align: center;
  background: #111;
  border-bottom: 1px solid #333;
}

.box {
  max-width: 520px;
  margin: 10px auto;
  padding: 12px;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  border: none;
}

button {
  background: #ff2d55;
  color: white;
  cursor: pointer;
}

.switch {
  display: flex;
  max-width: 520px;
  margin: 10px auto;
  gap: 10px;
}

.switch button {
  flex: 1;
  background: #222;
}

.post {
  max-width: 520px;
  margin: 15px auto;
  background: #1a1a2a;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #333;
}

.post img {
  width: 100%;
}

.postContent {
  padding: 10px;
}

.comment {
  font-size: 13px;
  opacity: 0.9;
  margin-top: 5px;
}

.storyBar {
  display: flex;
  overflow-x: auto;
  max-width: 520px;
  margin: 10px auto;
  gap: 8px;
}

.story {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(45deg, #ff2d55, #6c5ce7);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
}
</style>
</head>

<body>

<header>🔥 IG CLONE V5</header>

<div class="box" id="authBox">
  <input id="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Jelszó">
  <button onclick="register()">Reg</button>
  <button onclick="login()">Login</button>
</div>

<div class="box" id="postBox" style="display:none;">
  <input id="img" placeholder="Image URL">
  <input id="text" placeholder="Caption">
  <button onclick="uploadPost()">Post</button>

  <input id="storyImg" placeholder="Story URL">
  <button onclick="uploadStory()">Story</button>
</div>

<div class="switch" id="switchBox" style="display:none;">
  <button onclick="setFeed('following')">👥 Following</button>
  <button onclick="setFeed('foryou')">🔥 For You</button>
</div>

<div class="storyBar" id="storyBar"></div>

<div id="feed"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getDatabase,
  ref,
  push,
  set,
  onValue,
  get
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:3797a2fc935c63a0464b89"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let user = null;
let feedMode = "foryou";

//
// 🔐 AUTH
//
window.register = () =>
  createUserWithEmailAndPassword(auth, email.value, pass.value);

window.login = () =>
  signInWithEmailAndPassword(auth, email.value, pass.value);

onAuthStateChanged(auth, (u) => {
  user = u;

  if (!u) return;

  authBox.style.display = "none";
  postBox.style.display = "block";
  switchBox.style.display = "flex";

  loadStories();
  loadFeed();
});

//
// 👥 FOLLOW
//
window.follow = (uid) => {
  set(ref(db, "follows/" + user.uid + "/" + uid), true);
};

async function isFollowing(uid) {
  const snap = await get(ref(db, "follows/" + user.uid + "/" + uid));
  return snap.exists();
}

//
// 🔁 FEED MODE
//
window.setFeed = (mode) => {
  feedMode = mode;
  loadFeed();
};

//
// 📸 POST
//
window.uploadPost = () => {
  const postRef = push(ref(db, "posts"));

  set(postRef, {
    img: img.value,
    text: text.value,
    uid: user.uid,
    likes: 0,
    time: Date.now()
  });
};

//
// 💬 COMMENT
//
window.comment = (postId) => {
  const text = prompt("Komment:");

  if (!text) return;

  const cRef = push(ref(db, "comments/" + postId));

  set(cRef, {
    text,
    uid: user.uid,
    time: Date.now()
  });
};

//
// ❤️ LIKE
//
window.like = (id, likes) => {
  set(ref(db, "posts/" + id + "/likes"), likes + 1);
};

//
// 📱 STORIES
//
window.uploadStory = () => {
  push(ref(db, "stories/" + user.uid), {
    img: storyImg.value,
    time: Date.now()
  });
};

function loadStories() {
  onValue(ref(db, "stories"), (snap) => {
    const data = snap.val();
    storyBar.innerHTML = "";

    for (let uid in data || {}) {
      const div = document.createElement("div");
      div.className = "story";
      div.innerText = uid.slice(0, 4);
      storyBar.appendChild(div);
    }
  });
}

//
// 🌍 FEED (FOLLOW + FOR YOU)
//
function loadFeed() {
  onValue(ref(db, "posts"), async (snap) => {
    const data = snap.val();
    feed.innerHTML = "";

    for (let id in data || {}) {
      const p = data[id];

      const following = await isFollowing(p.uid);

      if (feedMode === "following" && p.uid !== user.uid && !following) continue;

      const div = document.createElement("div");
      div.className = "post";

      div.innerHTML = `
        <img src="${p.img}">
        <div class="postContent">
          <b>${p.uid}</b><br>
          ${p.text}<br>

          <button onclick="like('${id}', ${p.likes})">
            ❤️ ${p.likes}
          </button>

          <button onclick="follow('${p.uid}')">➕ Follow</button>
          <button onclick="comment('${id}')">💬 Comment</button>
        </div>
      `;

      feed.appendChild(div);

      loadComments(id);
    }
  });
}

//
// 💬 COMMENTS
//
function loadComments(postId) {
  onValue(ref(db, "comments/" + postId), (snap) => {
    const data = snap.val();
    if (!data) return;

    const el = document.createElement("div");

    for (let id in data) {
      const c = data[id];
      const d = document.createElement("div");
      d.className = "comment";
      d.innerText = "💬 " + c.text;
      el.appendChild(d);
    }

    const post = document.querySelector(`[onclick*="${postId}"]`);
  });
}

</script>

</body>
</html>
