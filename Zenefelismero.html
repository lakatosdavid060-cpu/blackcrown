<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>🌌 Cyberpunk OS 3.0</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
  background: black;
  color: white;
}

#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 10;
  width: 260px;
  padding: 10px;
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(0,255,255,0.3);
  backdrop-filter: blur(10px);
  border-radius: 10px;
}

input, button {
  width: 100%;
  margin: 5px 0;
  padding: 8px;
  border-radius: 6px;
  border: none;
}

button {
  background: linear-gradient(90deg, #6c5ce7, #00f5ff);
  color: white;
  cursor: pointer;
}

canvas {
  display: block;
}
</style>
</head>

<body>

<div id="ui">
  <input id="msg" placeholder="Üzenet..." />
  <input id="date" type="datetime-local" />
  <button onclick="send()">Küldés 🚀</button>
  <p style="font-size:12px;opacity:0.7">
    WASD = mozgás | egér = nézés
  </p>
</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  set,
  onValue
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// ---------------- FIREBASE ----------------
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:3797a2fc935c63a0464b89"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ---------------- SCENE ----------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000008);

const camera = new THREE.PerspectiveCamera(
  75,
  innerWidth / innerHeight,
  0.1,
  1000
);

camera.position.set(0, 10, 40);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ---------------- LIGHT ----------------
scene.add(new THREE.AmbientLight(0xffffff, 1));
const light = new THREE.PointLight(0x00f5ff, 2);
light.position.set(20, 20, 20);
scene.add(light);

// ---------------- BLACK HOLE ----------------
const core = new THREE.Mesh(
  new THREE.SphereGeometry(5, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
scene.add(core);

const ring = new THREE.Mesh(
  new THREE.RingGeometry(7, 12, 64),
  new THREE.MeshBasicMaterial({
    color: 0x00f5ff,
    transparent: true,
    opacity: 0.6,
    side: THREE.DoubleSide
  })
);
ring.rotation.x = Math.PI / 2;
scene.add(ring);

// ---------------- PLAYER (kamera kontroller) ----------------
const keys = {};

document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// egér look
let yaw = 0;
let pitch = 0;

document.body.addEventListener("click", () => {
  document.body.requestPointerLock();
});

document.addEventListener("mousemove", (e) => {
  if (document.pointerLockElement !== document.body) return;

  yaw -= e.movementX * 0.002;
  pitch -= e.movementY * 0.002;
  pitch = Math.max(-1.5, Math.min(1.5, pitch));
});

// ---------------- OBJECTS ----------------
let nodes = [];

function createNode(text) {
  const node = new THREE.Mesh(
    new THREE.IcosahedronGeometry(2.5, 0),
    new THREE.MeshStandardMaterial({
      color: 0x00f5ff,
      emissive: 0x001133
    })
  );

  node.position.set(
    (Math.random() - 0.5) * 80,
    (Math.random() - 0.5) * 40,
    (Math.random() - 0.5) * 80
  );

  node.userData.text = text;

  scene.add(node);
  nodes.push(node);
}

// ---------------- FIREBASE ----------------
function load() {
  const dbRef = ref(db, "capsules");

  onValue(dbRef, (snap) => {
    const data = snap.val();

    nodes.forEach(n => scene.remove(n));
    nodes = [];

    if (!data) return;

    const now = Date.now();

    for (let id in data) {
      const item = data[id];

      if (item && item.unlockTime <= now) {
        createNode(item.text);
      }
    }
  });
}

load();

// ---------------- SEND ----------------
window.send = function () {
  const msg = document.getElementById("msg").value;
  const date = document.getElementById("date").value;

  const r = push(ref(db, "capsules"));

  set(r, {
    text: msg,
    unlockTime: new Date(date).getTime()
  });
};

// ---------------- MOVEMENT ----------------
const speed = 0.5;

// ---------------- ANIMATE ----------------
function animate() {
  requestAnimationFrame(animate);

  // camera rotation
  camera.rotation.order = "YXZ";
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  const forward = new THREE.Vector3(
    Math.sin(yaw),
    0,
    Math.cos(yaw)
  );

  const right = new THREE.Vector3(
    Math.sin(yaw + Math.PI/2),
    0,
    Math.cos(yaw + Math.PI/2)
  );

  if (keys["w"]) camera.position.add(forward.clone().multiplyScalar(speed));
  if (keys["s"]) camera.position.add(forward.clone().multiplyScalar(-speed));
  if (keys["a"]) camera.position.add(right.clone().multiplyScalar(-speed));
  if (keys["d"]) camera.position.add(right.clone().multiplyScalar(speed));

  // black hole gravity
  const center = new THREE.Vector3(0,0,0);

  nodes.forEach((n) => {
    const dir = center.clone().sub(n.position);
    const dist = dir.length();

    dir.normalize();

    const force = 0.01 / Math.max(dist, 0.2);

    n.position.add(dir.multiplyScalar(force));

    if (dist < 4.5) {
      scene.remove(n);
      nodes = nodes.filter(x => x !== n);
    }
  });

  ring.rotation.z += 0.01;

  renderer.render(scene, camera);
}

animate();

// resize
window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

</script>

</body>
</html>
