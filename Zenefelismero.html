<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>🔥 IG MINI V3 CLEAN PRO</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0b14;
  color: white;
}

header {
  padding: 12px;
  background: #111;
  text-align: center;
  border-bottom: 1px solid #333;
}

#auth {
  max-width: 400px;
  margin: 40px auto;
  padding: 15px;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  border: none;
}

button {
  background: #ff2d55;
  color: white;
  cursor: pointer;
}

#app {
  display: none;
}

.topbar {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  background: #111;
  border-bottom: 1px solid #333;
}

.container {
  max-width: 600px;
  margin: auto;
}

.postBox {
  margin: 10px;
  padding: 10px;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
}

.post {
  margin: 10px;
  background: #1a1a2a;
  border-radius: 10px;
  overflow: hidden;
}

.post img {
  width: 100%;
}

.postContent {
  padding: 10px;
}

.small {
  font-size: 12px;
  opacity: 0.7;
}
</style>
</head>

<body>

<header>🔥 IG MINI V3 CLEAN PRO</header>

<!-- AUTH -->
<div id="auth">
  <input id="email" placeholder="Email">
  <input id="pass" type="password" placeholder="Jelszó">

  <button id="reg">Reg</button>
  <button id="login">Login</button>

  <p id="status"></p>
</div>

<!-- APP -->
<div id="app">

  <div class="topbar">
    <div id="userInfo">user</div>
    <button id="logout">Logout</button>
  </div>

  <div class="container">

    <div class="postBox">
      <input id="img" placeholder="Image URL">
      <input id="text" placeholder="Caption">
      <button id="postBtn">Post</button>
    </div>

    <div id="feed"></div>

  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getDatabase,
  ref,
  push,
  set,
  onValue,
  get
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0x",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:3797a2fc935c63a0464b89"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let user = null;

//
// 🔐 AUTH
//
reg.onclick = () => {
  createUserWithEmailAndPassword(auth, email.value, pass.value)
  .catch(e => status.innerText = e.message);
};

login.onclick = () => {
  signInWithEmailAndPassword(auth, email.value, pass.value)
  .catch(e => status.innerText = e.message);
};

logout.onclick = () => signOut(auth);

//
// 👤 STATE
//
onAuthStateChanged(auth, (u) => {
  user = u;

  if (user) {
    auth.style.display = "none";
    app.style.display = "block";

    userInfo.innerText = user.email;

    loadFeed();
  } else {
    auth.style.display = "block";
    app.style.display = "none";
  }
});

//
// 📤 POST
//
postBtn.onclick = () => {
  const p = push(ref(db, "posts"));

  set(p, {
    img: img.value,
    text: text.value,
    user: user.email,
    likes: 0,
    time: Date.now()
  });
};

//
// ❤️ LIKE
//
window.like = (id, likes) => {
  set(ref(db, "posts/" + id + "/likes"), likes + 1);
};

//
// 💬 COMMENT
//
window.comment = (id) => {
  const text = prompt("Komment:");

  if (!text) return;

  push(ref(db, "comments/" + id), {
    text,
    user: user.email,
    time: Date.now()
  });
};

//
// 🌍 FEED
//
function loadFeed() {
  onValue(ref(db, "posts"), (snap) => {
    const data = snap.val();
    feed.innerHTML = "";

    for (let id in data || {}) {
      const p = data[id];

      const div = document.createElement("div");
      div.className = "post";

      div.innerHTML = `
        <img src="${p.img}">
        <div class="postContent">
          <b>${p.user}</b><br>
          ${p.text}<br>

          <button onclick="like('${id}', ${p.likes})">
            ❤️ ${p.likes}
          </button>

          <button onclick="comment('${id}')">
            💬 Comment
          </button>

          <div id="c_${id}" class="small"></div>
        </div>
      `;

      feed.appendChild(div);

      loadComments(id);
    }
  });
}

//
// 💬 COMMENTS
//
function loadComments(postId) {
  onValue(ref(db, "comments/" + postId), (snap) => {
    const data = snap.val();
    const box = document.getElementById("c_" + postId);

    if (!box) return;

    box.innerHTML = "";

    for (let id in data || {}) {
      const c = data[id];
      const d = document.createElement("div");
      d.innerText = "💬 " + c.text;
      box.appendChild(d);
    }
  });
}

</script>

</body>
</html>
