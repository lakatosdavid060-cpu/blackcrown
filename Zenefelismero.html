<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>⏳ Cyberpunk TimeCapsule OS 5.0</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
  background: #000008;
  color: white;
}

#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 10;
  width: 280px;
  padding: 10px;
  background: rgba(0,0,0,0.6);
  border: 1px solid rgba(0,255,255,0.3);
  border-radius: 10px;
  backdrop-filter: blur(10px);
}

input, button {
  width: 100%;
  margin: 5px 0;
  padding: 8px;
  border-radius: 6px;
  border: none;
}

button {
  background: linear-gradient(90deg, #6c5ce7, #00f5ff);
  color: white;
  cursor: pointer;
}

canvas { display:block; }
</style>
</head>

<body>

<div id="ui">
  <input id="msg" placeholder="Üzenet..." />
  <input id="date" type="datetime-local" />
  <button onclick="send()">⏳ Időkapszula küldés</button>
</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  set,
  onValue
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// ---------------- FIREBASE ----------------
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:3797a2fc935c63a0464b89"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ---------------- 3D WORLD ----------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000010);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(0, 15, 70);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// ---------------- LIGHT ----------------
scene.add(new THREE.AmbientLight(0xffffff, 1.2));

// ---------------- BLACK HOLE (VISUAL) ----------------
const core = new THREE.Mesh(
  new THREE.SphereGeometry(6, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0x000000 })
);
scene.add(core);

// ring
const ring = new THREE.Mesh(
  new THREE.RingGeometry(8, 14, 64),
  new THREE.MeshBasicMaterial({
    color: 0x00f5ff,
    transparent: true,
    opacity: 0.5,
    side: THREE.DoubleSide
  })
);
ring.rotation.x = Math.PI/2;
scene.add(ring);

// ---------------- CAPSULE OBJECTS ----------------
let nodes = [];

// kapszula state:
function createCapsule(item, state){

  const color = state === "locked" ? 0x444444 : 0x00f5ff;

  const mesh = new THREE.Mesh(
    new THREE.IcosahedronGeometry(3,0),
    new THREE.MeshStandardMaterial({
      color,
      emissive: state === "unlocked" ? 0x001133 : 0x000000
    })
  );

  mesh.position.set(
    (Math.random()-0.5)*80,
    (Math.random()-0.5)*40,
    (Math.random()-0.5)*80
  );

  mesh.userData = item;
  mesh.userData.state = state;

  scene.add(mesh);
  nodes.push(mesh);
}

// ---------------- FIREBASE LOAD ----------------
function load(){

  const dbRef = ref(db,"capsules");

  onValue(dbRef,(snap)=>{

    const data = snap.val();

    nodes.forEach(n=>scene.remove(n));
    nodes = [];

    if(!data) return;

    const now = Date.now();

    for(let id in data){

      const item = data[id];
      if(!item) continue;

      if(item.unlockTime > now){
        // 🔒 LOCKED (glitch állapot)
        createCapsule(item,"locked");
      } else {
        // 🔓 UNLOCKED (valódi üzenet)
        createCapsule(item,"unlocked");
      }
    }
  });
}

load();

// ---------------- SEND ----------------
window.send = function(){
  const msg = document.getElementById("msg").value;
  const date = document.getElementById("date").value;

  const r = push(ref(db,"capsules"));

  set(r,{
    text: msg,
    unlockTime: new Date(date).getTime()
  });
};

// ---------------- ANIMATION (CAPSULE PHYSICS) ----------------
function animate(){
  requestAnimationFrame(animate);

  const center = new THREE.Vector3(0,0,0);

  nodes.forEach(n=>{

    const dir = center.clone().sub(n.position);
    const dist = dir.length();

    dir.normalize();

    // locked lassabb, unlocked gyorsabb reagálás
    let force = n.userData.state === "locked"
      ? 0.005
      : 0.02;

    force = force / Math.max(dist,0.2);

    n.position.add(dir.multiplyScalar(force));

    // fekete lyuk hatás
    if(dist < 5){
      scene.remove(n);
      nodes = nodes.filter(x=>x!==n);
    }
  });

  ring.rotation.z += 0.008;

  renderer.render(scene,camera);
}

animate();

// resize
window.addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

</script>

</body>
</html>
