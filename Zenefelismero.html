<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>🔥 Pro Insta</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f1a;
  color: white;
}

header {
  padding: 15px;
  text-align: center;
  background: #111;
  border-bottom: 1px solid #333;
}

#loginBox, #uploadBox {
  max-width: 500px;
  margin: 15px auto;
  padding: 15px;
  background: rgba(255,255,255,0.05);
  border-radius: 10px;
}

input, button {
  width: 100%;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  border: none;
}

button {
  cursor: pointer;
  background: #ff2d55;
  color: white;
}

.post {
  max-width: 500px;
  margin: 15px auto;
  background: #1a1a2a;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid #333;
}

.post img {
  width: 100%;
}

.postContent {
  padding: 10px;
}

.likeBtn {
  background: #222;
  margin-top: 10px;
}
</style>
</head>

<body>

<header>🔥 PRO INSTA</header>

<div id="loginBox">
  <button onclick="login()">🔐 Login Google-fiókkal</button>
</div>

<div id="uploadBox" style="display:none;">
  <input type="file" id="file" />
  <input id="text" placeholder="Írj valamit..." />
  <button onclick="upload()">📤 Poszt</button>
</div>

<div id="feed"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getDatabase,
  ref,
  push,
  set,
  onValue,
  update
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

import {
  getStorage,
  ref as sRef,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyB...",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:3797a2fc935c63a0464b89"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const storage = getStorage(app);

let user = null;

// 🔐 LOGIN
window.login = function () {
  const provider = new GoogleAuthProvider();
  signInWithPopup(auth, provider);
};

onAuthStateChanged(auth, (u) => {
  if (u) {
    user = u;
    document.getElementById("uploadBox").style.display = "block";
    document.getElementById("loginBox").style.display = "none";
  }
});

// 📤 UPLOAD POST
window.upload = async function () {
  const file = document.getElementById("file").files[0];
  const text = document.getElementById("text").value;

  if (!file || !text) return;

  const storageRef = sRef(storage, "posts/" + Date.now());

  await uploadBytes(storageRef, file);
  const url = await getDownloadURL(storageRef);

  const newRef = push(ref(db, "posts"));

  set(newRef, {
    img: url,
    text,
    likes: 0,
    user: user.displayName,
    time: Date.now()
  });

  document.getElementById("text").value = "";
};

// ❤️ LIKE
window.like = function(id, likes) {
  update(ref(db, "posts/" + id), {
    likes: likes + 1
  });
};

// 📡 FEED
function render(data) {
  const feed = document.getElementById("feed");
  feed.innerHTML = "";

  const posts = Object.entries(data || {}).reverse();

  for (let [id, p] of posts) {
    const div = document.createElement("div");
    div.className = "post";

    div.innerHTML = `
      <img src="${p.img}" />
      <div class="postContent">
        <b>👤 ${p.user}</b><br>
        ${p.text}
        <button class="likeBtn" onclick="like('${id}', ${p.likes})">
          ❤️ Like (${p.likes})
        </button>
      </div>
    `;

    feed.appendChild(div);
  }
}

onValue(ref(db, "posts"), (snap) => {
  render(snap.val());
});
</script>

</body>
</html>
