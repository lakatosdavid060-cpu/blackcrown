<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Advanced Live Locator</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #map {
      width: 100vw;
      height: 100vh;
    }

    .panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 9999;

      background: white;
      padding: 15px;
      border-radius: 12px;

      box-shadow: 0 0 15px rgba(0,0,0,0.2);

      width: 260px;
    }

    .panel h2 {
      margin-top: 0;
      font-size: 18px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;

      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;

      border: none;
      border-radius: 8px;

      background: #007bff;
      color: white;

      cursor: pointer;
      font-size: 15px;
    }

    .users {
      margin-top: 15px;
      max-height: 250px;
      overflow-y: auto;
    }

    .user {
      padding: 8px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .online {
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="panel">

  <h2>🔥 Live Locator</h2>

  <input id="username" placeholder="Neved">

  <button onclick="startTracking()">
    Start Tracking
  </button>

  <div class="users" id="users"></div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  onValue,
  onDisconnect
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


// FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:70086de26402ceb3464b89"
};


// INIT
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


// MAP
const map = L.map('map').setView([47.4979, 19.0402], 13);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution: '&copy; OpenStreetMap contributors'
  }
).addTo(map);


// STORAGE
const markers = {};
const trails = {};

let myId = null;


// USER ICON
function createUserIcon(name) {

  return L.divIcon({
    html: `
      <div style="
        background:#007bff;
        color:white;
        padding:6px 10px;
        border-radius:20px;
        font-size:12px;
        white-space:nowrap;
      ">
        ${name}
      </div>
    `,
    className: ""
  });

}


// CREATE / UPDATE MARKER
function updateMarker(id, lat, lng, username) {

  if (markers[id]) {

    markers[id].setLatLng([lat, lng]);

    trails[id].addLatLng([lat, lng]);

    return;
  }

  markers[id] = L.marker(
    [lat, lng],
    {
      icon: createUserIcon(username)
    }
  ).addTo(map);

  markers[id].bindPopup(username);

  trails[id] = L.polyline(
    [[lat, lng]],
    {
      weight: 4
    }
  ).addTo(map);

}


// START TRACKING
window.startTracking = async function () {

  const username =
    document.getElementById("username").value || "anonymous";

  myId = crypto.randomUUID();

  onDisconnect(ref(db, "locations/" + myId)).remove();

  navigator.geolocation.watchPosition(

    async (position) => {

      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const speed = position.coords.speed || 0;

      await set(
        ref(db, "locations/" + myId),
        {
          username,
          lat,
          lng,
          speed,
          online: true,
          updatedAt: Date.now()
        }
      );

      map.setView([lat, lng], 16);

    },

    (error) => {

      alert(
        "GPS hiba: " + error.message
      );

    },

    {
      enableHighAccuracy: true,
      timeout: 5000,
      maximumAge: 0
    }

  );

};


// LIVE USERS
onValue(ref(db, "locations"), (snapshot) => {

  const data = snapshot.val();

  if (!data) return;

  const usersDiv =
    document.getElementById("users");

  usersDiv.innerHTML = "";

  Object.keys(data).forEach((id) => {

    const user = data[id];

    updateMarker(
      id,
      user.lat,
      user.lng,
      user.username
    );

    usersDiv.innerHTML += `
      <div class="user">
        <span class="online">●</span>
        ${user.username}<br>
        Speed:
        ${Math.round(user.speed * 3.6 || 0)} km/h
      </div>
    `;

  });

});

</script>

</body>
</html>
