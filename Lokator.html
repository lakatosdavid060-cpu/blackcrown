<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Family Locator Pro</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<link
  rel="manifest"
  href="manifest.json"
/>

<meta name="theme-color" content="#0f172a"/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial;
  background:#0f172a;
  color:white;
  overflow:hidden;
}

#map{
  width:100vw;
  height:100vh;
}

.sidebar{

  position:absolute;
  top:0;
  left:0;

  width:320px;
  height:100vh;

  background:#111827;

  z-index:9999;

  padding:20px;

  overflow-y:auto;

  border-right:1px solid #1f2937;
}

.logo{
  font-size:22px;
  font-weight:bold;
  margin-bottom:20px;
}

input{

  width:100%;
  padding:12px;

  background:#1f2937;
  color:white;

  border:none;
  border-radius:10px;

  margin-bottom:10px;
}

button{

  width:100%;
  padding:12px;

  border:none;
  border-radius:10px;

  background:#2563eb;
  color:white;

  cursor:pointer;

  margin-bottom:10px;
}

button:hover{
  opacity:0.9;
}

.card{

  background:#1f2937;
  padding:12px;

  border-radius:12px;

  margin-bottom:10px;
}

.speed{
  color:#22c55e;
}

.sos{
  background:#dc2626;
}

.chat{

  position:absolute;
  bottom:0;
  left:320px;

  width:400px;
  height:250px;

  background:#111827;

  z-index:9999;

  display:flex;
  flex-direction:column;
}

.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.chat-input{
  display:flex;
}

.chat-input input{
  border-radius:0;
  margin:0;
}

.chat-input button{
  width:100px;
  margin:0;
  border-radius:0;
}

.msg{
  margin-bottom:10px;
  padding:10px;
  background:#1f2937;
  border-radius:10px;
}

</style>

</head>

<body>

<div class="sidebar">

  <div class="logo">
    🔥 Family Locator Pro
  </div>

  <input
    id="username"
    placeholder="Neved"
  />

  <input
    id="avatar"
    placeholder="Profilkép URL"
  />

  <button onclick="startTracking()">
    Start Tracking
  </button>

  <button class="sos" onclick="sendSOS()">
    🚨 SOS
  </button>

  <div id="battery"></div>

  <hr style="margin:20px 0;border-color:#1f2937;">

  <div id="users"></div>

</div>

<div id="map"></div>

<div class="chat">

  <div
    class="chat-messages"
    id="messages"
  ></div>

  <div class="chat-input">

    <input
      id="messageInput"
      placeholder="Üzenet..."
    />

    <button onclick="sendMessage()">
      Send
    </button>

  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  push,
  onValue,
  onDisconnect
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


// FIREBASE
const firebaseConfig = {

  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:70086de26402ceb3464b89"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


// MAP
const map = L.map('map').setView(
  [47.4979, 19.0402],
  13
);


// DARK MAP
L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  {
    attribution:'&copy; OpenStreetMap'
  }
).addTo(map);


// STORAGE
const markers = {};
const trails = {};

let myId = null;
let myName = "";


// PROFILE ICON
function createAvatar(url,name){

  return L.divIcon({

    html:`

      <div style="
        display:flex;
        flex-direction:column;
        align-items:center;
      ">

        <img
          src="${url}"
          style="
            width:50px;
            height:50px;
            border-radius:50%;
            border:3px solid #2563eb;
          "
        />

        <div style="
          margin-top:5px;
          background:#111827;
          padding:3px 8px;
          border-radius:10px;
          font-size:12px;
        ">
          ${name}
        </div>

      </div>

    `,

    className:""

  });

}


// START
window.startTracking = async function(){

  myName =
    document.getElementById("username").value
    || "anonymous";

  const avatar =
    document.getElementById("avatar").value
    || "https://i.pravatar.cc/100";

  myId = crypto.randomUUID();

  onDisconnect(
    ref(db,"users/"+myId)
  ).remove();


  // BATTERY
  if(navigator.getBattery){

    const battery =
      await navigator.getBattery();

    document.getElementById("battery")
      .innerHTML =
      `🔋 Battery:
      ${Math.round(battery.level*100)}%`;

  }


  // GPS
  navigator.geolocation.watchPosition(

    async(position)=>{

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;

      const speed =
        position.coords.speed || 0;

      // SAVE
      await set(
        ref(db,"users/"+myId),
        {
          name:myName,
          avatar,
          lat,
          lng,
          speed,
          updatedAt:Date.now()
        }
      );


      // PATH SAVE
      await push(
        ref(db,"routes/"+myId),
        {
          lat,
          lng,
          time:Date.now()
        }
      );


      map.setView([lat,lng],16);


      // GEOFENCE ALERT
      if(speed*3.6 > 120){

        alert(
          "⚠️ Speed limit exceeded!"
        );

      }

    },

    (err)=>{

      alert(err.message);

    },

    {
      enableHighAccuracy:true,
      timeout:5000,
      maximumAge:0
    }

  );

};


// LIVE USERS
onValue(
  ref(db,"users"),
  (snapshot)=>{

    const data =
      snapshot.val();

    if(!data) return;

    const users =
      document.getElementById("users");

    users.innerHTML = "";

    Object.keys(data).forEach((id)=>{

      const user = data[id];

      // MARKER UPDATE
      if(markers[id]){

        markers[id].setLatLng(
          [user.lat,user.lng]
        );

        trails[id].addLatLng(
          [user.lat,user.lng]
        );

      }else{

        markers[id] = L.marker(
          [user.lat,user.lng],
          {
            icon:createAvatar(
              user.avatar,
              user.name
            )
          }
        ).addTo(map);

        trails[id] = L.polyline(
          [[user.lat,user.lng]],
          {
            weight:4
          }
        ).addTo(map);

      }


      // USER CARD
      users.innerHTML += `

        <div class="card">

          <b>${user.name}</b><br>

          <span class="speed">
            🚗
            ${Math.round(user.speed*3.6 || 0)}
            km/h
          </span>

        </div>

      `;

    });

  }
);


// CHAT
window.sendMessage = async function(){

  const input =
    document.getElementById("messageInput");

  const text =
    input.value;

  if(!text) return;

  await push(
    ref(db,"chat"),
    {
      user:myName,
      text,
      time:Date.now()
    }
  );

  input.value = "";

};


// LIVE CHAT
onValue(
  ref(db,"chat"),
  (snapshot)=>{

    const data =
      snapshot.val();

    if(!data) return;

    const messages =
      document.getElementById("messages");

    messages.innerHTML = "";

    Object.values(data).forEach((msg)=>{

      messages.innerHTML += `

        <div class="msg">

          <b>${msg.user}</b><br>

          ${msg.text}

        </div>

      `;

    });

  }
);


// SOS
window.sendSOS = async function(){

  if(!myId) return;

  await push(
    ref(db,"alerts"),
    {
      user:myName,
      type:"SOS",
      time:Date.now()
    }
  );

  alert("🚨 SOS elküldve!");

};


// PUSH NOTIFICATION
if("Notification" in window){

  Notification.requestPermission();

}

</script>

</body>
</html>
