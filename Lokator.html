<!DOCTYPE html>
<html lang="hu">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Family Locator Pro</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial;
}

body{
  overflow:hidden;
  background:#0f172a;
  color:white;
}

/* MAP */
#map{
  width:100vw;
  height:100vh;
}

/* FLOAT BUTTON (MOBILE) */
.fab{
  position:absolute;
  top:10px;
  left:10px;
  z-index:99999;

  width:50px;
  height:50px;

  border-radius:50%;
  border:none;

  background:#2563eb;
  color:white;
  font-size:20px;
}

/* PANEL */
.panel{

  position:absolute;
  bottom:-75%;
  left:0;

  width:100%;
  height:75%;

  background:#111827;

  z-index:99998;

  border-top-left-radius:20px;
  border-top-right-radius:20px;

  transition:0.3s;

  padding:15px;

  overflow-y:auto;
}

.panel.open{
  bottom:0;
}

/* HANDLE */
.handle{
  width:60px;
  height:6px;
  background:#374151;
  border-radius:10px;
  margin:0 auto 10px auto;
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  margin-bottom:10px;

  border:none;
  border-radius:10px;

  background:#1f2937;
  color:white;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;

  margin-bottom:10px;

  border:none;
  border-radius:10px;

  background:#2563eb;
  color:white;

  cursor:pointer;
}

.sos{
  background:#dc2626;
}

/* USERS */
.card{
  background:#1f2937;
  padding:10px;
  border-radius:10px;
  margin-bottom:8px;
}

/* CHAT */
.chat{
  position:absolute;
  right:0;
  bottom:0;

  width:300px;
  height:250px;

  background:#111827;

  z-index:99999;

  display:flex;
  flex-direction:column;
}

.msgs{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.chat input{
  margin:0;
  border-radius:0;
}

</style>

</head>

<body>

<button class="fab" onclick="togglePanel()">☰</button>

<div id="map"></div>

<!-- PANEL -->
<div class="panel" id="panel">

<div class="handle" onclick="togglePanel()"></div>

<h3>🔥 Live Locator</h3>

<input id="username" placeholder="Neved">
<input id="avatar" placeholder="Profilkép URL">

<button onclick="startTracking()">Start Tracking</button>
<button class="sos" onclick="sendSOS()">🚨 SOS</button>

<div id="battery"></div>

<hr style="margin:10px 0;border-color:#1f2937;">

<div id="users"></div>

</div>

<!-- CHAT -->
<div class="chat">

<div class="msgs" id="msgs"></div>

<input id="msgInput" placeholder="Üzenet..." onkeydown="if(event.key==='Enter')sendMsg()"/>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  set,
  push,
  onValue,
  onDisconnect
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


// FIREBASE (IDE TEGYED A SAJÁTOT)
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:70086de26402ceb3464b89"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


// MAP (DARK MODE)
const map = L.map('map').setView([47.4979,19.0402],13);

L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  { attribution:'&copy; OpenStreetMap' }
).addTo(map);


// DATA
let myId = null;
let myName = "";
let myAvatar = "";

const markers = {};
const paths = {};


// TOGGLE PANEL
window.togglePanel = function(){
  document.getElementById("panel")
    .classList.toggle("open");
};


// ICON
function icon(url,name){

  return L.divIcon({

    html:`
      <div style="text-align:center">
        <img src="${url}"
          style="
            width:45px;
            height:45px;
            border-radius:50%;
            border:2px solid #2563eb;
          "/>

        <div style="
          background:#111827;
          padding:2px 6px;
          border-radius:8px;
          font-size:11px;
        ">
          ${name}
        </div>
      </div>
    `,
    className:""

  });

}


// START
window.startTracking = function(){

  myName =
    document.getElementById("username").value || "anon";

  myAvatar =
    document.getElementById("avatar").value ||
    "https://i.pravatar.cc/100";

  myId = crypto.randomUUID();

  onDisconnect(ref(db,"users/"+myId)).remove();


  navigator.geolocation.watchPosition(

    async (pos)=>{

      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const speed = pos.coords.speed || 0;

      await set(ref(db,"users/"+myId),{
        name:myName,
        avatar:myAvatar,
        lat,
        lng,
        speed,
        time:Date.now()
      });

      map.setView([lat,lng],16);

    },

    (err)=>alert(err.message),

    {
      enableHighAccuracy:true,
      maximumAge:0
    }

  );

};


// USERS LIVE
onValue(ref(db,"users"),(snap)=>{

  const data = snap.val();
  if(!data) return;

  const usersDiv = document.getElementById("users");
  usersDiv.innerHTML = "";

  Object.keys(data).forEach(id=>{

    const u = data[id];

    // marker
    if(markers[id]){
      markers[id].setLatLng([u.lat,u.lng]);
      paths[id].addLatLng([u.lat,u.lng]);
    }else{

      markers[id] = L.marker([u.lat,u.lng],{
        icon:icon(u.avatar,u.name)
      }).addTo(map);

      paths[id] = L.polyline([[u.lat,u.lng]],{
        weight:4
      }).addTo(map);

    }

    usersDiv.innerHTML += `
      <div class="card">
        <b>${u.name}</b><br>
        🚗 ${Math.round(u.speed*3.6 || 0)} km/h
      </div>
    `;

  });

});


// CHAT
window.sendMsg = async function(){

  const text =
    document.getElementById("msgInput").value;

  if(!text) return;

  await push(ref(db,"chat"),{
    user:myName,
    text,
    time:Date.now()
  });

  document.getElementById("msgInput").value="";
};


// LIVE CHAT
onValue(ref(db,"chat"),snap=>{

  const data = snap.val();
  if(!data) return;

  const box = document.getElementById("msgs");
  box.innerHTML = "";

  Object.values(data).forEach(m=>{

    box.innerHTML += `
      <div style="margin-bottom:8px;">
        <b>${m.user}</b><br>${m.text}
      </div>
    `;

  });

});


// SOS
window.sendSOS = async function(){

  await push(ref(db,"alerts"),{
    user:myName,
    time:Date.now()
  });

  alert("🚨 SOS elküldve!");

};

</script>

</body>
</html>
