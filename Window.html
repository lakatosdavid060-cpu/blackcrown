<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Windows 10 Ultimate Engine</title>

<style>
body {
    margin: 0;
    font-family: Segoe UI, Arial;
    overflow: hidden;
    background: black;
}

/* LOGIN */
#login {
    position: absolute;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle, #1e3a8a, #0b1220);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: white;
}

#desktop {
    display: none;
    width: 100vw;
    height: 100vh;
    position: relative;
    background: linear-gradient(120deg,#1e3a8a,#0b1220);
    animation: bgmove 10s infinite alternate;
}

@keyframes bgmove {
    0%{filter: hue-rotate(0deg);}
    100%{filter: hue-rotate(40deg);}
}

/* ICON */
.icon {
    width: 80px;
    text-align: center;
    color: white;
    position: absolute;
    cursor: grab;
}

.icon img { width:48px;height:48px; }

/* WINDOW */
.window {
    width: 380px;
    height: 260px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2);
    position: absolute;
    color: white;
    overflow: hidden;
    transition: 0.2s;
}

.titlebar {
    background: rgba(0,0,0,0.4);
    padding: 6px;
    display:flex;
    justify-content: space-between;
    cursor: move;
}

/* TASKBAR */
#taskbar {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 45px;
    background: rgba(20,20,20,0.9);
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 10px;
    color:white;
}

#startBtn {
    background:#2563eb;
    padding:6px 12px;
    border-radius:4px;
    cursor:pointer;
}

/* TASK */
.task {
    background: rgba(255,255,255,0.1);
    padding:4px 8px;
    border-radius:6px;
    cursor:pointer;
}

/* PROCESS */
.proc {
    padding:5px;
    background: rgba(255,255,255,0.05);
    margin:3px;
    border-radius:5px;
    cursor:pointer;
}

.file {
    padding:6px;
    margin:4px 0;
    background: rgba(255,255,255,0.05);
    border-radius:6px;
    cursor:pointer;
}

.file:hover {
    background: rgba(37,99,235,0.4);
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
    <h1>Windows 10 Ultimate</h1>
    <input id="user" placeholder="Username">
    <input id="pass" placeholder="Password" type="password">
    <button onclick="login()">Login</button>
</div>

<!-- DESKTOP -->
<div id="desktop"></div>

<!-- TASKBAR -->
<div id="taskbar">
    <div id="startBtn" onclick="openWindow('Start','start')">🪟 Start</div>
    <div id="tasks"></div>
</div>

<script>

/* =========================
   SOUND (simple fake)
========================= */
function beep(){
    let a=new Audio("https://www.soundjay.com/buttons/sounds/button-16.mp3");
    a.volume=0.2;
    a.play();
}

/* =========================
   LOGIN
========================= */
function login(){
    beep();
    document.getElementById("login").style.display="none";
    document.getElementById("desktop").style.display="block";
    init();
}

/* =========================
   STATE
========================= */

let z=1;
let windows={};
let processes={};

/* =========================
   WINDOWS
========================= */

function openWindow(name,type){

    beep();

    if(windows[name]){
        restore(name);
        return;
    }

    let win=document.createElement("div");
    win.className="window";
    win.style.zIndex=++z;

    processes[name]=true;

    win.innerHTML=`
        <div class="titlebar">
            <span>${name}</span>
            <div>
                <button onclick="minimize('${name}')">_</button>
                <button onclick="closeW('${name}')">X</button>
            </div>
        </div>
        <div class="content">
            ${render(type,name)}
        </div>
    `;

    document.getElementById("desktop").appendChild(win);
    windows[name]=win;

    addTask(name);
    drag(win);
}

/* =========================
   RENDER APPS
========================= */

function render(type,name){

    if(type==="start"){
        return `
            <h3>Start Menu</h3>
            <button onclick="openWindow('Task Manager','tm')">Task Manager</button>
            <button onclick="openWindow('Explorer','explorer')">File Explorer</button>
        `;
    }

    if(type==="tm"){
        return Object.keys(processes).map(p=>
            `<div class="proc" onclick="kill('${p}')">${p}</div>`
        ).join("");
    }

    if(type==="explorer"){
        return `
            <div class="file" draggable="true" ondragstart="dragFile(event,'Steam')">Steam</div>
            <div class="file" ondragover="allow(event)" ondrop="drop(event,'FiveM')">📁 Drop area (FiveM folder)</div>
        `;
    }

    return `<button onclick="window.open('https://fivem.net')">Open</button>`;
}

/* =========================
   TASKBAR
========================= */

function addTask(name){
    let d=document.createElement("div");
    d.className="task";
    d.innerText=name;
    d.onclick=()=>restore(name);
    document.getElementById("tasks").appendChild(d);
}

/* =========================
   WINDOW ACTIONS
========================= */

function minimize(n){
    windows[n].style.display="none";
}

function restore(n){
    windows[n].style.display="block";
    windows[n].style.zIndex=++z;
}

function closeW(n){
    beep();
    windows[n].remove();
    delete windows[n];
    delete processes[n];
}

/* =========================
   TASK KILLER
========================= */

function kill(name){
    closeW(name);
}

/* =========================
   DRAG WINDOW
========================= */

function drag(el){
    let down=false,ox,oy;

    el.querySelector(".titlebar").addEventListener("mousedown",e=>{
        down=true;
        ox=e.clientX-el.offsetLeft;
        oy=e.clientY-el.offsetTop;
        el.style.zIndex=++z;
    });

    document.addEventListener("mousemove",e=>{
        if(down){
            el.style.left=(e.clientX-ox)+"px";
            el.style.top=(e.clientY-oy)+"px";
        }
    });

    document.addEventListener("mouseup",()=>down=false);
}

/* =========================
   FILE DRAG DROP (simple)
========================= */

function allow(e){ e.preventDefault(); }

function dragFile(e,name){
    e.dataTransfer.setData("text",name);
}

function drop(e,target){
    let file=e.dataTransfer.getData("text");
    alert(file+" moved to "+target);
}

/* =========================
   INIT DESKTOP ICONS
========================= */

function init(){
    openWindow("Explorer","explorer");
}

</script>

</body>
</html>
