<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FM PRO+</title>
<style>
body{font-family:Arial;background:#070707;color:#fff;}
.container{max-width:1100px;margin:auto;padding:20px;}
.card{background:#1e1e1e;padding:15px;margin:10px 0;border-radius:10px;}
button{padding:10px;margin:5px;cursor:pointer;}
table{width:100%;border-collapse:collapse;}
td,th{border:1px solid #444;padding:6px;}
</style>
</head>
<body>

<div class="container">

<h1>⚽ FM PRO+ – Football Manager Advanced</h1>

<div class="card">
<h2>📅 Szezon: <span id="season">1</span></h2>
<h3>💰 Pénz: €<span id="money">500</span>M</h3>
<h3>🏆 BL pont: <span id="ucl">0</span></h3>
</div>

<div class="card">
<h2>📰 Hírek</h2>
<p id="news">Üdv a szezonban!</p>
</div>

<div class="card">
<h2>🏆 Liga</h2>
<table>
<thead><tr><th>Csapat</th><th>Pont</th></tr></thead>
<tbody id="table"></tbody>
</table>
</div>

<div class="card">
<h2>⭐ Keret</h2>
<ul id="squad"></ul>
</div>

<div class="card">
<h2>⚽ Meccs</h2>
<button onclick="match()">Meccs lejátszása</button>
<h3 id="result"></h3>
</div>

<div class="card">
<h2>🛒 Átigazolás</h2>
<button onclick="buy('Mbappé',200,97)">Mbappé</button>
<button onclick="buy('Haaland',180,95)">Haaland</button>
<button onclick="buy('Bellingham',140,90)">Bellingham</button>
<button onclick="buy('De Bruyne',100,92)">De Bruyne</button>
<button onclick="buy('Vinícius',120,91)">Vinícius</button>
</div>

<div class="card">
<button onclick="nextSeason()">➡️ Következő szezon</button>
</div>

</div>

<script>

// ================= USER =================
let season=1;
let money=500;
let ucl=0;
let matchIndex=0;

let user={
name:"Real Madrid",
points:0,
squad:[
{name:"Ronaldo",ovr:95,form:1,inj:0},
{name:"Messi",ovr:96,form:1,inj:0},
{name:"Vinícius",ovr:91,form:1,inj:0},
{name:"Bellingham",ovr:90,form:1,inj:0},
{name:"Modrić",ovr:89,form:1,inj:0},
{name:"Courtois",ovr:90,form:1,inj:0},
{name:"Rüdiger",ovr:88,form:1,inj:0},
{name:"Valverde",ovr:88,form:1,inj:0},
{name:"Carvajal",ovr:86,form:1,inj:0},
{name:"Camavinga",ovr:87,form:1,inj:0},
{name:"Rodrygo",ovr:88,form:1,inj:0},
{name:"Alaba",ovr:86,form:1,inj:0}
]
};

// ================= TEAMS =================
function genTeam(name){
let squad=[];
for(let i=0;i<12;i++){
squad.push({
name:name+"_P"+i,
ovr:82+Math.random()*8,
form:1
});
}
return {name,points:0,squad};
}

let teams=[];
let names=[
"Barcelona","Bayern","City","PSG","Arsenal","Liverpool","Inter","Chelsea",
"Dortmund","Atletico","Napoli","Milan","Leverkusen","Tottenham","Newcastle",
"Ajax","Benfica","Porto","Lazio","Roma"
];

names.forEach(n=>teams.push(genTeam(n)));

// ================= UPDATE =================
function update(){

document.getElementById("season").innerText=season;
document.getElementById("money").innerText=money;
document.getElementById("ucl").innerText=ucl;

// squad
let ul=document.getElementById("squad");
ul.innerHTML="";
user.squad.forEach(p=>{
ul.innerHTML+=`<li>${p.name} OVR:${p.ovr}</li>`;
});

// table
let all=[user,...teams].sort((a,b)=>b.points-a.points);

let tb=document.getElementById("table");
tb.innerHTML="";
all.forEach(t=>{
tb.innerHTML+=`<tr><td>${t.name}</td><td>${t.points}</td></tr>`;
});
}

// ================= POWER =================
function power(team){
let sum=0;
team.squad.forEach(p=>{
sum += p.ovr + (p.form||1);
});
return sum/team.squad.length + Math.random()*5;
}

// ================= MATCH ENGINE =================
function match(){

let opp=teams[Math.floor(Math.random()*teams.length)];

user.squad.forEach(p=>{
p.form += Math.random()*0.2 - 0.1;
if(p.form<0.5)p.form=0.5;
if(p.form>2)p.form=2;
p.inj = Math.random()<0.05 ? 1 : 0;
});

let u=power(user);
let o=power(opp);

let g1=Math.round(u/25);
let g2=Math.round(o/25);

// UCL event (ritka)
let isUCL = Math.random()<0.25;

let text="";

if(g1>g2){
user.points+=3;
if(isUCL) ucl+=3;
text="győzelem";
}
else if(g2>g1){
opp.points+=3;
text="vereség";
}
else{
user.points+=1;
opp.points+=1;
text="döntetlen";
}

// news system
document.getElementById("news").innerText =
`${user.name} ${text} (${g1}-${g2}) vs ${opp.name}`;

document.getElementById("result").innerText =
`⚽ ${user.name} ${g1}-${g2} ${opp.name}`;

matchIndex++;
update();
}

// ================= BUY =================
function buy(name,price,ovr){
if(money>=price){
money-=price;
user.squad.push({name,ovr,form:1,inj:0});
document.getElementById("news").innerText = `${name} leigazolva!`;
update();
}
}

// ================= AI TRANSFERS =================
function aiTransfers(){
teams.forEach(t=>{
if(Math.random()<0.2){
t.squad.push({
name:"Wonderkid"+Math.floor(Math.random()*999),
ovr:82+Math.random()*12,
form:1
});
}
});
}

// ================= SEASON =================
function nextSeason(){

season++;
money+=300;
ucl=0;

// reset
user.points=0;
teams.forEach(t=>t.points=0);

// AI grows + transfers
teams.forEach(t=>{
t.squad.forEach(p=>{
if(Math.random()>0.6) p.ovr+=1;
});
});

aiTransfers();

document.getElementById("news").innerText="Új szezon kezdődött!";
update();
}

// init
update();

</script>

</body>
</html>
