<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Mini Windows OS</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1220;
    overflow: hidden;
}

/* DESKTOP */
#desktop {
    width: 100vw;
    height: 100vh;
    position: relative;
}

/* ICONS */
.icon {
    width: 80px;
    text-align: center;
    color: white;
    position: absolute;
    cursor: pointer;
}

.icon img {
    width: 50px;
    height: 50px;
}

/* WINDOW */
.window {
    width: 300px;
    height: 200px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    position: absolute;
    top: 100px;
    left: 100px;
    color: white;
    overflow: hidden;
}

.titlebar {
    background: rgba(0,0,0,0.4);
    padding: 5px;
    cursor: move;
    display: flex;
    justify-content: space-between;
}

.content {
    padding: 10px;
}

button {
    cursor: pointer;
}

/* TASKBAR */
#taskbar {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 40px;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    color: white;
    padding-left: 10px;
}
</style>
</head>

<body>

<div id="desktop">

    <!-- ICON -->
    <div class="icon" style="top:20px;left:20px;" onclick="openWindow('Steam','steam://run')">
        <img src="https://cdn-icons-png.flaticon.com/512/3670/3670147.png">
        <div>Steam</div>
    </div>

    <div class="icon" style="top:120px;left:20px;" onclick="openWindow('FiveM','https://fivem.net')">
        <img src="https://cdn-icons-png.flaticon.com/512/5968/5968350.png">
        <div>FiveM</div>
    </div>

</div>

<div id="taskbar">🪟 Mini Windows OS</div>

<script>

let z = 1;

/* WINDOW CREATION */
function openWindow(title, url){

    let win = document.createElement("div");
    win.className = "window";
    win.style.zIndex = ++z;

    win.innerHTML = `
        <div class="titlebar">
            <span>${title}</span>
            <button onclick="this.parentElement.parentElement.remove()">X</button>
        </div>
        <div class="content">
            <p>${url}</p>
            <button onclick="window.open('${url}','_blank')">Open</button>
        </div>
    `;

    document.getElementById("desktop").appendChild(win);

    drag(win);
}

/* DRAG SYSTEM */
function drag(el){
    let offsetX, offsetY, isDown = false;

    el.querySelector(".titlebar").addEventListener("mousedown", e=>{
        isDown = true;
        offsetX = e.clientX - el.offsetLeft;
        offsetY = e.clientY - el.offsetTop;
        el.style.zIndex = ++z;
    });

    document.addEventListener("mousemove", e=>{
        if(isDown){
            el.style.left = (e.clientX - offsetX) + "px";
            el.style.top = (e.clientY - offsetY) + "px";
        }
    });

    document.addEventListener("mouseup", ()=>{
        isDown = false;
    });
}

</script>

</body>
</html>
