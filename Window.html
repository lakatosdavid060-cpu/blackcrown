<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>FM FIX</title>
<style>
body{font-family:Arial;background:#0b0b0b;color:#fff;}
.container{max-width:1000px;margin:auto;padding:20px;}
.card{background:#1e1e1e;padding:15px;margin:10px 0;border-radius:10px;}
button{padding:10px;margin:5px;cursor:pointer;}
table{width:100%;border-collapse:collapse;}
td,th{border:1px solid #444;padding:5px;}
</style>
</head>
<body>

<div class="container">

<h1>⚽ FM FIX – WORKING VERSION</h1>

<div class="card">
<h2>📅 Szezon: <span id="season"></span></h2>
<h3>💰 Pénz: €<span id="money"></span>M</h3>
</div>

<div class="card">
<h2>🏆 Tabella</h2>
<table>
<thead><tr><th>Csapat</th><th>Pont</th></tr></thead>
<tbody id="table"></tbody>
</table>
</div>

<div class="card">
<h2>⭐ Keret</h2>
<ul id="squad"></ul>
</div>

<div class="card">
<h2>⚽ Meccs</h2>
<button onclick="match()">Meccs lejátszása</button>
<h3 id="result"></h3>
</div>

<div class="card">
<h2>🛒 Igazolás</h2>
<button onclick="buy('Mbappé',200,97)">Mbappé</button>
<button onclick="buy('Haaland',180,95)">Haaland</button>
<button onclick="buy('Bellingham',140,90)">Bellingham</button>
</div>

</div>

<script>

// ===== USER =====
let season=1;
let money=500;

let user={
name:"Real Madrid",
points:0,
squad:[
{name:"Ronaldo",ovr:95,form:1},
{name:"Messi",ovr:96,form:1},
{name:"Vinícius",ovr:91,form:1},
{name:"Bellingham",ovr:90,form:1},
{name:"Modrić",ovr:89,form:1}
]
};

// ===== TEAMS (FIXED SAFE STRUCTURE) =====
function genTeam(name){
let squad=[];
for(let i=0;i<10;i++){
squad.push({name:name+"_"+i,ovr:82+Math.random()*8,form:1});
}
return {name,points:0,squad};
}

let teams=[
genTeam("Barcelona"),
genTeam("Bayern"),
genTeam("City"),
genTeam("PSG"),
genTeam("Arsenal"),
genTeam("Liverpool"),
genTeam("Inter"),
genTeam("Chelsea"),
genTeam("Dortmund"),
genTeam("Atletico"),
genTeam("Napoli"),
genTeam("Milan"),
genTeam("Leverkusen"),
genTeam("Tottenham"),
genTeam("Newcastle"),
genTeam("Ajax"),
genTeam("Benfica"),
genTeam("Porto"),
genTeam("Lazio"),
genTeam("Roma"),
genTeam("Sevilla"),
genTeam("RB Leipzig"),
genTeam("Real Sociedad"),
genTeam("Feyenoord")
];

// ===== INIT =====
update();

// ===== UPDATE =====
function update(){

document.getElementById("season").innerText=season;
document.getElementById("money").innerText=money;

// squad
let ul=document.getElementById("squad");
ul.innerHTML="";
user.squad.forEach(p=>{
ul.innerHTML+=`<li>${p.name} OVR:${p.ovr}</li>`;
});

// table
let all=[user,...teams].sort((a,b)=>b.points-a.points);
let tb=document.getElementById("table");
tb.innerHTML="";
all.forEach(t=>{
tb.innerHTML+=`<tr><td>${t.name}</td><td>${t.points}</td></tr>`;
});
}

// ===== POWER =====
function power(team){
let sum=0;
team.squad.forEach(p=>{
sum+=p.ovr+(p.form||1);
});
return sum/team.squad.length + Math.random()*5;
}

// ===== MATCH =====
function match(){

let opp=teams[Math.floor(Math.random()*teams.length)];

let u=power(user);
let o=power(opp);

let g1=Math.round(u/25);
let g2=Math.round(o/25);

if(g1>g2) user.points+=3;
else if(g2>g1) opp.points+=3;
else {user.points++;opp.points++;}

document.getElementById("result").innerText=
`⚽ ${user.name} ${g1}-${g2} ${opp.name}`;

update();
}

// ===== BUY =====
function buy(name,price,ovr){
if(money>=price){
money-=price;
user.squad.push({name,ovr,form:1});
update();
}
}

</script>

</body>
</html>
