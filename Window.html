<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Windows 11 Hybrid OS</title>

<style>
body {
    margin: 0;
    font-family: Segoe UI, Arial;
    overflow: hidden;
    background: #0b1220;
}

/* DESKTOP */
#desktop {
    width: 100vw;
    height: 100vh;
    position: relative;
    background: radial-gradient(circle at top, #1e3a8a, #0b1220);
}

/* ICON */
.icon {
    width: 80px;
    text-align: center;
    color: white;
    position: absolute;
    cursor: grab;
}

.icon img { width:48px; height:48px; }

/* WINDOW */
.window {
    width: 420px;
    height: 300px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    position: absolute;
    overflow: hidden;
    color: white;
}

.titlebar {
    background: rgba(0,0,0,0.5);
    padding: 6px;
    display:flex;
    justify-content: space-between;
    cursor: move;
}

/* TASKBAR */
#taskbar {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 48px;
    background: rgba(20,20,20,0.85);
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 10px;
    color:white;
}

#startBtn {
    background:#2563eb;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
}

/* START MENU */
#startMenu {
    position: absolute;
    bottom: 48px;
    left: 10px;
    width: 260px;
    background: rgba(30,30,30,0.95);
    border-radius: 10px;
    padding: 10px;
    display:none;
}

.start-item {
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
}

.start-item:hover {
    background:#2563eb;
}

/* STORE */
.store-item {
    padding: 8px;
    margin: 5px 0;
    background: rgba(255,255,255,0.05);
    border-radius: 6px;
    cursor: pointer;
}

/* TASK */
.task {
    background: rgba(255,255,255,0.1);
    padding: 4px 8px;
    border-radius: 6px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="desktop"></div>

<div id="taskbar">
    <div id="startBtn" onclick="toggleStart()">🪟 Start</div>
    <div id="tasks"></div>
</div>

<!-- START MENU -->
<div id="startMenu">
    <div class="start-item" onclick="openApp('store')">🛒 Store</div>
    <div class="start-item" onclick="openApp('settings')">⚙ Settings</div>
    <div class="start-item" onclick="openApp('browser')">🌐 Browser</div>
</div>

<script>

/* =========================
   STATE = OS DISK
========================= */

let z=1;

let state = {
    apps: JSON.parse(localStorage.getItem("apps")||"[]"),
    windows:{}
};

/* SAVE */
function save(){
    localStorage.setItem("apps",JSON.stringify(state.apps));
}

/* =========================
   WINDOW ENGINE
========================= */

function openApp(type){

    let name = type;

    if(state.windows[name]){
        state.windows[name].style.display="block";
        return;
    }

    let win=document.createElement("div");
    win.className="window";
    win.style.zIndex=++z;

    win.innerHTML=`
        <div class="titlebar">
            <span>${name}</span>
            <div>
                <button onclick="minimize('${name}')">_</button>
                <button onclick="closeW('${name}')">X</button>
            </div>
        </div>
        <div class="content">
            ${renderApp(type)}
        </div>
    `;

    document.getElementById("desktop").appendChild(win);
    state.windows[name]=win;

    addTask(name);
    drag(win);
}

/* =========================
   APPS
========================= */

function renderApp(type){

    /* STORE */
    if(type==="store"){
        return `
            <h3>🛒 App Store</h3>
            <div class="store-item" onclick="install('Notepad')">Install Notepad</div>
            <div class="store-item" onclick="install('Game Launcher')">Install Game Launcher</div>
            <div class="store-item" onclick="install('Terminal')">Install Terminal</div>
        `;
    }

    /* SETTINGS */
    if(type==="settings"){
        return `
            <h3>⚙ Settings</h3>
            <label>Background</label>
            <input type="color" onchange="setBG(this.value)">
            <button onclick="reset()">Reset OS</button>
        `;
    }

    /* BROWSER */
    if(type==="browser"){
        return `
            <h3>🌐 Browser</h3>
            <input id="url" placeholder="https://...">
            <button onclick="go()">Go</button>
            <iframe id="frame" style="width:100%;height:200px;border:none;"></iframe>
        `;
    }

    if(type==="Notepad"){
        return `<textarea style="width:100%;height:200px;"></textarea>`;
    }

    if(type==="Terminal"){
        return `<p>fake terminal ready...</p>`;
    }

    return `<p>App running</p>`;
}

/* =========================
   STORE INSTALL SYSTEM
========================= */

function install(app){
    if(!state.apps.includes(app)){
        state.apps.push(app);
        save();
        alert(app+" installed!");
    }
}

/* =========================
   BROWSER
========================= */

function go(){
    let url=document.getElementById("url").value;
    document.getElementById("frame").src=url;
}

/* =========================
   TASKBAR
========================= */

function addTask(name){
    let d=document.createElement("div");
    d.className="task";
    d.innerText=name;
    d.onclick=()=>state.windows[name].style.display="block";
    document.getElementById("tasks").appendChild(d);
}

/* =========================
   WINDOW ACTIONS
========================= */

function minimize(name){
    state.windows[name].style.display="none";
}

function closeW(name){
    state.windows[name].remove();
    delete state.windows[name];
}

/* =========================
   START MENU
========================= */

function toggleStart(){
    let m=document.getElementById("startMenu");
    m.style.display = m.style.display==="block"?"none":"block";
}

document.addEventListener("click",(e)=>{
    if(!e.target.closest("#startBtn") && !e.target.closest("#startMenu")){
        document.getElementById("startMenu").style.display="none";
    }
});

/* =========================
   SETTINGS
========================= */

function setBG(c){
    document.body.style.background=c;
    localStorage.setItem("bg",c);
}

function reset(){
    localStorage.clear();
    location.reload();
}

/* =========================
   DRAG WINDOWS
========================= */

function drag(el){
    let down=false,ox,oy;

    el.querySelector(".titlebar").addEventListener("mousedown",e=>{
        down=true;
        ox=e.clientX-el.offsetLeft;
        oy=e.clientY-el.offsetTop;
        el.style.zIndex=++z;
    });

    document.addEventListener("mousemove",e=>{
        if(down){
            el.style.left=(e.clientX-ox)+"px";
            el.style.top=(e.clientY-oy)+"px";
        }
    });

    document.addEventListener("mouseup",()=>down=false);
}

/* =========================
   INIT
========================= */

if(localStorage.getItem("bg")){
    document.body.style.background=localStorage.getItem("bg");
}

</script>

</body>
</html>
