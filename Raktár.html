<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Family Locator PRO</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#050505;
    color:white;
}

#map{
    height:100vh;
}

.panel{
    position:absolute;
    top:10px;
    left:10px;
    z-index:999;
    background:rgba(20,20,20,0.9);
    padding:15px;
    border-radius:15px;
    width:240px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 20px #00ff9944;
}

input, select{
    width:100%;
    padding:8px;
    margin:5px 0;
    border-radius:10px;
    border:none;
}

button{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.start{background:#00ff99;}
.sos{background:#ff0033;color:white;}

.status{
    font-size:12px;
    color:#aaa;
    margin-top:5px;
}

.badge{
    font-size:12px;
    margin-top:5px;
    color:#00ff99;
}

</style>
</head>

<body>

<div class="panel">

    <input id="name" placeholder="Név">
    <input id="room" placeholder="Család ID (pl: csalad1)">

    <button class="start" onclick="start()">Start</button>
    <button class="sos" onclick="sos()">🚨 SOS</button>

    <div class="status" id="status">Offline</div>
    <div class="badge" id="battery">🔋 --%</div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getDatabase,
    ref,
    set,
    update,
    onValue,
    push
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

import {
    getStorage,
    ref as sRef,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

import {
    getMessaging,
    getToken
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:3797a2fc935c63a0464b89",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const storage = getStorage(app);

// MAP
const map = L.map('map').setView([47.4979,19.0402],12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

const markers = {};
let username = "";
let room = "";
let lastPos = null;

// ---------------- START TRACKING ----------------
window.start = function(){

    username = document.getElementById("name").value;
    room = document.getElementById("room").value;

    if(!username || !room) return alert("Add meg adatokat");

    document.getElementById("status").innerText = "Online 🟢";

    // battery
    navigator.getBattery?.().then(b => {
        setInterval(()=>{
            document.getElementById("battery").innerText =
                "🔋 " + Math.round(b.level*100) + "%";

            update(ref(db, `rooms/${room}/users/${username}`),{
                battery: b.level*100
            });

        },5000);
    });

    // GPS
    navigator.geolocation.watchPosition(pos => {

        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const speed = pos.coords.speed ? pos.coords.speed * 3.6 : 0;

        lastPos = {lat, lon};

        set(ref(db, `rooms/${room}/users/${username}`),{
            lat,
            lon,
            speed,
            online:true,
            lastSeen:Date.now(),
            route:true
        });

    });

};

// ---------------- REALTIME MAP ----------------
onValue(ref(db, "rooms"), snap => {

    const rooms = snap.val();
    if(!rooms) return;

    Object.keys(rooms).forEach(r => {

        const users = rooms[r].users || {};

        Object.keys(users).forEach(u => {

            const data = users[u];

            const key = r + "_" + u;

            const iconColor =
                data.sos ? "red" : "green";

            if(markers[key]){

                markers[key].setLatLng([data.lat,data.lon]);

            }else{

                markers[key] =
                    L.marker([data.lat,data.lon])
                    .addTo(map)
                    .bindPopup(`
                        <b>${u}</b><br>
                        Room: ${r}<br>
                        Speed: ${data.speed?.toFixed(1)} km/h<br>
                        Battery: ${data.battery || "--"}%<br>
                        ${data.sos ? "🚨 SOS" : ""}
                    `);

            }

        });

    });

});

// ---------------- SOS ----------------
window.sos = function(){

    if(!username || !room) return;

    update(ref(db, `rooms/${room}/users/${username}`),{
        sos:true,
        lastSeen:Date.now()
    });

    alert("🚨 SOS elküldve");
};

</script>

</body>
</html>
