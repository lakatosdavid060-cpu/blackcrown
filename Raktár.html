<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Family Locator PRO MAX</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#050505;
    overflow:hidden;
}

/* MAP */
#map{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100vh;
    z-index:1;
    filter:brightness(0.85) contrast(1.1);
}

/* UI LAYER */
.ui-layer{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:999999;
    pointer-events:none;
}

/* FAB BUTTON */
.fab{
    position:absolute;
    top:15px;
    left:15px;
    width:55px;
    height:55px;
    border-radius:50%;
    border:none;
    background:#00ff99;
    font-size:22px;
    box-shadow:0 0 20px #00ff99aa;
    cursor:pointer;
    pointer-events:auto;
}

/* PANEL */
.panel{
    position:absolute;
    top:80px;
    left:15px;
    width:270px;
    background:rgba(20,20,20,0.92);
    backdrop-filter:blur(15px);
    padding:15px;
    border-radius:18px;
    box-shadow:0 0 25px rgba(0,255,153,0.2);
    transform:translateX(-120%);
    transition:0.3s;
    pointer-events:auto;
}

.panel.open{
    transform:translateX(0);
}

input{
    width:100%;
    padding:8px;
    margin:5px 0;
    border:none;
    border-radius:10px;
}

button{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.start{background:#00ff99;}
.sos{background:#ff0033;color:white;}

.status{
    font-size:12px;
    color:#aaa;
    margin-top:5px;
}

.badge{
    font-size:12px;
    color:#00ff99;
    margin-top:5px;
}

/* SOS overlay */
.sos-alert{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(255,0,0,0.25);
    display:none;
    z-index:1000000;
}

</style>
</head>

<body>

<div class="sos-alert" id="sosAlert"></div>

<div class="ui-layer">

    <button class="fab" onclick="togglePanel()">☰</button>

    <div class="panel" id="panel">

        <input id="name" placeholder="Név">
        <input id="room" placeholder="Család ID">

        <button class="start" onclick="start()">Start tracking</button>
        <button class="sos" onclick="sos()">🚨 SOS</button>

        <div class="status" id="status">Offline</div>
        <div class="badge" id="battery">🔋 --%</div>

    </div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase,
  ref,
  set,
  update,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* 🔔 (FCM optional – csak alap struktúra) */
import {
  getMessaging,
  getToken
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:3797a2fc935c63a0464b89"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const messaging = getMessaging(app);

/* MAP */
const map = L.map('map').setView([47.4979,19.0402], 13);

L.tileLayer(
'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
).addTo(map);

/* SAFE ZONE */
const safeZone = {
    lat: 47.4979,
    lon: 19.0402,
    radius: 150
};

L.circle([safeZone.lat, safeZone.lon], {
    radius: safeZone.radius,
    color:"#00ff99",
    fillOpacity:0.1
}).addTo(map);

/* STATE */
let username = "";
let room = "";
let lastPos = null;

const markers = {};

/* UI */
window.togglePanel = function(){
    document.getElementById("panel").classList.toggle("open");
}

/* SAFE CHECK */
function checkZone(lat,lon){
    const d = map.distance([lat,lon],[safeZone.lat,safeZone.lon]);
    return d < safeZone.radius ? "inside" : "outside";
}

/* START */
window.start = function(){

    username = document.getElementById("name").value;
    room = document.getElementById("room").value;

    if(!username || !room){
        alert("Adj meg adatokat");
        return;
    }

    document.getElementById("status").innerText = "Online 🟢";

    /* BATTERY */
    navigator.getBattery?.().then(b => {

        setInterval(()=>{

            document.getElementById("battery").innerText =
                "🔋 " + Math.round(b.level*100) + "%";

        },5000);

    });

    /* PUSH TOKEN (optional) */
    getToken(messaging, {
        vapidKey: "VAPID_KEY_HERE"
    }).then(token => {

        set(ref(db, `rooms/${room}/tokens/${username}`),{
            token
        });

    }).catch(()=>{});

    /* GPS */
    navigator.geolocation.watchPosition(pos => {

        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const speed = pos.coords.speed ? pos.coords.speed * 3.6 : 0;

        lastPos = {lat, lon};

        const zone = checkZone(lat,lon);

        set(ref(db, `rooms/${room}/users/${username}`),{
            lat,
            lon,
            speed,
            zone,
            online:true,
            lastSeen:Date.now(),
            sos:false
        });

    },{
        enableHighAccuracy:true
    });

};

/* REALTIME MAP */
onValue(ref(db,"rooms"), snap => {

    const rooms = snap.val();
    if(!rooms) return;

    Object.keys(rooms).forEach(r => {

        const users = rooms[r].users || {};

        Object.keys(users).forEach(u => {

            const d = users[u];
            const key = r+"_"+u;

            if(!d.lat || !d.lon) return;

            if(markers[key]){
                markers[key].setLatLng([d.lat,d.lon]);
            } else {

                markers[key] = L.circleMarker([d.lat,d.lon],{
                    radius:8,
                    color:d.sos ? "red" : "#00ff99"
                }).addTo(map)
                .bindPopup(`
                    <b>${u}</b><br>
                    🚗 ${d.speed?.toFixed(1) || 0} km/h<br>
                    🏠 ${d.zone || "?"}<br>
                    ${d.sos ? "🚨 SOS" : ""}
                `);
            }

            if(d.sos){
                document.getElementById("sosAlert").style.display="block";
            }

        });

    });

});

/* SOS */
window.sos = function(){

    if(!username || !room) return;

    update(ref(db, `rooms/${room}/users/${username}`),{
        sos:true,
        lastSeen:Date.now()
    });

    alert("🚨 SOS elküldve!");
};

</script>

</body>
</html>
