<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <title>Képernyő megosztás</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 40px;
      background: #111;
      color: white;
    }

    video {
      width: 80%;
      max-width: 900px;
      border: 2px solid #444;
      border-radius: 10px;
      margin-top: 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Képernyő megosztó demo</h1>

  <button id="startBtn">Képernyő megosztása</button>

  <div>
    <video id="screenVideo" autoplay playsinline></video>
  </div>

  <script>
    const btn = document.getElementById("startBtn");
    const video = document.getElementById("screenVideo");

    btn.addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: true,
          audio: true
        });

        video.srcObject = stream;

        // Ha a user leállítja a megosztást
        stream.getVideoTracks()[0].addEventListener("ended", () => {
          video.srcObject = null;
        });

      } catch (err) {
        console.error("Hiba a képernyő megosztásnál:", err);
        alert("Nem sikerült elindítani a képernyő megosztást.");
      }
    });
  </script>

</body>
</html>
