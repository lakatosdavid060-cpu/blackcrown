<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>RP Firebase Rendszer</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0f172a;
    font-family: Arial;
    color: white;
}

.container {
    width: 420px;
    padding: 20px;
    border-radius: 15px;
    background: rgba(255,255,255,0.08);
}

input, select {
    width: 100%;
    padding: 8px;
    margin: 6px 0;
    border-radius: 8px;
    border: none;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 8px;
    border: none;
    background: #5865F2;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="container">
    <h2>🔥 RP Rendszer</h2>

    <!-- fix nevek -->
    <select id="nameSelect"></select>

    <!-- új név -->
    <input type="text" id="newName" placeholder="Új név hozzáadása">
    <button onclick="addName()">➕ Név hozzáadása</button>

    <hr>

    <h3>Tevékenységek</h3>

    <label><input type="checkbox" value="Automatarablás" class="job"> Automatarablás</label>
    <label><input type="checkbox" value="Bankrablás" class="job"> Bankrablás</label>
    <label><input type="checkbox" value="Bobcat" class="job"> Bobcat</label>
    <label><input type="checkbox" value="Craft" class="job"> Craft</label>
    <label><input type="checkbox" value="Házrablás" class="job"> Házrablás</label>
    <label><input type="checkbox" value="Múzeumrablás" class="job"> Múzeumrablás</label>

    <h3>🚗 Autólopás</h3>
    <input type="number" id="carCount" placeholder="db">

    <button onclick="send()">📤 Küldés Discordra</button>
</div>

<script>
// 🔥 FIREBASE CONFIG (IDE A SAJÁTOD KELL)
const firebaseConfig = {
    apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
    authDomain: "ordog-fizetes.firebaseapp.com",
    databaseURL: "https://ordog-fizetes-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "ordog-fizetes",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const nameSelect = document.getElementById("nameSelect");

// 🔄 nevek betöltése
function loadNames() {
    db.ref("names").on("value", (snap) => {
        nameSelect.innerHTML = "";
        snap.forEach(child => {
            let option = document.createElement("option");
            option.value = child.val();
            option.innerText = child.val();
            nameSelect.appendChild(option);
        });
    });
}
loadNames();

// ➕ új név
function addName() {
    const newName = document.getElementById("newName").value;
    if (!newName) return;

    db.ref("names").push(newName);
    document.getElementById("newName").value = "";
}

// 📤 küldés + számolás
function send() {
    const PRICE = 500;

    const name = nameSelect.value;

    let jobs = [];
    document.querySelectorAll(".job").forEach(cb => {
        if (cb.checked) jobs.push(cb.value);
    });

    let carCount = parseInt(document.getElementById("carCount").value || 0);

    let jobMoney = jobs.length * PRICE;
    let carMoney = carCount * PRICE;
    let total = jobMoney + carMoney;

    const embed = {
        username: "RP Rendszer",
        embeds: [
            {
                title: "📋 RP Log",
                color: 7506394,
                fields: [
                    { name: "👤 Név", value: name },
                    { name: "🧰 Munkák", value: jobs.join(", ") || "Nincs" },
                    { name: "🚗 Autólopás", value: carCount + " db (" + carMoney + "$)" },
                    { name: "💰 Végösszeg", value: "**" + total + "$**" }
                ]
            }
        ]
    };

    fetch("WEBHOOK_URL_IDE", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(embed)
    });

    alert("Elküldve!");
}
</script>

</body>
</html>
