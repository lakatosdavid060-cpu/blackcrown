<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>SaaS Billing Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  onSnapshot,
  doc,
  getDoc,
  setDoc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyBgbixws2rf6VdqjQATVwZsKg0lgiqy0xI",
  authDomain: "ordog-fizetes.firebaseapp.com",
  projectId: "ordog-fizetes",
  storageBucket: "ordog-fizetes.firebasestorage.app",
  messagingSenderId: "672089263660",
  appId: "1:672089263660:web:3797a2fc935c63a0464b89"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* STATE */
let invoices = [];
let currentCompany = "ceg1";
let chart;

/* =========================
   INVOICE NUMBER
========================= */
async function getInvoiceNumber() {
  const date = new Date();
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");

  const id = `${currentCompany}_${y}_${m}`;
  const ref = doc(db,"counters",id);
  const snap = await getDoc(ref);

  let last = snap.exists()?snap.data().last:0;
  last++;

  await setDoc(ref,{last});

  return `INV-${y}-${m}-${String(last).padStart(5,"0")}`;
}

/* =========================
   CREATE INVOICE
========================= */
window.createInvoice = async function() {
  const customer = document.getElementById("customer").value;
  const qty = Number(document.getElementById("qty").value);
  const price = Number(document.getElementById("price").value);

  if(!customer||!qty||!price) return;

  const net = qty*price;
  const vat = net*0.27;
  const gross = net+vat;

  const number = await getInvoiceNumber();

  await addDoc(collection(db,"invoices"),{
    invoiceNumber:number,
    companyId:currentCompany,
    customer,
    qty,
    price,
    net,
    vat,
    gross,
    locked:false,
    status:"draft",
    createdAt:new Date()
  });

  document.getElementById("customer").value="";
};

/* =========================
   REALTIME
========================= */
onSnapshot(collection(db,"invoices"),(snap)=>{
  invoices = snap.docs.map(d=>({id:d.id,...d.data()}))
    .filter(i=>i.companyId===currentCompany);

  render();
  renderChart();
});

/* =========================
   RENDER UI
========================= */
function render(){
  const list=document.getElementById("list");
  list.innerHTML="";

  let total=0;

  invoices.forEach(i=>{
    total+=i.gross;

    const row=document.createElement("div");
    row.className="row";

    row.innerHTML=`
      <div>${i.invoiceNumber}</div>
      <div>${i.customer}</div>
      <div>${i.net.toFixed(0)} Ft</div>
      <div>${i.vat.toFixed(0)} Ft</div>
      <div><b>${i.gross.toFixed(0)} Ft</b></div>
      <div>${i.locked?"🔒":"🟢"}</div>
      <div class="actions">
        <button onclick="pdf('${i.invoiceNumber}')">PDF</button>
        <button onclick="lock('${i.id}')">Lock</button>
      </div>
    `;
    list.appendChild(row);
  });

  document.getElementById("total").innerText=total.toFixed(0);
}

/* =========================
   LOCK
========================= */
window.lock = async function(id){
  await updateDoc(doc(db,"invoices",id),{
    locked:true,
    status:"issued"
  });
};

/* =========================
   PDF
========================= */
window.pdf = function(num){
  const i=invoices.find(x=>x.invoiceNumber===num);
  const {jsPDF}=window.jspdf;
  const d=new jsPDF();

  d.setFontSize(16);
  d.text("INVOICE",10,10);

  d.setFontSize(10);
  d.text(`Number: ${i.invoiceNumber}`,10,20);
  d.text(`Customer: ${i.customer}`,10,30);

  d.text(`Net: ${i.net}`,10,50);
  d.text(`VAT: ${i.vat}`,10,60);
  d.text(`Gross: ${i.gross}`,10,70);

  d.save(i.invoiceNumber+".pdf");
};

/* =========================
   CHART
========================= */
function renderChart(){
  const sum=invoices.reduce((a,b)=>a+b.gross,0);

  if(chart)chart.destroy();

  chart=new Chart(document.getElementById("chart"),{
    type:"doughnut",
    data:{
      labels:["Revenue"],
      datasets:[{data:[sum]}]
    }
  });
}
</script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  display:flex;
}

.sidebar{
  width:220px;
  background:#111827;
  padding:20px;
  height:100vh;
}

.main{
  flex:1;
  padding:20px;
}

.card{
  background:#1f2937;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:6px;
  border:none;
}

button{
  padding:8px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr 1fr 1fr 1fr;
  gap:10px;
  padding:10px;
  border-bottom:1px solid #374151;
  font-size:12px;
}

.actions button{
  margin-right:5px;
}
</style>

</head>

<body>

<div class="sidebar">
  <h3>💼 SaaS Billing</h3>
</div>

<div class="main">

  <div class="card">
    <h3>Új számla</h3>
    <input id="customer" placeholder="Ügyfél">
    <input id="qty" type="number" placeholder="Mennyiség">
    <input id="price" type="number" placeholder="Ár">

    <button onclick="createInvoice()">Létrehozás</button>
  </div>

  <div class="card">
    <h3>📊 Dashboard</h3>
    <canvas id="chart"></canvas>
    <h2>Total: <span id="total">0</span> Ft</h2>
  </div>

  <div class="card">
    <h3>📄 Számlák</h3>
    <div id="list"></div>
  </div>

</div>

</body>
</html>
